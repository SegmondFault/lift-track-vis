              inputs: ["current-vs-past arm", "waist", "bodyweight", "overall strength index"],
              notes: `Raises body-fat estimate for older heavier points when arms/strength were lower, so weight alone cannot create a false FFMI peak. Arm gap ${formatNumber(armBehindReference, 1)}cm; strength gap ${formatNumber(strengthBehindReference * 100, 1)}%.`,
            })
          );
        }

        const totalWeight = votes.reduce((sum, vote) => sum + vote.weight, 0);
        const normalisedVotes = totalWeight
          ? votes.map((vote) => ({ ...vote, normalisedWeight: vote.weight / totalWeight }))
          : votes;
        const ensembleBodyFat = totalWeight
          ? votes.reduce((sum, vote) => sum + vote.value * vote.weight, 0) / totalWeight
          : rawBodyFat;
        const variance = totalWeight
          ? votes.reduce((sum, vote) => sum + Math.pow(vote.value - ensembleBodyFat, 2) * vote.weight, 0) / totalWeight
          : 0;
        const spread = Math.sqrt(Math.max(0, variance));
        const band = clamp(
          Math.max(2.8, spread * 1.25 + number(modelSigma) * 0.55 + stalePenalty * 0.75 + interpolationPenalty * 0.45),
          2.8,
          8.5
        );

        return {
          bodyFat: clamp(ensembleBodyFat, 5, 45),
          low: clamp(ensembleBodyFat - band, 4, 45),
          high: clamp(ensembleBodyFat + band, 5, 55),
          band,
          spread,
          waistTrust,
          recompositionSignal,
          longitudinalMismatch,
          votes: normalisedVotes,
        };
      }

      function monthsBetweenIso(startIso, endIso) {
        const start = dateFromIsoDay(startIso);
        const end = dateFromIsoDay(endIso);
        if (!start || !end) return null;
        return (end - start) / (365.25 / 12 * 24 * 60 * 60 * 1000);
      }

      function addMonthsIsoDay(value, months) {
        const date = dateFromIsoDay(value);
        if (!date) return null;
        const day = date.getUTCDate();
        date.setUTCMonth(date.getUTCMonth() + months);
        if (date.getUTCDate() !== day) date.setUTCDate(0);
        return date.toISOString().slice(0, 10);
      }

      function mean(values) {
        const valid = values.filter(Number.isFinite);
        return valid.length ? valid.reduce((sum, value) => sum + value, 0) / valid.length : null;
      }

      function growthStrengthCompositeSeries(summary) {
        const priorityExerciseIds = ["bench-press", "overhead-press", "squat", "deadlift", "pull-up", "incline-bench-press", "landmine-row"];
        const bestByKey = new Map();
        for (const row of summary.exerciseWeeklyBest || []) {
          const key = `${row.exerciseId}:${row.variationId}`;
          const tags = exerciseTags.get(row.exerciseId) || [];
          if (!priorityExerciseIds.includes(row.exerciseId) && !tags.includes("compound")) continue;
          const previous = bestByKey.get(key);
          if (!previous || row.e1rm > previous.e1rm) bestByKey.set(key, row);
        }
        const selectedKeys = [...bestByKey.keys()].slice(0, 10);
        const valuesByWeek = new Map();
        for (const row of summary.exerciseWeeklyBest || []) {
          const key = `${row.exerciseId}:${row.variationId}`;
          const best = bestByKey.get(key);
          if (!best || !selectedKeys.includes(key) || !best.e1rm) continue;
          const current = valuesByWeek.get(row.week) || [];
          current.push(row.e1rm / best.e1rm);
          valuesByWeek.set(row.week, current);
        }
        return [...valuesByWeek.entries()]
          .map(([week, values]) => ({ week, value: mean(values) || 0 }))
          .sort((a, b) => a.week.localeCompare(b.week));
      }

      function trendFractionAtWeek(series, week, recentCount = 6, priorCount = 6) {
        const rows = (series || []).filter((row) => row.week <= week && Number.isFinite(row.value)).sort((a, b) => a.week.localeCompare(b.week));
        if (rows.length < 2) return 0;
        const recent = rows.slice(-recentCount);
        const prior = rows.slice(-(recentCount + priorCount), -recentCount);
        const recentMean = mean(recent.map((row) => row.value));
        const priorMean = mean(prior.map((row) => row.value));
        if (Number.isFinite(recentMean) && Number.isFinite(priorMean) && priorMean > 0) {
          return clamp((recentMean - priorMean) / priorMean, -0.25, 0.35);
        }
        const first = rows[0].value;
        const last = rows.at(-1).value;
        return first > 0 ? clamp((last - first) / first, -0.25, 0.35) : 0;
      }

      function metricSlopePerMonth(rows, key, lookbackWeeks = 16) {
        const valid = (rows || [])
          .filter((row) => row.week && Number.isFinite(row[key]))
          .sort((a, b) => a.week.localeCompare(b.week));
        if (valid.length < 2) return 0;
        const latestWeek = valid.at(-1).week;
        const cutoff = addWeek(latestWeek, -lookbackWeeks);
        const recent = valid.filter((row) => row.week >= cutoff);
        const scoped = recent.length >= 2 ? recent : valid.slice(-Math.min(valid.length, 6));
        const first = scoped[0];
        const last = scoped.at(-1);
        const months = monthsBetweenIso(first.week, last.week);
        if (!months || months <= 0) return 0;
        return (last[key] - first[key]) / months;
      }

      function measurementValue(row, key) {
        return Number(row?.measurements?.[key]?.value);
      }

      function measurementReliability(measurement) {
        if (!measurement || !Number.isFinite(Number(measurement.value))) return 0;
        const days = Number(measurement.daysFromMeasurement);
        const futureCarryMultiplier = measurement.status === "carried" && measurement.direction === "future" ? 0.48 : 1;
        if (measurement.status === "measured") return 1;
        if (measurement.status === "interpolated") return clamp(1 - (Number.isFinite(days) ? days : 90) / 240, 0.35, 0.85);
        return clamp((1 - (Number.isFinite(days) ? days : 365) / 540) * futureCarryMultiplier, 0.08, 0.5);
      }

      function applyTrainedLifterAdjustments(rows, summary, profile, heightM) {
        if (!rows.length) return rows;
        const strengthSeries = growthStrengthCompositeSeries(summary);
        const setting = morphologyAdjustmentStrengthOptions[profile.morphologyAdjustmentStrength] || morphologyAdjustmentStrengthOptions.moderate;
        const policyFactor =
          profile.growthModelSourcePolicy === "strict evidence"
            ? 0.75
            : profile.growthModelSourcePolicy === "exploratory hybrid"
              ? 1.15
              : 1;
        const baseline = rows.find((row) => Number.isFinite(measurementValue(row, "upperArm"))) || rows[0];
        const reference = rows.at(-1) || baseline;
        const referenceArm = measurementValue(reference, "upperArm");
        const referenceWaist = measurementValue(reference, "waist");
        const referenceStrength = Number(reference.strengthValue);
        const heightSquared = heightM ** 2;
        let bestBaseFfmiSoFar = rows[0]?.ensembleFfmi || rows[0]?.ffmi || 0;

        return rows.map((row, index) => {
          const previous = rows[Math.max(0, index - 1)] || baseline;
          const baseFfmi = Number.isFinite(row.ensembleFfmi) ? row.ensembleFfmi : row.ffmi;
          const previousBaseFfmi = Number.isFinite(previous.ensembleFfmi) ? previous.ensembleFfmi : previous.ffmi;
          const armMeasurement = row.measurements?.upperArm;
          const previousArmMeasurement = previous.measurements?.upperArm;
          const baselineArmMeasurement = baseline.measurements?.upperArm;
          const waistMeasurement = row.measurements?.waist;
          const baselineWaistMeasurement = baseline.measurements?.waist;
          const chestMeasurement = row.measurements?.chest;
          const calfMeasurement = row.measurements?.calf;
          const neckMeasurement = row.measurements?.neck;
          const arm = measurementValue(row, "upperArm");
          const baselineArm = Number(baselineArmMeasurement?.value);
          const previousArm = Number(previousArmMeasurement?.value);
          const waist = measurementValue(row, "waist");
          const baselineWaist = Number(baselineWaistMeasurement?.value);
          const chest = Number(chestMeasurement?.value);
          const calf = Number(calfMeasurement?.value);
          const neck = Number(neckMeasurement?.value);
          const armDelta = Number.isFinite(arm) && Number.isFinite(baselineArm) ? arm - baselineArm : 0;
          const recentArmDelta = Number.isFinite(arm) && Number.isFinite(previousArm) ? arm - previousArm : 0;
          const weightDelta = row.bodyWeight - baseline.bodyWeight;
          const waistDelta = Number.isFinite(waist) && Number.isFinite(baselineWaist) ? waist - baselineWaist : 0;
          const strengthTrend = trendFractionAtWeek(strengthSeries, row.week);
          const strengthValue = Number(row.strengthValue);
          const armBehindReference = Number.isFinite(arm) && Number.isFinite(referenceArm) ? Math.max(0, referenceArm - arm) : 0;
          const waistAboveReference = Number.isFinite(waist) && Number.isFinite(referenceWaist) ? Math.max(0, waist - referenceWaist) : 0;
          const strengthBehindReference =
            Number.isFinite(strengthValue) && Number.isFinite(referenceStrength) && referenceStrength > 0
              ? Math.max(0, (referenceStrength - strengthValue) / referenceStrength)
              : 0;
          const reasons = [];
          let evidence = 0;
          const armReliability = measurementReliability(armMeasurement);
          const waistReliability = measurementReliability(waistMeasurement);
          const rawDropFromPeak = Math.max(0, bestBaseFfmiSoFar - baseFfmi);

          if (armDelta > 0.4 && weightDelta <= 0.75 && waistDelta <= 0.75) {
            const contribution = clamp(armDelta * 0.18 * armReliability, 0, 0.5);
            evidence += contribution;
            reasons.push(`arm +${formatNumber(armDelta, 1)}cm while weight/waist did not rise (${formatNumber(contribution, 2)} FFMI)`);
          } else if (armDelta > 0.4 && waistDelta <= 1.5) {
            const contribution = clamp(armDelta * 0.1 * armReliability, 0, 0.28);
            evidence += contribution;
            reasons.push(`arm +${formatNumber(armDelta, 1)}cm with stable-ish waist (${formatNumber(contribution, 2)} FFMI)`);
          }

          if (recentArmDelta > 0.2 && previousBaseFfmi - baseFfmi > 0.05) {
            const contribution = 0.08 * armReliability;
            evidence += contribution;
            reasons.push(`recent arm gain opposes a raw lean-mass drop (${formatNumber(contribution, 2)} FFMI)`);
          }

          if (armDelta > 0.6 && weightDelta <= 0.25 && waistDelta <= 0 && rawDropFromPeak > 0.05) {
            const contribution = clamp(rawDropFromPeak * 0.45 * Math.min(armReliability, waistReliability || 1), 0, 0.35);
            evidence += contribution;
            reasons.push(`recomposition guard: raw FFMI is ${formatNumber(rawDropFromPeak, 2)} below prior peak while arm is up and waist is lower (${formatNumber(contribution, 2)} FFMI)`);
          }

          if (armDelta > 0.5 && weightDelta < -1 && waistDelta < -0.5) {
            const contribution = clamp(Math.min(Math.abs(weightDelta) * 0.035, Math.abs(waistDelta) * 0.07) * armReliability, 0, 0.22);
            evidence += contribution;
            reasons.push(`cutting guard: weight/waist fell while arm stayed larger (${formatNumber(contribution, 2)} FFMI)`);
          }

          const hasMorphologySignal = armDelta > 0.2 || recentArmDelta > 0.1 || waistDelta < -0.5 || evidence > 0;
          if (hasMorphologySignal && strengthTrend >= -0.03) {
            const contribution = clamp(0.04 + strengthTrend * 0.35, 0, 0.16);
            evidence += contribution;
            reasons.push(`strength trend ${strengthTrend >= 0 ? "+" : ""}${formatNumber(strengthTrend * 100, 1)}% (${formatNumber(contribution, 2)} FFMI)`);
          }

          const frameSignals = [];
          if (Number.isFinite(chest) && chest >= 115) frameSignals.push(["chest", measurementReliability(chestMeasurement)]);
          if (Number.isFinite(calf) && calf >= 45) frameSignals.push(["calf", measurementReliability(calfMeasurement)]);
          if (Number.isFinite(neck) && neck >= 40) frameSignals.push(["neck", measurementReliability(neckMeasurement)]);
          if (frameSignals.length) {
            const weightedSignals = frameSignals.reduce((sum, [, reliability]) => sum + reliability, 0);
            const contribution = Math.min(0.18, weightedSignals * 0.055);
            evidence += contribution;
            reasons.push(`large-frame support from ${frameSignals.map(([label]) => label).join(", ")} (${formatNumber(contribution, 2)} FFMI; stale/carried measurements are damped)`);
          }

          const positiveEvidenceTrust =
            row.week < reference.week
              ? clamp(
                  1 -
                    (armBehindReference > 0.4 ? (armBehindReference - 0.4) * 0.22 : 0) -
                    strengthBehindReference * 1.05 -
                    (row.longitudinalMismatch || 0) * 0.45,
                  0.22,
                  1,
                )
              : 1;
          if (positiveEvidenceTrust < 0.95) {
            evidence *= positiveEvidenceTrust;
            reasons.push(`positive morphology evidence damped by latest arm/strength gap (${formatNumber(positiveEvidenceTrust * 100, 0)}% trust)`);
          }

          if (waistDelta > 2 && weightDelta >= 0) {
            evidence *= 0.45;
            reasons.push("waist/weight rose together, so morphology correction is damped");
          }

          const retrospectivePenalty =
            row.week < reference.week && (armBehindReference > 0.45 || strengthBehindReference > 0.06)
              ? clamp(
                  armBehindReference * 0.38 * Math.max(0.45, armReliability) +
                    waistAboveReference * 0.05 * Math.max(0.45, waistReliability || 0.5) +
                    strengthBehindReference * 0.75 +
                    (row.longitudinalMismatch || 0) * 0.24,
                  0,
                  setting.cap,
                )
              : 0;
          if (retrospectivePenalty > 0.03) {
            reasons.push(
              `retrospective morphology check: arm ${formatNumber(armBehindReference, 1)}cm and strength ${formatNumber(strengthBehindReference * 100, 1)}% below latest evidence (${formatNumber(-retrospectivePenalty, 2)} FFMI)`,
            );
          }

          const adjustment = clamp(evidence * setting.factor * policyFactor - retrospectivePenalty, -setting.cap, setting.cap);
          const trainedFfmi = baseFfmi + adjustment;
          const baseLow = Number.isFinite(row.ensembleFfmiLow) ? row.ensembleFfmiLow : row.ffmiLow;
          const baseHigh = Number.isFinite(row.ensembleFfmiHigh) ? row.ensembleFfmiHigh : row.ffmiHigh;
          const halfBand = Math.max(baseHigh - baseFfmi, baseFfmi - baseLow, 0.6) + 0.15 + Math.abs(adjustment) * 0.7;
          const trainedFatFreeMass = trainedFfmi * heightSquared;
          const trainedFatFreeMassBand = halfBand * heightSquared;
          const trainedBodyFat = clamp((1 - trainedFatFreeMass / row.bodyWeight) * 100, 5, 45);
          bestBaseFfmiSoFar = Math.max(bestBaseFfmiSoFar, baseFfmi);
          return {
            ...row,
            trainedFfmi,
            trainedFfmiLow: Math.max(0, trainedFfmi - halfBand),
            trainedFfmiHigh: trainedFfmi + halfBand,
            trainedFatFreeMass,
            trainedFatFreeMassLow: Math.max(0, trainedFatFreeMass - trainedFatFreeMassBand),
            trainedFatFreeMassHigh: trainedFatFreeMass + trainedFatFreeMassBand,
            trainedBodyFat,
            trainedBodyFatLow: clamp((1 - (trainedFatFreeMass + trainedFatFreeMassBand) / row.bodyWeight) * 100, 5, 45),
            trainedBodyFatHigh: clamp((1 - Math.max(0, trainedFatFreeMass - trainedFatFreeMassBand) / row.bodyWeight) * 100, 5, 45),
            morphologyAdjustment: adjustment,
            ensembleDisagreement: baseFfmi - row.ffmi,
            modelDisagreement: trainedFfmi - row.ffmi,
            strengthTrendContribution: strengthTrend,
            morphologyAdjustmentReasons: reasons.length ? reasons : ["no signed morphology correction applied"],
            trainedProvenance: `${row.provenance} | ensemble FFMI ${formatNumber(baseFfmi, 2)}; trained-lifter signed morphology correction ${adjustment >= 0 ? "+" : ""}${formatNumber(adjustment, 2)} FFMI via ${profile.morphologyAdjustmentStrength} setting; ${reasons.join("; ") || "no correction"}`,
          };
        });
      }

      function bodyCompositionSeries(summary) {
        const tables = summary.tables || {};
        const profile = userProfile(tables);
        const heightM = profile.heightCm / 100;
        const fatModel = bodyCompositionModel(tables, "body_fat_percent", profile.sex);
        const leanModel = bodyCompositionModel(tables, "fat_free_mass_kg", profile.sex);
        const appendicularModel = bodyCompositionModel(tables, "appendicular_lean_mass_kg", profile.sex);
        const bodyRows = weeklyBodyMetricRows(tables);
        const rows = [];
        const strengthSeries = growthStrengthCompositeSeries(summary);
        const strengthValueAtOrBefore = (week) => {
          const available = strengthSeries
            .filter((row) => row.week <= week && Number.isFinite(row.value))
            .sort((a, b) => a.week.localeCompare(b.week));
          return available.at(-1)?.value ?? null;
        };
        const latestBodyRow = bodyRows.at(-1);
        let currentReferenceSnapshot = null;
        if (latestBodyRow) {
          const latestAtIso = `${latestBodyRow.week}T12:00:00.000Z`;
          const latestWaist = interpolateBodyMeasurement(tables, "waist", latestAtIso);
          const latestHip = interpolateBodyMeasurement(tables, "hip", latestAtIso);
          const latestUpperArm = interpolateBodyMeasurement(tables, "upper_arm", latestAtIso);
          const latestChest = interpolateBodyMeasurement(tables, "chest_under_arms", latestAtIso);
          const latestCalf = interpolateBodyMeasurement(tables, "calf", latestAtIso);
          const latestNeck = interpolateBodyMeasurement(tables, "neck", latestAtIso);
          currentReferenceSnapshot = {
            week: latestBodyRow.week,
            bodyWeight: latestBodyRow.bodyWeight,
            waist: latestWaist?.value,
            hip: latestHip?.value,
            upperArm: latestUpperArm?.value,
            chest: latestChest?.value,
            calf: latestCalf?.value,
            neck: latestNeck?.value,
            strengthValue: strengthValueAtOrBefore(latestBodyRow.week),
          };
        }
        let baselineSnapshot = null;

        for (const bodyRow of bodyRows) {
          const atIso = `${bodyRow.week}T12:00:00.000Z`;
          const waist = interpolateBodyMeasurement(tables, "waist", atIso);
          const hip = interpolateBodyMeasurement(tables, "hip", atIso);
          const upperArm = interpolateBodyMeasurement(tables, "upper_arm", atIso);
          const chest = interpolateBodyMeasurement(tables, "chest_under_arms", atIso);
          const calf = interpolateBodyMeasurement(tables, "calf", atIso);
          const neck = interpolateBodyMeasurement(tables, "neck", atIso);
          const ageYears = ageAtDate(profile.dob, atIso);
          if (!waist || !hip || !upperArm || !ageYears || !fatModel) continue;

          const features = {
            body_weight_kg: bodyRow.bodyWeight,
            height_cm: profile.heightCm,
            bmi: bodyRow.bodyWeight / (heightM ** 2),
            waist_cm: waist.value,
            hip_cm: hip.value,
            upper_arm_cm: upperArm.value,
            age_years: ageYears,
          };

          const rawBodyFatEstimate = predictBodyCompositionModel(fatModel, features);
          if (!Number.isFinite(rawBodyFatEstimate)) continue;
          const estimatedBodyFat = Math.min(45, Math.max(5, rawBodyFatEstimate));
          const modelLeanMass = predictBodyCompositionModel(leanModel, features);
          const estimatedFatFreeMass = bodyRow.bodyWeight * (1 - estimatedBodyFat / 100);
          const blendedFatFreeMass = Number.isFinite(modelLeanMass) ? estimatedFatFreeMass * 0.75 + modelLeanMass * 0.25 : estimatedFatFreeMass;
          const ffmi = blendedFatFreeMass / (heightM ** 2);
          const appendicularLean = predictBodyCompositionModel(appendicularModel, features);
          const almi = Number.isFinite(appendicularLean) ? appendicularLean / (heightM ** 2) : null;
          const muscleProxy = Number.isFinite(appendicularLean)
            ? (appendicularLean / bodyRow.bodyWeight) * 100
            : Math.max(0, (blendedFatFreeMass / bodyRow.bodyWeight) * 100 - 28);

          const interpolatedInputs = [waist, hip, upperArm].filter((item) => item.status !== "measured").length;
          const staleDays = Math.max(...[waist, hip, upperArm].map((item) => item.daysFromMeasurement || 0));
          const stalePenalty = Math.min(4, staleDays / 180);
          const interpolationPenalty = interpolatedInputs * 0.7;
          const bodyFatBand = (number(fatModel.residual_sigma) || 3.5) * number(fatModel.prediction_interval_multiplier || 1.96) + stalePenalty + interpolationPenalty;
          const leanBandFromFat = bodyRow.bodyWeight * (bodyFatBand / 100);
          const leanBand = Math.max(leanBandFromFat, number(leanModel?.residual_sigma) * 1.96 || leanBandFromFat);
          const measurementSnapshot = {
            bodyWeight: bodyRow.bodyWeight,
            waist: waist.value,
            hip: hip.value,
            upperArm: upperArm.value,
            chest: chest?.value,
            calf: calf?.value,
            neck: neck?.value,
          };
          if (!baselineSnapshot && Number.isFinite(measurementSnapshot.upperArm)) baselineSnapshot = measurementSnapshot;
          const strengthTrend = trendFractionAtWeek(strengthSeries, bodyRow.week);
          const strengthValue = strengthValueAtOrBefore(bodyRow.week);
          const bodyFatEnsemble = bodyFatEnsembleEstimate({
            profile,
            features,
            measurements: { waist, hip, upperArm, chest, calf, neck },
            bodyRow,
            rawBodyFat: estimatedBodyFat,
            modelSigma: number(fatModel.residual_sigma) || number(fatModel.rmse) || 3.5,
            stalePenalty,
            interpolationPenalty,
            baseline: baselineSnapshot || measurementSnapshot,
            currentReference: currentReferenceSnapshot || measurementSnapshot,
            strengthValue,
            strengthTrend,
          });
          const ensembleFatFreeMassFromFat = bodyRow.bodyWeight * (1 - bodyFatEnsemble.bodyFat / 100);
          const ensembleFatFreeMass = Number.isFinite(modelLeanMass)
            ? ensembleFatFreeMassFromFat * 0.85 + modelLeanMass * 0.15
            : ensembleFatFreeMassFromFat;
          const ensembleLeanBand = Math.max(bodyRow.bodyWeight * (bodyFatEnsemble.band / 100), leanBand * 0.55);
          const ensembleFfmi = ensembleFatFreeMass / (heightM ** 2);
          const appendicularBand = appendicularModel ? number(appendicularModel.residual_sigma) * 1.96 : null;
          const muscleBand = appendicularModel ? ((number(appendicularModel.residual_sigma) * 1.96) / bodyRow.bodyWeight) * 100 + stalePenalty * 0.25 : 3;
          const measurementText = [waist, hip, upperArm, chest, calf, neck]
            .filter(Boolean)
            .map((item) => {
              const status =
                item.status === "carried" && item.direction && item.direction !== "same-day"
                  ? `${item.direction}-carried`
                  : item.status;
              return `${item.type.replaceAll("_", " ")} ${formatNumber(item.value, 1)}cm (${status}, ${item.source})`;
            })
            .join("; ");
          const provenance = [
            `${formatWeekRange(bodyRow.week)}`,
            `weight ${formatNumber(bodyRow.bodyWeight, 1)}kg`,
            `age ${formatNumber(ageYears, 1)}`,
            measurementText,
            `model: ${fatModel.source}, ${fatModel.model_type}, n=${fatModel.sample_n}, RMSE ${formatNumber(number(fatModel.rmse), 2)}%`,
            bodyRow.loggedBodyFat ? `logged body-fat signal ${formatNumber(bodyRow.loggedBodyFat, 1)}% (shown for context, not used as calibration target)` : "",
          ].filter(Boolean).join(" | ");

          rows.push({
            week: bodyRow.week,
            measuredAt: bodyRow.measuredAt,
            bodyWeight: bodyRow.bodyWeight,
            estimatedBodyFat,
            bodyFatLow: Math.max(5, estimatedBodyFat - bodyFatBand),
            bodyFatHigh: Math.min(45, estimatedBodyFat + bodyFatBand),
            fatFreeMass: blendedFatFreeMass,
            fatFreeMassLow: Math.max(0, blendedFatFreeMass - leanBand),
            fatFreeMassHigh: blendedFatFreeMass + leanBand,
            ffmi,
            ffmiLow: Math.max(0, (blendedFatFreeMass - leanBand) / (heightM ** 2)),
            ffmiHigh: (blendedFatFreeMass + leanBand) / (heightM ** 2),
            ensembleBodyFat: bodyFatEnsemble.bodyFat,
            ensembleBodyFatLow: bodyFatEnsemble.low,
            ensembleBodyFatHigh: bodyFatEnsemble.high,
            ensembleFatFreeMass,
            ensembleFatFreeMassLow: Math.max(0, ensembleFatFreeMass - ensembleLeanBand),
            ensembleFatFreeMassHigh: ensembleFatFreeMass + ensembleLeanBand,
            ensembleFfmi,
            ensembleFfmiLow: Math.max(0, (ensembleFatFreeMass - ensembleLeanBand) / (heightM ** 2)),
            ensembleFfmiHigh: (ensembleFatFreeMass + ensembleLeanBand) / (heightM ** 2),
            bodyFatVotes: bodyFatEnsemble.votes,
            bodyFatEnsembleSpread: bodyFatEnsemble.spread,
            waistTrust: bodyFatEnsemble.waistTrust,
            recompositionSignal: bodyFatEnsemble.recompositionSignal,
            longitudinalMismatch: bodyFatEnsemble.longitudinalMismatch,
            strengthValue,
            appendicularLean,
            appendicularLeanLow: Number.isFinite(appendicularLean) && Number.isFinite(appendicularBand) ? Math.max(0, appendicularLean - appendicularBand) : null,
            appendicularLeanHigh: Number.isFinite(appendicularLean) && Number.isFinite(appendicularBand) ? appendicularLean + appendicularBand : null,
            almi,
            almiLow: Number.isFinite(almi) && Number.isFinite(appendicularBand) ? Math.max(0, (appendicularLean - appendicularBand) / (heightM ** 2)) : null,
            almiHigh: Number.isFinite(almi) && Number.isFinite(appendicularBand) ? (appendicularLean + appendicularBand) / (heightM ** 2) : null,
            muscleProxy,
            muscleProxyLow: Math.max(0, muscleProxy - muscleBand),
            muscleProxyHigh: muscleProxy + muscleBand,
            features,
            measurements: { waist, hip, upperArm, chest, calf, neck },
            inputStatus: interpolatedInputs ? "interpolated inputs" : "measured inputs",
            provenance,
          });
        }

        return {
          profile,
          rows: applyTrainedLifterAdjustments(rows, summary, profile, heightM),
          models: { fatModel, leanModel, appendicularModel },
        };
      }

      function athleteModelLabel(type) {
        return athleteModelTypeLabels[type] || type || "Athlete model";
      }

      function bodyCompositionReferenceRows(tables = {}) {
        return (tables.body_composition_reference || [])
          .filter((row) => row && !row.deleted_at && row.metric && row.athlete_type)
          .map((row) => ({
            ...row,
            mean: Number(row.mean),
            sd: Number(row.sd),
            age_min: Number(row.age_min),
            age_max: Number(row.age_max),
            n: Number(row.n),
          }))
          .filter((row) => Number.isFinite(row.mean) && Number.isFinite(row.sd) && Number.isFinite(row.age_min) && Number.isFinite(row.age_max));
      }

      function athleteReferenceAgeDistance(row, ageYears) {
        if (!Number.isFinite(ageYears)) return row.age_min <= 39 ? 0 : 100;
        if (ageYears >= row.age_min && ageYears <= row.age_max) return 0;
        return Math.min(Math.abs(ageYears - row.age_min), Math.abs(ageYears - row.age_max));
      }

      function athleteReferenceRowsForProfile(tables, profile, ageYears) {
        const rows = bodyCompositionReferenceRows(tables).filter((row) => row.sex === profile.sex);
        if (!rows.length) return [];
        const candidateBands = [...new Set(rows.map((row) => `${row.age_min}:${row.age_max}`))]
          .map((key) => {
            const [ageMin, ageMax] = key.split(":").map(Number);
            return { ageMin, ageMax, distance: athleteReferenceAgeDistance({ age_min: ageMin, age_max: ageMax }, ageYears) };
          })
          .sort((a, b) => a.distance - b.distance || a.ageMin - b.ageMin);
        const selected = candidateBands[0];
        return rows.filter((row) => row.age_min === selected.ageMin && row.age_max === selected.ageMax);
      }

      function athleteReferenceMetricMap(referenceRows, athleteType) {
        return new Map(
          referenceRows
            .filter((row) => row.athlete_type === athleteType)
            .map((row) => [row.metric, row]),
        );
      }

      function athleteMetricBand(row, metric, profile) {
        if (!row) return null;
        if (metric === "fat_free_mass_from_ffmi") {
          const heightM = profile.heightCm / 100;
          return {
            ...row,
            mean: row.mean * (heightM ** 2),
            sd: row.sd * (heightM ** 2),
            unit: "kg",
            metric,
          };
        }
        return row;
      }

      function athleteBlendedMetricBand(referenceRows, profile, metric, mix) {
        const sourceMetric = metric === "fat_free_mass_from_ffmi" ? "ffmi_derived" : metric;
        const fractions = athleteModelMixFractions(mix);
        const parts = athleteModelTypes
          .map((type) => {
            const row = athleteMetricBand(athleteReferenceMetricMap(referenceRows, type).get(sourceMetric), metric, profile);
            const weight = fractions[type] || 0;
            return row && weight > 0 ? { type, row, weight } : null;
          })
          .filter(Boolean);
        if (!parts.length) return null;
        const mean = parts.reduce((sum, item) => sum + item.weight * item.row.mean, 0);
        const secondMoment = parts.reduce((sum, item) => sum + item.weight * (item.row.sd ** 2 + item.row.mean ** 2), 0);
        const variance = Math.max(0, secondMoment - mean ** 2);
        const sourceRow = parts[0].row;
        return {
          ...sourceRow,
          metric,
          mean,
          sd: Math.sqrt(variance),
          n: parts.reduce((sum, item) => sum + item.weight * (Number(item.row.n) || 0), 0),
          athlete_type: "training-blend",
          label: "Training blend",
          source: "ATHLAS weighted athlete-type blend",
          is_blend: true,
          details: parts
            .map((item) => `${athleteModelLabel(item.type)} ${formatNumber(item.weight * 100, 0)}%: ${formatNumber(item.row.mean, 2)} +/- ${formatNumber(item.row.sd, 2)} ${item.row.unit || ""}`)
            .join("; "),
        };
      }

      function athleteReferenceBands(referenceRows, profile, metric, selectedType, mix = null) {
        const sourceMetric = metric === "fat_free_mass_from_ffmi" ? "ffmi_derived" : metric;
        const pureBands = athleteModelTypes
          .map((type) => {
            const row = athleteMetricBand(athleteReferenceMetricMap(referenceRows, type).get(sourceMetric), metric, profile);
            if (!row) return null;
            const low = row.mean - row.sd;
            const high = row.mean + row.sd;
            return {
              label: athleteModelLabel(type),
              low,
              value: row.mean,
              high,
              color: athleteModelTypeColors[type],
              opacity: type === selectedType ? 0.08 : 0.045,
              selected: false,
              title: `${athleteModelLabel(type)}, ${row.group_label}, n=${formatNumber(row.n, 0)}, ${row.metric}: ${formatNumber(row.mean, 2)} +/- ${formatNumber(row.sd, 2)} ${row.unit || ""}. Source ${row.source}; DOI ${row.doi}.`,
            };
          })
          .filter(Boolean);
        const blendRow = athleteBlendedMetricBand(referenceRows, profile, metric, mix || { [selectedType]: 100 });
        if (!blendRow) return pureBands;
        const blendLow = blendRow.mean - blendRow.sd;
        const blendHigh = blendRow.mean + blendRow.sd;
        return [
          ...pureBands,
          {
            label: "Training blend mean +/- 1 SD",
            low: blendLow,
            value: blendRow.mean,
            high: blendHigh,
            color: "#ffffff",
            opacity: 0.16,
            selected: true,
            title: `Weighted athlete reference blend: ${formatNumber(blendRow.mean, 2)} +/- ${formatNumber(blendRow.sd, 2)} ${blendRow.unit || ""}. ${blendRow.details}. Source ${blendRow.source}; DOI ${blendRow.doi}.`,
          },
        ];
      }

      function estimateVsSelectedBand(value, selectedBand, digits = 1) {
        if (!selectedBand || !Number.isFinite(value)) return "reference unavailable";
        if (value < selectedBand.low) return `below selected reference (${formatNumber(selectedBand.low, digits)}-${formatNumber(selectedBand.high, digits)})`;
        if (value > selectedBand.high) return `above selected reference (${formatNumber(selectedBand.low, digits)}-${formatNumber(selectedBand.high, digits)})`;
        return `inside selected reference (${formatNumber(selectedBand.low, digits)}-${formatNumber(selectedBand.high, digits)})`;
      }

      function athleteDistanceRows(compositionRows, referenceRows, profile, mix) {
        return compositionRows
          .map((row) => {
            const components = [
              ["body fat", Number.isFinite(row.ensembleBodyFat) ? row.ensembleBodyFat : row.estimatedBodyFat, athleteBlendedMetricBand(referenceRows, profile, "body_fat_percent", mix)],
              ["FFMI", Number.isFinite(row.trainedFfmi) ? row.trainedFfmi : Number.isFinite(row.ensembleFfmi) ? row.ensembleFfmi : row.ffmi, athleteBlendedMetricBand(referenceRows, profile, "ffmi_derived", mix)],
              ["ALMI", row.almi, athleteBlendedMetricBand(referenceRows, profile, "appendicular_lean_mass_index", mix)],
            ]
              .filter(([, value, reference]) => Number.isFinite(value) && reference && Number.isFinite(reference.sd) && reference.sd > 0)
              .map(([label, value, reference]) => ({
                label,
                z: (value - reference.mean) / reference.sd,
                value,
                reference,
              }));

            if (!components.length) return null;
            const distance = Math.sqrt(components.reduce((sum, item) => sum + item.z ** 2, 0) / components.length);
            const signedMean = components.reduce((sum, item) => sum + item.z, 0) / components.length;
            const details = components
              .map((item) => `${item.label} ${formatNumber(item.value, 2)} vs ${formatNumber(item.reference.mean, 2)} +/- ${formatNumber(item.reference.sd, 2)} (${formatNumber(item.z, 2)} SD)`)
              .join("; ");
            return {
              week: row.week,
              value: distance,
              low: Math.max(0, distance - 0.25),
              high: distance + 0.25,
              title: `${formatWeekRange(row.week)}: ${formatNumber(distance, 2)} SD average absolute distance from training-blend reference; signed mean ${formatNumber(signedMean, 2)} SD. ${details}`,
            };
          })
          .filter(Boolean);
      }

      function growthForecastModel(summary, composition = bodyCompositionSeries(summary)) {
        const { profile, rows } = composition;
        const latest = rows.at(-1);
        if (!latest) return null;

        const heightM = profile.heightCm / 100;
        const heightSquared = heightM ** 2;
        const latestAge = ageAtDate(profile.dob, latest.measuredAt);
        const referenceRows = athleteReferenceRowsForProfile(summary.tables || {}, profile, latestAge);
        const athleteBand = athleteBlendedMetricBand(referenceRows, profile, "ffmi_derived", profile.athleteModelMix);
        const strengthSeries = growthStrengthCompositeSeries(summary);
        const strengthTrend = trendFractionAtWeek(strengthSeries, latest.week);
        const ffmSlope = metricSlopePerMonth(rows, "trainedFatFreeMass", 16);
        const ensembleFfmSlope = metricSlopePerMonth(rows, "ensembleFatFreeMass", 16);
        const rawFfmSlope = metricSlopePerMonth(rows, "fatFreeMass", 16);
        const athleteFractions = athleteModelMixFractions(profile.athleteModelMix);
        const ageMonths = Math.max(
          0,
          (monthsBetweenIso(profile.resistanceTrainingStartedAt, latest.week) || 0) + profile.priorBackgroundCreditMonths,
        );
        const trainingAgePenalty = clamp(1 / (1 + Math.max(0, ageMonths - 9) / 18), 0.2, 1);
        const trendComponent = clamp(ffmSlope, -0.12, 0.24) * 0.4;
        const strengthComponent = clamp(strengthTrend * 0.25, -0.03, 0.075);
        const protectiveComponent = Math.max(0, latest.morphologyAdjustment || 0) * 0.035;
        const baseMonthlyFfmRate = clamp((trendComponent + strengthComponent + protectiveComponent + 0.045) * trainingAgePenalty, 0.01, 0.32);
        const chest = measurementValue(latest, "chest");
        const calf = measurementValue(latest, "calf");
        const neck = measurementValue(latest, "neck");
        const arm = measurementValue(latest, "upperArm");
        const frameSignal = clamp(
          (Number.isFinite(chest) ? (chest - 112) / 22 : 0) +
            (Number.isFinite(calf) ? (calf - 42) / 18 : 0) +
            (Number.isFinite(neck) ? (neck - 38) / 18 : 0) +
            (Number.isFinite(arm) ? (arm - 37) / 12 : 0),
          0,
          1,
        );
        const morphologyCeilingAllowance = clamp((latest.morphologyAdjustment || 0) * 0.3 + frameSignal * 0.18, 0, 0.38);
        const policyOffset =
          profile.growthModelSourcePolicy === "strict evidence"
            ? -0.18
            : profile.growthModelSourcePolicy === "exploratory hybrid"
              ? 0.25
              : 0;
        const blendNaturalCap =
          24.65 +
          (athleteFractions.strength || 0) * 0.45 +
          (athleteFractions.sprint || 0) * 0.25 -
          (athleteFractions.endurance || 0) * 0.15 -
          (athleteFractions["non-training-control"] || 0) * 0.35;
        const policyCapOffset =
          profile.growthModelSourcePolicy === "strict evidence"
            ? -0.25
            : profile.growthModelSourcePolicy === "exploratory hybrid"
              ? 0.35
              : 0;
        const naturalSoftCap = clamp(
          blendNaturalCap + policyCapOffset + morphologyCeilingAllowance * 0.35,
          latest.trainedFfmi + 0.45,
          profile.growthModelSourcePolicy === "exploratory hybrid" ? 25.8 : 25.35,
        );
        const referenceCeiling = athleteBand
          ? clamp(athleteBand.mean + athleteBand.sd * 0.25, latest.trainedFfmi + 0.35, naturalSoftCap + 0.2)
          : latest.trainedFfmi + 1.1;
        const effectiveGrowthHorizonMonths = 14 + trainingAgePenalty * 18;
        const projectedFfmGain = clamp(baseMonthlyFfmRate * effectiveGrowthHorizonMonths, 0.8, 6.2);
        const momentumCeiling = latest.trainedFfmi + projectedFfmGain / heightSquared + morphologyCeilingAllowance;
        const ceilingFfmi = clamp(
          referenceCeiling * 0.28 + momentumCeiling * 0.72 + policyOffset,
          latest.trainedFfmi + 0.3,
          naturalSoftCap,
        );
        const exceptionalCap = profile.growthModelSourcePolicy === "exploratory hybrid" ? 26.25 : 25.85;
        const ceilingLow = Math.max(latest.trainedFfmi + 0.12, ceilingFfmi - 0.55);
        const ceilingHigh = Math.min(exceptionalCap, Math.max(ceilingFfmi + 0.55, referenceCeiling + 0.25));
        const remainingFfm = Math.max(0, ceilingFfmi * heightSquared - latest.trainedFatFreeMass);
        const strengthSupportAllowance = clamp(Math.max(0, strengthTrend) * 1.2, 0, 0.35);
        const improvedTrainingPolicyOffset =
          profile.growthModelSourcePolicy === "strict evidence"
            ? -0.2
            : profile.growthModelSourcePolicy === "exploratory hybrid"
              ? 0.22
              : 0;
        const improvedTrainingPotentialFfmi = clamp(
          24.1 +
            (athleteFractions.strength || 0) * 0.42 +
            (athleteFractions.sprint || 0) * 0.15 -
            (athleteFractions.endurance || 0) * 0.06 -
            (athleteFractions["non-training-control"] || 0) * 0.25 +
            frameSignal * 0.38 +
            Math.min(0.22, (latest.morphologyAdjustment || 0) * 0.2) +
            strengthSupportAllowance * 0.45 +
            improvedTrainingPolicyOffset,
          latest.trainedFfmi + 0.65,
          profile.growthModelSourcePolicy === "exploratory hybrid" ? 25.85 : 25.45,
        );
        const improvedTrainingPotentialLow = Math.max(latest.trainedFfmi + 0.35, improvedTrainingPotentialFfmi - 0.45);
        const improvedTrainingPotentialHigh = Math.min(
          profile.growthModelSourcePolicy === "exploratory hybrid" ? 26.05 : 25.65,
          Math.max(improvedTrainingPotentialFfmi + 0.45, improvedTrainingPotentialLow + 0.35),
        );
        const statisticalOutlierUpperBound = Math.min(
          profile.growthModelSourcePolicy === "exploratory hybrid" ? 26.75 : 26.15,
          Math.max(
            improvedTrainingPotentialHigh + 0.25,
            improvedTrainingPotentialHigh + 0.35 + frameSignal * 0.12 + strengthSupportAllowance * 0.2,
          ),
        );
        const improvedTrainingRemainingFfm = Math.max(0, improvedTrainingPotentialFfmi * heightSquared - latest.trainedFatFreeMass);
        const outlierRemainingFfm = Math.max(0, statisticalOutlierUpperBound * heightSquared - latest.trainedFatFreeMass);
        const forecastStartWeek = latest.week;
        const forecastMonths = 60;
        const currentRateFfmi = baseMonthlyFfmRate / heightSquared;

        const makeForecast = (label, multiplier, targetCeilingFfmi) => {
          const gap = Math.max(0.05, targetCeilingFfmi - latest.trainedFfmi);
          const k = clamp((currentRateFfmi * multiplier) / gap, 0.004, 0.08);
          const rows = [];
          for (let month = 0; month <= forecastMonths; month += 1) {
            const date = addMonthsIsoDay(forecastStartWeek, month);
            const week = weekStart(date);
            const ffmi = targetCeilingFfmi - gap * Math.exp(-k * month);
            const fatFreeMass = ffmi * heightSquared;
            rows.push({ week, month, value: ffmi, fatFreeMass });
          }
          return { label, rows, k, ceilingFfmi: targetCeilingFfmi };
        };

        const currentTrajectory = makeForecast("Current trajectory", 0.85, ceilingFfmi);
        const improvedBase = makeForecast("Improved base", 1.05, improvedTrainingPotentialFfmi);
        const improvedHigh = makeForecast("Improved high", 1.25, improvedTrainingPotentialHigh);
        const rateRows = currentTrajectory.rows.slice(1).map((row, index) => {
          const previous = currentTrajectory.rows[index];
          return {
            week: row.week,
            value: Math.max(0, row.fatFreeMass - previous.fatFreeMass),
          };
        });

        return {
          profile,
          rows,
          latest,
          latestAge,
          referenceRows,
          athleteBand,
          strengthSeries,
          strengthTrend,
          ffmSlope,
          rawFfmSlope,
          ensembleFfmSlope,
          ageMonths,
          trainingAgePenalty,
          baseMonthlyFfmRate,
          trendComponent,
          strengthComponent,
          protectiveComponent,
          morphologyCeilingAllowance,
          naturalSoftCap,
          referenceCeiling,
          momentumCeiling,
          projectedFfmGain,
          effectiveGrowthHorizonMonths,
          ceilingFfmi,
          ceilingLow,
          ceilingHigh,
          expectedEndpointFfmi: ceilingFfmi,
          expectedEndpointLow: ceilingLow,
          expectedEndpointHigh: ceilingHigh,
          improvedTrainingPotentialFfmi,
          improvedTrainingPotentialLow,
          improvedTrainingPotentialHigh,
          statisticalOutlierUpperBound,
          lifetimePotentialFfmi: improvedTrainingPotentialFfmi,
          lifetimePotentialLow: improvedTrainingPotentialLow,
          lifetimePotentialHigh: statisticalOutlierUpperBound,
          remainingFfm,
          improvedTrainingRemainingFfm,
          outlierRemainingFfm,
          lifetimeRemainingFfm: improvedTrainingRemainingFfm,
          forecasts: [currentTrajectory, improvedBase, improvedHigh],
          rateRows,
          provenanceRows: [
            ["Raw estimate", "NHANES 2017-2018 DXA regression", `Current raw FFMI ${formatNumber(latest.ffmi, 2)}; raw FFM trend ${formatNumber(rawFfmSlope, 2)} kg/month. Raw NHANES remains visible and is not forced to match the trained-lifter adjustment.`],
            ["Body-fat ensemble", "NHANES + RFM + Navy-style + BAI + logged scale + morphology check", `Current ensemble FFMI ${formatNumber(latest.ensembleFfmi, 2)}; ensemble FFM trend ${formatNumber(ensembleFfmSlope, 2)} kg/month. Waist-derived formulas are down-weighted when morphology/strength signals disagree.`],
            ["Trained-lifter adjustment", "Signed longitudinal morphology correction", `Current adjustment ${latest.morphologyAdjustment >= 0 ? "+" : ""}${formatNumber(latest.morphologyAdjustment, 2)} FFMI. ${latest.morphologyAdjustmentReasons.join("; ")}.`],
            ["Strength trend", "Composite benchmark e1RM trend", `${formatNumber(strengthTrend * 100, 1)}% recent composite signal. Used as a trend guard/support term (${formatNumber(strengthComponent, 2)} kg/month), not as direct lean-mass proof.`],
            ["Training age", "Settings", `${formatNumber(ageMonths, 1)} effective months: start ${formatDate(profile.resistanceTrainingStartedAt)} + ${profile.priorBackgroundCreditMonths} months prior-background credit.`],
            ["Diminishing returns", "Evidence-first heuristic", `Near-term growth rate ${formatNumber(baseMonthlyFfmRate, 2)} kg FFM/month after training-age penalty ${formatNumber(trainingAgePenalty, 2)}. The long-term gain is integrated over ${formatNumber(effectiveGrowthHorizonMonths, 0)} effective months, not extrapolated linearly forever.`],
            ["Expected trajectory endpoint", "Current-evidence diminishing-return forecast", `${formatNumber(ceilingFfmi, 2)} FFMI (${formatNumber(ceilingLow, 2)}-${formatNumber(ceilingHigh, 2)}). This is a near-term model endpoint, not a biological ceiling.`],
            ["Improved-training potential", "Frame/morphology + athlete-reference natural-potential heuristic", `${formatNumber(improvedTrainingPotentialFfmi, 2)} FFMI centre (${formatNumber(improvedTrainingPotentialLow, 2)}-${formatNumber(improvedTrainingPotentialHigh, 2)}). Assumes continued training improvement, recovery and nutrition, not merely the current rate.`],
            ["Statistical outlier upper bound", "Speculative upper reference", `${formatNumber(statisticalOutlierUpperBound, 2)} FFMI. This is not a likely forecast; it is the far upper reference for unusually favourable genetics and long-term response.`],
            ["Athlete lens", "ATHLAS / Frontiers 2023", athleteBand ? `Training blend FFMI ${formatNumber(athleteBand.mean, 2)} +/- ${formatNumber(athleteBand.sd, 2)} is context only. Reference target ${formatNumber(referenceCeiling, 2)} FFMI is damped and capped before blending.` : "No ATHLAS band available."],
            ["Training-load caveat", "Lopez et al. resistance-training load review", "Load choice affects strength specificity; hypertrophy response is interpreted as volume/effort/context, not a fixed kg-load rule."],
          ],
        };
      }

      function normMatchesBodyweight(norm, bodyWeight) {
        if (!bodyWeight) return true;
        const min = norm.bodyweight_min === null || norm.bodyweight_min === undefined || norm.bodyweight_min === "" ? null : number(norm.bodyweight_min);
        const max = norm.bodyweight_max === null || norm.bodyweight_max === undefined || norm.bodyweight_max === "" ? null : number(norm.bodyweight_max);

        return (min === null || bodyWeight >= min) && (max === null || bodyWeight < max);
      }

      function weekProgressRatio() {
        const currentWeekStart = Date.parse(`${weekStart(new Date().toISOString())}T00:00:00.000Z`);
        const elapsedMs = Date.now() - currentWeekStart;
        return Math.min(1, Math.max(1 / (7 * 24), elapsedMs / (7 * 24 * 60 * 60 * 1000)));
      }

      function expectedPlanDaysByProgress(days, ratio) {
        return days
          .slice()
          .sort((a, b) => number(a.day_index) - number(b.day_index))
          .slice(0, Math.min(days.length, Math.ceil(days.length * ratio)));
      }

      function expectedPlanDaysByCalendar(days) {
        const now = new Date();
        const day = now.getDay();
        const startDay = 1;
        const daysElapsed = (day - startDay + 7) % 7;
        return days
          .slice()
          .sort((a, b) => number(a.day_index) - number(b.day_index))
          .slice(0, Math.min(days.length, daysElapsed + 1));
      }

      function targetKey(target) {
        return `${target.exercise_id}:${target.variation_id}`;
      }

      function setKey(set) {
        return `${set.exercise_id}:${set.variation_id}`;
      }

      function formatDayLabel(day) {
        return day ? `Day ${number(day.day_index)}` : "Unassigned";
      }

      function buildWeeklyPlanRows(tables, sets, projectedSets = []) {
        const assignments = tables.plan_assignment || [];
        const weekOverrides = tables.plan_week_override || [];
        const plansById = new Map((tables.workout_plan || []).map((plan) => [plan.id, plan]));
        const daysByPlan = new Map();
        const targetsByDay = new Map();
        const sessionsById = new Map((tables.workout_session || []).map((session) => [session.id, session]));
        const setsBySession = new Map();
        const currentRepresentedDayIndexes = new Set();
        const actualByWeek = new Map();
        const actualByAssignmentWeek = new Map();
        const actualWeeks = new Set();
        const currentWeek = weekStart(new Date().toISOString());
        const overrideFor = (planId, week) =>
          weekOverrides.find((override) => override.workout_plan_id === planId && override.week_start === week) || null;

        for (const day of tables.workout_day || []) {
          daysByPlan.set(day.workout_plan_id, [...(daysByPlan.get(day.workout_plan_id) || []), day]);
        }

        for (const target of tables.workout_day_exercise || []) {
          targetsByDay.set(target.workout_day_id, [...(targetsByDay.get(target.workout_day_id) || []), target]);
        }

        for (const set of sets) {
          if (set.workout_session_id) {
            setsBySession.set(set.workout_session_id, (setsBySession.get(set.workout_session_id) || 0) + 1);
          }
        }

        for (const session of tables.workout_session || []) {
          const week = weekStart(session.started_at);
          if (!week) continue;
          const weightedSetCount = setsBySession.get(session.id) || 0;
          const hasObservedSetCount = session.observed_set_count !== undefined && session.observed_set_count !== null;
          const reportedSetCount = hasObservedSetCount ? number(session.observed_set_count) : 0;
          const completedSets = Math.max(weightedSetCount, reportedSetCount);
          if (!completedSets) continue;

          actualWeeks.add(week);
          actualByWeek.set(week, (actualByWeek.get(week) || 0) + completedSets);

          if (session.plan_assignment_id) {
            const key = `${session.plan_assignment_id}:${week}`;
            actualByAssignmentWeek.set(key, (actualByAssignmentWeek.get(key) || 0) + completedSets);
          }
        }

        for (const set of sets) {
          if (set.workout_session_id && sessionsById.has(set.workout_session_id)) continue;
          const week = weekStart(set.logged_at);
          if (!week) continue;
          const session = sessionsById.get(set.workout_session_id);
          actualWeeks.add(week);
          actualByWeek.set(week, (actualByWeek.get(week) || 0) + 1);

          if (session?.plan_assignment_id) {
            const key = `${session.plan_assignment_id}:${week}`;
            actualByAssignmentWeek.set(key, (actualByAssignmentWeek.get(key) || 0) + 1);
          }
        }

        const dayIndexByExerciseKey = new Map();
        for (const day of tables.workout_day || []) {
          for (const target of targetsByDay.get(day.id) || []) {
            const key = `${target.exercise_id}:${target.variation_id}`;
            if (!dayIndexByExerciseKey.has(key)) dayIndexByExerciseKey.set(key, Number(day.day_index));
          }
        }

        for (const set of sets) {
          if (weekStart(set.logged_at) !== currentWeek) continue;
          const sessionDayIndex = sessionsById.get(set.workout_session_id)?.day_index;
          const inferredDayIndex = sessionDayIndex ?? dayIndexByExerciseKey.get(setKey(set));
          if (inferredDayIndex !== null && inferredDayIndex !== undefined) {
            currentRepresentedDayIndexes.add(Number(inferredDayIndex));
          }
        }

        const currentProjectedSetCount = projectedSets.filter((set) => {
          if (weekStart(set.logged_at) !== currentWeek) return false;
          if (set.day_index !== null && set.day_index !== undefined) currentRepresentedDayIndexes.add(Number(set.day_index));
          return true;
        }).length;

        if (currentProjectedSetCount) {
          actualWeeks.add(currentWeek);
          actualByWeek.set(currentWeek, (actualByWeek.get(currentWeek) || 0) + currentProjectedSetCount);
          for (const assignment of assignments) {
            const startsBeforeCurrent = weekStart(assignment.started_at) <= currentWeek;
            const endsAfterCurrent = !assignment.ended_at || weekStart(assignment.ended_at) >= currentWeek;
            if (startsBeforeCurrent && endsAfterCurrent) {
              const key = `${assignment.id}:${currentWeek}`;
              actualByAssignmentWeek.set(key, (actualByAssignmentWeek.get(key) || 0) + currentProjectedSetCount);
            }
          }
        }

        return assignments.flatMap((assignment) => {
          const plan = plansById.get(assignment.workout_plan_id);
          const days = daysByPlan.get(assignment.workout_plan_id) || [];
          const fullPlannedSets = days.flatMap((day) => targetsByDay.get(day.id) || []).reduce((sum, target) => sum + number(target.target_sets), 0);

          if (!plan || fullPlannedSets === 0) return [];

          const assignmentStart = weekStart(assignment.started_at);
          const actualWeekList = [...actualWeeks].sort();
          const fallbackEnd = actualWeekList.at(-1) || currentWeek;
          const assignmentEnd = weekStart(assignment.ended_at || fallbackEnd);
          const effectiveEnd = assignment.ended_at ? assignmentEnd : [assignmentEnd, currentWeek].sort().at(-1);
          if (!assignmentStart || !effectiveEnd) return [];

          const rows = [];
          for (let week = assignmentStart; week <= effectiveEnd; week = addWeek(week, 1)) {
            const weekOverride = overrideFor(assignment.workout_plan_id, week);
            const volumeMultiplier = weekOverride ? number(weekOverride.volume_multiplier || 1) : 1;
            const isCurrentWeek = week === currentWeek;
            const expectedDays =
              isCurrentWeek && currentRepresentedDayIndexes.size
                ? days.filter((day) => currentRepresentedDayIndexes.has(Number(day.day_index)))
                : isCurrentWeek
                  ? expectedPlanDaysByCalendar(days)
                  : days;
            const basePlannedSets = expectedDays
              .flatMap((day) => targetsByDay.get(day.id) || [])
              .reduce((sum, target) => sum + number(target.target_sets), 0);
            const plannedSets = Math.round(basePlannedSets * volumeMultiplier);
            const specificActual = actualByAssignmentWeek.get(`${assignment.id}:${week}`);
            const actualSets = isCurrentWeek ? actualByWeek.get(week) ?? specificActual ?? null : specificActual ?? actualByWeek.get(week) ?? null;
            rows.push({
              week,
              planName: plan.name,
              assignmentId: assignment.id,
              plannedSets,
              basePlannedSets,
              fullPlannedSets,
              weekType: weekOverride?.week_type || "normal",
              volumeMultiplier,
              intensityMultiplier: weekOverride ? number(weekOverride.intensity_multiplier || 1) : 1,
              overrideNotes: weekOverride?.notes || "",
              expectedDays: expectedDays.length,
              totalDays: days.length,
              actualSets,
              completion: actualSets === null || plannedSets === 0 ? null : actualSets / plannedSets,
              status: isCurrentWeek ? "in_progress" : "complete",
            });
          }

          return rows;
        });
      }

      function buildPlanProgress(tables, sets, projectedSets = []) {
        const currentWeek = weekStart(new Date().toISOString());
        const assignments = tables.plan_assignment || [];
        const activeAssignment =
          assignments
            .filter((assignment) => weekStart(assignment.started_at) <= currentWeek && (!assignment.ended_at || weekStart(assignment.ended_at) >= currentWeek))
            .at(-1) || assignments.at(-1);
        if (!activeAssignment) return null;

        const plan = (tables.workout_plan || []).find((row) => row.id === activeAssignment.workout_plan_id);
        const currentWeekOverride = (tables.plan_week_override || []).find(
          (override) => override.workout_plan_id === activeAssignment.workout_plan_id && override.week_start === currentWeek,
        );
        const volumeMultiplier = currentWeekOverride ? number(currentWeekOverride.volume_multiplier || 1) : 1;
        const days = (tables.workout_day || [])
          .filter((day) => day.workout_plan_id === activeAssignment.workout_plan_id)
          .sort((a, b) => number(a.day_index) - number(b.day_index));
        const targetsByDay = new Map();
        for (const target of tables.workout_day_exercise || []) {
          targetsByDay.set(target.workout_day_id, [...(targetsByDay.get(target.workout_day_id) || []), target]);
        }
        const dayById = new Map(days.map((day) => [day.id, day]));
        const targetDayByKey = new Map();
        for (const day of days) {
          for (const target of targetsByDay.get(day.id) || []) {
            const key = targetKey(target);
            const existing = targetDayByKey.get(key) || [];
            existing.push(day);
            targetDayByKey.set(key, existing);
          }
        }
        const fullPlanTargets = (tables.workout_day_exercise || []).filter((target) => days.some((day) => day.id === target.workout_day_id));
        const actualSets = sets.filter((set) => weekStart(set.logged_at) === currentWeek);
        const currentProjectedSets = projectedSets.filter((set) => weekStart(set.logged_at) === currentWeek);
        const sessionsById = new Map((tables.workout_session || []).map((session) => [session.id, session]));
        const representedDayIds = new Set();

        for (const set of currentProjectedSets) {
          const day = days.find((candidate) => number(candidate.day_index) === number(set.day_index));
          if (day) representedDayIds.add(day.id);
        }

        for (const set of actualSets) {
          const sessionDayIndex = sessionsById.get(set.workout_session_id)?.day_index;
          const explicitDay = days.find((candidate) => number(candidate.day_index) === number(sessionDayIndex));
          if (explicitDay) {
            representedDayIds.add(explicitDay.id);
            continue;
          }
          const matchingDays = targetDayByKey.get(setKey(set)) || [];
          if (matchingDays.length) representedDayIds.add(matchingDays[0].id);
        }

        const representedDays = days.filter((day) => representedDayIds.has(day.id));
        const targets = representedDays.flatMap((day) => targetsByDay.get(day.id) || []);
        const actualByExercise = new Map();
        const copiedByExercise = new Map();

        for (const set of actualSets) {
          const key = setKey(set);
          actualByExercise.set(key, (actualByExercise.get(key) || 0) + 1);
        }

        for (const set of currentProjectedSets) {
          const key = setKey(set);
          copiedByExercise.set(key, (copiedByExercise.get(key) || 0) + 1);
        }

        const takeCount = (map, key, limit = Infinity) => {
          const available = map.get(key) || 0;
          const used = Math.min(available, limit);
          if (available - used > 0) {
            map.set(key, available - used);
          } else {
            map.delete(key);
          }
          return used;
        };

        const targetRows = targets.map((target) => {
          const key = targetKey(target);
          const planned = number(target.target_sets);
          const actual = takeCount(actualByExercise, key, planned);
          const copied = takeCount(copiedByExercise, key, Math.max(0, planned - actual));
          return {
            exerciseId: target.exercise_id,
            variationId: target.variation_id,
            dayLabel: formatDayLabel(dayById.get(target.workout_day_id)),
            plannedSets: planned,
            actualSets: actual,
            copiedSets: copied,
            completion: planned ? actual / planned : null,
            status: actual >= planned ? "done" : actual > 0 ? "partial" : copied > 0 ? "copied" : "not logged",
          };
        });

        const unplannedRows = [...actualByExercise.entries()].map(([key, actual]) => {
          const [exerciseId, variationId] = key.split(":");
          return {
            exerciseId,
            variationId,
            dayLabel: "Extra",
            plannedSets: 0,
            actualSets: actual,
            copiedSets: 0,
            completion: null,
            status: "unplanned",
          };
        });

        const baseDuePlannedSets = targetRows.reduce((sum, row) => sum + row.plannedSets, 0);
        const duePlannedSets = Math.round(baseDuePlannedSets * volumeMultiplier);
        const fullPlannedSets = fullPlanTargets.reduce((sum, row) => sum + number(row.target_sets), 0);
        const actualPlannedSets = targetRows.reduce((sum, row) => sum + Math.min(row.actualSets, row.plannedSets), 0);
        const copiedPlannedSets = targetRows.reduce((sum, row) => sum + Math.min(row.copiedSets, Math.max(0, row.plannedSets - row.actualSets)), 0);
        const unplannedSets = unplannedRows.reduce((sum, row) => sum + row.actualSets, 0);

        return {
          planName: plan?.name || activeAssignment.workout_plan_id,
          week: currentWeek,
          progressRatio: weekProgressRatio(),
          expectedDays: representedDays.length,
          totalDays: days.length,
          plannedSets: duePlannedSets,
          basePlannedSets: baseDuePlannedSets,
          duePlannedSets,
          fullPlannedSets,
          weekType: currentWeekOverride?.week_type || "normal",
          volumeMultiplier,
          intensityMultiplier: currentWeekOverride ? number(currentWeekOverride.intensity_multiplier || 1) : 1,
          overrideNotes: currentWeekOverride?.notes || "",
          actualPlannedSets,
          copiedPlannedSets,
          totalActualSets: actualSets.length,
          unplannedSets,
          completion: duePlannedSets ? actualPlannedSets / duePlannedSets : null,
          representedDays: representedDays.map((day) => number(day.day_index)),
          rows: [...targetRows, ...unplannedRows],
        };
      }

      function summarize(imported) {
        let tables = asTables(imported);
        tables = applyStoredPlanDraftToTables(tables);
        tables = mergeDesktopLogTables(tables);

        if (!imported.tables && Array.isArray(imported.sessions)) {
          const muscleVolume = new Map();
          const splitVolume = new Map();
          const exerciseBest = new Map();

          for (const session of imported.sessions) {
            for (const [muscle, value] of Object.entries(session.muscleVolume || {})) {
              muscleVolume.set(muscle, (muscleVolume.get(muscle) || 0) + number(value));
            }

            for (const [tag, value] of Object.entries(session.compoundAccessoryVolume || {})) {
              splitVolume.set(tag, (splitVolume.get(tag) || 0) + number(value));
            }

            for (const exercise of session.exercises || []) {
              const key = `${exercise.exerciseId}:${exercise.variationId}`;
              const previous = exerciseBest.get(key);
              const bestE1rm = number(exercise.bestE1rm);

              if (bestE1rm > 0 && (!previous || bestE1rm > previous.e1rm)) {
                exerciseBest.set(key, {
                  exerciseId: exercise.exerciseId,
                  variationId: exercise.variationId,
                  e1rm: bestE1rm,
                  normalized: null,
                });
              }
            }
          }

          const currentWeek = weekStart(new Date().toISOString());
          const weeklyTotals = new Map();
          for (const session of imported.sessions || []) {
            const week = weekStart(session.sourceDate || session.id);
            if (!week) continue;
            const current = weeklyTotals.get(week) || { week, sets: 0, volume: 0, adjustedVolume: 0, sessions: 0, e1rmAttempts: 0 };
            current.sets += number(session.completedSets);
            current.volume += number(session.totalVolume);
            current.adjustedVolume += number(session.totalVolume);
            current.sessions += 1;
            weeklyTotals.set(week, current);
          }

          return {
            exportedAt: imported.generatedAt || "unknown",
            setCount: imported.sessions.reduce((sum, session) => sum + number(session.completedSets), 0),
            weeklyPlanRows: [],
            planProgress: null,
            sessionRows: imported.sessions.map((session) => ({
              id: session.id,
              mode: "imported-summary",
              startedAt: session.sourceDate || session.id,
              week: weekStart(session.sourceDate || session.id),
              plannedSets: session.plannedSets,
              completedSets: session.completedSets,
              completion: session.setCompletionRatio,
              plannedExercisesCompleted: (session.exercises || []).filter((exercise) => exercise.completedSets > 0).length,
              skippedExercises: (session.exercises || []).filter((exercise) => exercise.targetSets > 0 && exercise.completedSets === 0)
                .length,
              unplannedExercisesAdded: 0,
            })),
            currentWeek,
            currentWeekStats: weeklyTotals.get(currentWeek) || { week: currentWeek, sets: 0, volume: 0, adjustedVolume: 0, sessions: 0, e1rmAttempts: 0 },
            weeklyTotals: [...weeklyTotals.values()].sort((a, b) => a.week.localeCompare(b.week)),
            allObservedWeeks: [...weeklyTotals.keys()].sort(),
            totalVolume: imported.sessions.reduce((sum, session) => sum + number(session.totalVolume), 0),
            totalAdjustedVolume: imported.sessions.reduce((sum, session) => sum + number(session.totalVolume), 0),
            exerciseBest: [...exerciseBest.values()].sort((a, b) => b.e1rm - a.e1rm),
            exerciseWeeklyBest: [],
            muscleVolume: [...muscleVolume.entries()].sort((a, b) => b[1] - a[1]),
            muscleWeeklyVolume: [],
            muscleWeeklyStrength: [],
            projectedWeeklyTotals: [],
            splitVolume: [...splitVolume.entries()].filter(([, value]) => value > 0),
            equipmentVolume: [],
            norms: [],
            hasBodyweight: false,
            bodyWeights: [],
            tables,
            tableCounts: tableCounts(tables),
            importCount: loadImportHistory().length,
          };
        }

        hydrateLookups(tables);

        const sessions = tables.workout_session || [];
        const sets = (tables.lift_set || []).filter((set) => !set.deleted_at);
        const projectedSets = (tables.projected_lift_set || []).filter((set) => !set.deleted_at);
        const targets = tables.workout_day_exercise || [];
        const contributions = tables.exercise_muscle_contribution || [];
        const norms = tables.strength_norm || [];
        const metadataSex = userProfile(tables).sex || "male";
        const normSex = sexSelect.value === "auto" ? (metadataSex === "unspecified" ? "male" : metadataSex) : sexSelect.value;
        const currentBodyWeight = latestBodyWeight(tables);
        const targetsByDay = new Map();
        const variationsById = new Map((tables.exercise_variation || []).map((variation) => [variation.id, variation]));
        const contributionDetails = contributions.map((contribution) => {
          const variation = variationsById.get(contribution.variation_id);
          const tags = exerciseTags.get(variation?.exercise_id) || [];
          return {
            muscle: contribution.muscle_group_id,
            exercise: exerciseName(variation?.exercise_id),
            variation: variationName(contribution.variation_id),
            coefficient: number(contribution.coefficient),
            isCompound: tags.includes("compound"),
          };
        });

        for (const target of targets) {
          const key = target.workout_day_id || `day-${target.day_index}`;
          targetsByDay.set(key, [...(targetsByDay.get(key) || []), target]);
        }

        const sessionRows = sessions.map((session) => {
          const sessionSets = sets.filter((set) => set.workout_session_id === session.id);
          const dayTargets =
            targetsByDay.get(session.workout_day_id) ||
            targets.filter((target) => Number(target.day_index) === Number(session.day_index));
          const plannedSets = dayTargets.reduce((sum, target) => sum + number(target.target_sets), 0);
          const hasObservedSetCount = session.observed_set_count !== undefined && session.observed_set_count !== null;
          const reportedSetCount = hasObservedSetCount ? number(session.observed_set_count) : 0;
          const completedSets = Math.max(sessionSets.length, reportedSetCount);
          const actualExerciseKeys = new Set(sessionSets.map((set) => `${set.exercise_id}:${set.variation_id}`));
          const plannedExerciseKeys = new Set(dayTargets.map((target) => `${target.exercise_id}:${target.variation_id}`));

          return {
            id: session.id,
            mode: session.mode,
            startedAt: session.started_at,
            week: weekStart(session.started_at),
            plannedSets,
            completedSets,
            observedWeightedSets: sessionSets.length,
            reportedSetCount,
            completion: plannedSets ? completedSets / plannedSets : null,
            plannedExercisesCompleted: [...plannedExerciseKeys].filter((key) => actualExerciseKeys.has(key)).length,
            skippedExercises: [...plannedExerciseKeys].filter((key) => !actualExerciseKeys.has(key)).length,
            unplannedExercisesAdded: [...actualExerciseKeys].filter((key) => !plannedExerciseKeys.has(key)).length,
          };
        });

        const exerciseBest = new Map();
        const muscleVolume = new Map();
        const majorMuscleVolume = new Map();
        const muscleWeeklyEffectiveSets = new Map();
        const exerciseWeeklyBest = new Map();
        const exerciseWeeklyTotals = new Map();
        const muscleWeeklyVolume = new Map();
        const majorMuscleWeeklyVolume = new Map();
        const majorMuscleWeeklyEffectiveSets = new Map();
        const muscleWeeklyStrength = new Map();
        const muscleVolumeProvenance = new Map();
        const weeklyTotals = new Map();
        const equipmentVolume = new Map();
        let weightedContributionSetCount = 0;
        let missingContributionSetCount = 0;
        let countOnlySetCount = 0;
        const splitVolume = new Map([
          ["compound", 0],
          ["accessory", 0],
          ["untagged", 0],
        ]);

        for (const set of sets) {
          const volume = rawSetVolume(set);
          const adjustedVolume = adjustedSetVolume(set);
          const equipmentType = exerciseEquipmentType(set.exercise_id);
          const setE1rm = e1rm(set);
          const bodyWeight = interpolatedBodyWeight(tables, set.logged_at);
          const key = `${set.exercise_id}:${set.variation_id}`;
          const week = weekStart(set.logged_at);
          const previous = exerciseBest.get(key);

          if (!previous || setE1rm > previous.e1rm) {
            exerciseBest.set(key, {
              exerciseId: set.exercise_id,
              variationId: set.variation_id,
              setId: set.id,
              loggedAt: set.logged_at,
              reps: number(set.reps),
              weight: number(set.weight),
              loadWeight: setLoadWeight(set),
              e1rm: setE1rm,
              bodyWeight,
              normalized: bodyWeight ? setE1rm / bodyWeight : null,
            });
          }

          if (week) {
            const weekly = weeklyTotals.get(week) || { week, sets: 0, volume: 0, adjustedVolume: 0, e1rmAttempts: 0 };
            weekly.sets += 1;
            weekly.volume += volume;
            weekly.adjustedVolume += adjustedVolume;
            weekly.e1rmAttempts += setE1rm > 0 ? 1 : 0;
            weeklyTotals.set(week, weekly);

            const weeklyKey = `${week}:${key}`;
            const exerciseWeekly = exerciseWeeklyTotals.get(weeklyKey) || {
              week,
              exerciseId: set.exercise_id,
              variationId: set.variation_id,
              sets: 0,
              volume: 0,
              adjustedVolume: 0,
            };
            exerciseWeekly.sets += 1;
            exerciseWeekly.volume += volume;
            exerciseWeekly.adjustedVolume += adjustedVolume;
            exerciseWeeklyTotals.set(weeklyKey, exerciseWeekly);

            const previousWeekly = exerciseWeeklyBest.get(weeklyKey);
            if (!previousWeekly || setE1rm > previousWeekly.e1rm) {
              exerciseWeeklyBest.set(weeklyKey, {
                week,
                exerciseId: set.exercise_id,
                variationId: set.variation_id,
                setId: set.id,
                loggedAt: set.logged_at,
                reps: number(set.reps),
                weight: number(set.weight),
                loadWeight: setLoadWeight(set),
                e1rm: setE1rm,
                bodyWeight,
                normalized: bodyWeight ? setE1rm / bodyWeight : null,
              });
            }
          }

          const tags = exerciseTags.get(set.exercise_id) || [];
          const split = tags.includes("compound") ? "compound" : tags.includes("accessory") ? "accessory" : "untagged";
          splitVolume.set(split, splitVolume.get(split) + volume);
          equipmentVolume.set(equipmentType, (equipmentVolume.get(equipmentType) || 0) + volume);

          const setContributions = contributions.filter((item) => item.variation_id === set.variation_id);
          if (volume > 0) {
            if (setContributions.length) weightedContributionSetCount += 1;
            else missingContributionSetCount += 1;
          } else {
            countOnlySetCount += 1;
          }

          const setMajorVolume = new Map();
          const setMajorCoefficient = new Map();
          for (const contribution of setContributions) {
            const coefficient = number(contribution.coefficient);
            const allocatedVolume = volume * coefficient;
            const majorMuscle = majorMuscleGroupId(contribution.muscle_group_id);
            setMajorVolume.set(majorMuscle, Math.max(setMajorVolume.get(majorMuscle) || 0, allocatedVolume));
            setMajorCoefficient.set(majorMuscle, Math.max(setMajorCoefficient.get(majorMuscle) || 0, coefficient));
            muscleVolume.set(
              contribution.muscle_group_id,
              (muscleVolume.get(contribution.muscle_group_id) || 0) + allocatedVolume,
            );
            if (allocatedVolume > 0) {
              const provenanceKey = `${contribution.muscle_group_id}:${set.exercise_id}:${set.variation_id}`;
              const provenance = muscleVolumeProvenance.get(provenanceKey) || {
                muscle: contribution.muscle_group_id,
                exerciseId: set.exercise_id,
                variationId: set.variation_id,
                coefficient,
                sets: 0,
                rawKgLoad: 0,
                allocatedKgLoad: 0,
              };
              provenance.sets += 1;
              provenance.rawKgLoad += volume;
              provenance.allocatedKgLoad += allocatedVolume;
              muscleVolumeProvenance.set(provenanceKey, provenance);
            }
            if (week) {
              const muscleWeekKey = `${week}:${contribution.muscle_group_id}`;
              muscleWeeklyVolume.set(
                muscleWeekKey,
                (muscleWeeklyVolume.get(muscleWeekKey) || 0) + allocatedVolume,
              );
              muscleWeeklyEffectiveSets.set(
                muscleWeekKey,
                (muscleWeeklyEffectiveSets.get(muscleWeekKey) || 0) + coefficient,
              );
            }
          }

          for (const [majorMuscle, allocatedVolume] of setMajorVolume.entries()) {
            majorMuscleVolume.set(majorMuscle, (majorMuscleVolume.get(majorMuscle) || 0) + allocatedVolume);
            if (week) {
              const majorWeekKey = `${week}:${majorMuscle}`;
              majorMuscleWeeklyVolume.set(
                majorWeekKey,
                (majorMuscleWeeklyVolume.get(majorWeekKey) || 0) + allocatedVolume,
              );
              majorMuscleWeeklyEffectiveSets.set(
                majorWeekKey,
                (majorMuscleWeeklyEffectiveSets.get(majorWeekKey) || 0) + (setMajorCoefficient.get(majorMuscle) || 0),
              );
            }
          }
        }

        for (const best of exerciseWeeklyBest.values()) {
          const bestTags = exerciseTags.get(best.exerciseId) || [];
          if (!bestTags.includes("compound")) continue;

          for (const contribution of contributions.filter((item) => item.variation_id === best.variationId)) {
            const muscleWeekKey = `${best.week}:${contribution.muscle_group_id}`;
            const current = muscleWeeklyStrength.get(muscleWeekKey) || {
              week: best.week,
              muscle: contribution.muscle_group_id,
              value: 0,
              normalizedValue: 0,
              hasNormalized: false,
            };
            const coefficient = number(contribution.coefficient);
            current.value = Math.max(current.value, best.e1rm * coefficient);
            if (best.normalized) {
              current.normalizedValue = Math.max(current.normalizedValue, best.normalized * coefficient);
              current.hasNormalized = true;
            }
            muscleWeeklyStrength.set(muscleWeekKey, current);
          }
        }

        for (const session of sessionRows) {
