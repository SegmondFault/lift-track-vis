      function renderWeekCompare(summary) {
        const currentWeek = summary.currentWeek;
        const previousWeek = addWeek(currentWeek, -1);
        const currentTotals = summary.currentWeekStats || { sets: 0, volume: 0, adjustedVolume: 0 };
        const copiedTotals = summary.currentProjectedStats || { sets: 0, volume: 0, adjustedVolume: 0 };
        const currentObserved = {
          sets: number(currentTotals.sets) + number(copiedTotals.sets),
          volume: number(currentTotals.volume) + number(copiedTotals.volume),
          adjustedVolume: number(currentTotals.adjustedVolume) + number(copiedTotals.adjustedVolume),
        };
        const previousTotals = (summary.weeklyTotals || []).find((row) => row.week === previousWeek) || {
          sets: 0,
          volume: 0,
          adjustedVolume: 0,
        };
        const representedRatio = Math.max(0.01, Math.min(1, number(summary.currentTrainingDayRatio) || 1));
        const currentPace = {
          sets: currentObserved.sets / representedRatio,
          volume: currentObserved.volume / representedRatio,
          adjustedVolume: currentObserved.adjustedVolume / representedRatio,
        };

        const projectedExerciseStats = (week) => {
          const totals = new Map();
          const best = new Map();
          for (const set of summary.tables?.projected_lift_set || []) {
            if (weekStart(set.logged_at) !== week) continue;
            const key = `${set.exercise_id}:${set.variation_id}`;
            const total = totals.get(key) || {
              week,
              exerciseId: set.exercise_id,
              variationId: set.variation_id,
              sets: 0,
              volume: 0,
              adjustedVolume: 0,
              copiedSets: 0,
            };
            total.sets += 1;
            total.copiedSets += 1;
            total.volume += rawSetVolume(set);
            total.adjustedVolume += adjustedSetVolume(set);
            totals.set(key, total);

            const setE1rm = e1rm(set);
            const previous = best.get(key);
            if (!previous || setE1rm > previous.e1rm) {
              best.set(key, {
                week,
                exerciseId: set.exercise_id,
                variationId: set.variation_id,
                e1rm: setE1rm,
                copied: true,
              });
            }
          }
          return { totals, best };
        };
        const mergeExerciseTotals = (actualRows, copiedMap) => {
          const merged = new Map(
            actualRows.map((row) => [
              `${row.exerciseId}:${row.variationId}`,
              { ...row, actualSets: row.sets, copiedSets: 0 },
            ]),
          );
          for (const [key, copied] of copiedMap.entries()) {
            const current = merged.get(key) || {
              week: copied.week,
              exerciseId: copied.exerciseId,
              variationId: copied.variationId,
              sets: 0,
              volume: 0,
              adjustedVolume: 0,
              actualSets: 0,
              copiedSets: 0,
            };
            current.sets += copied.sets;
            current.volume += copied.volume;
            current.adjustedVolume += copied.adjustedVolume;
            current.copiedSets += copied.copiedSets;
            merged.set(key, current);
          }
          return merged;
        };
        const mergeExerciseBest = (actualRows, copiedMap) => {
          const merged = new Map(actualRows.map((row) => [`${row.exerciseId}:${row.variationId}`, { ...row, copied: false }]));
          for (const [key, copied] of copiedMap.entries()) {
            const current = merged.get(key);
            if (!current || copied.e1rm > current.e1rm) merged.set(key, copied);
          }
          return merged;
        };
        const currentCopiedExercises = projectedExerciseStats(currentWeek);
        const previousCopiedExercises = projectedExerciseStats(previousWeek);
        const currentExerciseTotals = new Map(
          mergeExerciseTotals(
            (summary.exerciseWeeklyTotals || []).filter((row) => row.week === currentWeek),
            currentCopiedExercises.totals,
          ),
        );
        const previousExerciseTotals = new Map(
          mergeExerciseTotals(
            (summary.exerciseWeeklyTotals || []).filter((row) => row.week === previousWeek),
            previousCopiedExercises.totals,
          ),
        );
        const currentBest = new Map(
          mergeExerciseBest(
            (summary.exerciseWeeklyBest || []).filter((row) => row.week === currentWeek),
            currentCopiedExercises.best,
          ),
        );
        const currentActualExerciseTotals = new Map(
          (summary.exerciseWeeklyTotals || [])
            .filter((row) => row.week === currentWeek)
            .map((row) => [`${row.exerciseId}:${row.variationId}`, row]),
        );
        const currentActualBest = new Map(
          (summary.exerciseWeeklyBest || [])
            .filter((row) => row.week === currentWeek)
            .map((row) => [`${row.exerciseId}:${row.variationId}`, row]),
        );
        const immediatePreviousBest = new Map(
          mergeExerciseBest(
            (summary.exerciseWeeklyBest || []).filter((row) => row.week === previousWeek),
            previousCopiedExercises.best,
          ),
        );
        const weeksApart = (olderWeek, newerWeek) => {
          const older = dateFromIsoDay(olderWeek);
          const newer = dateFromIsoDay(newerWeek);
          if (!older || !newer) return null;
          return Math.max(1, Math.round((newer.getTime() - older.getTime()) / (7 * 24 * 60 * 60 * 1000)));
        };
        const comparisonAgeLabel = (row) =>
          row?.comparisonAgeWeeks ? `${formatNumber(row.comparisonAgeWeeks, 0)}w old` : "";
        const latestPriorObservedBest = new Map();
        for (const row of summary.exerciseWeeklyBest || []) {
          if (!row.week || row.week >= currentWeek) continue;
          const key = `${row.exerciseId}:${row.variationId}`;
          const previous = latestPriorObservedBest.get(key);
          if (!previous || row.week > previous.week) {
            latestPriorObservedBest.set(key, { ...row, copied: false });
          }
        }
        const previousBest = new Map(immediatePreviousBest);
        for (const key of currentBest.keys()) {
          if (previousBest.has(key)) continue;
          const fallback = latestPriorObservedBest.get(key);
          if (!fallback) continue;
          previousBest.set(key, {
            ...fallback,
            fallback: true,
            comparisonAgeWeeks: weeksApart(fallback.week, currentWeek),
          });
        }
        const sharedKeys = [...currentExerciseTotals.keys()]
          .filter((key) => previousExerciseTotals.has(key))
          .sort((a, b) => number(currentExerciseTotals.get(b)?.sets) - number(currentExerciseTotals.get(a)?.sets));
        const newKeys = [...currentExerciseTotals.keys()]
          .filter((key) => !previousExerciseTotals.has(key))
          .sort((a, b) => number(currentExerciseTotals.get(b)?.sets) - number(currentExerciseTotals.get(a)?.sets));
        const missedKeys = [...previousExerciseTotals.keys()]
          .filter((key) => !currentExerciseTotals.has(key))
          .sort((a, b) => number(previousExerciseTotals.get(b)?.sets) - number(previousExerciseTotals.get(a)?.sets));
        const fallbackComparisonKeys = newKeys.filter((key) => currentBest.has(key) && previousBest.get(key)?.fallback);
        const trueNewKeys = newKeys.filter((key) => currentBest.has(key) && !previousBest.has(key));
        const liftRows = [...sharedKeys, ...newKeys, ...missedKeys].slice(0, 24);
        const comparisonKeys = [...currentBest.keys()].filter((key) => previousBest.has(key));
        const outperformingRows = comparisonKeys.filter((key) => {
          const current = currentBest.get(key);
          const previous = previousBest.get(key);
          return current && previous && current.e1rm >= previous.e1rm;
        });
        const underRows = comparisonKeys.filter((key) => {
          const current = currentBest.get(key);
          const previous = previousBest.get(key);
          return current && previous && current.e1rm < previous.e1rm;
        });
        const e1rmRows = [...new Set([...currentBest.keys(), ...previousBest.keys()])]
          .filter((key) => currentBest.has(key) || previousBest.has(key))
          .map((key) => {
            const [exerciseId, variationId] = key.split(":");
            const current = currentBest.get(key);
            const previous = previousBest.get(key);
            const delta = current && previous ? current.e1rm - previous.e1rm : null;
            const ratio = current && previous && previous.e1rm ? current.e1rm / previous.e1rm : null;
            return { key, exerciseId, variationId, current, previous, delta, ratio };
          })
          .sort((a, b) => {
            const rank = (row) => (row.current && row.previous ? 0 : row.current ? 1 : 2);
            const rankDelta = rank(a) - rank(b);
            if (rankDelta) return rankDelta;
            return number(b.delta) - number(a.delta);
          });
        const sharedE1rmRows = e1rmRows.filter((row) => row.current && row.previous && row.previous.e1rm > 0);
        const e1rmIndex = sharedE1rmRows.length
          ? sharedE1rmRows.reduce((sum, row) => sum + row.ratio * 100, 0) / sharedE1rmRows.length
          : null;
        const bestE1rmGain = sharedE1rmRows.reduce((best, row) => (!best || row.delta > best.delta ? row : best), null);
        const worstE1rmDrop = sharedE1rmRows.reduce((worst, row) => (!worst || row.delta < worst.delta ? row : worst), null);

        return `
          <section class="panel">
            <div class="bar-label">
              <h2>Week to week</h2>
              <span class="muted">${formatWeekRange(currentWeek)} vs ${formatWeekRange(previousWeek)}</span>
            </div>
            <div class="pill-row">
              <span class="pill ${currentPace.sets >= number(previousTotals.sets) ? "good" : "watch"}">
                ${currentPace.sets >= number(previousTotals.sets) ? "Current pace beating last week" : "Current pace below last week"}
              </span>
              <span class="pill ${number(currentTotals.sets) ? "good" : "watch"}">${formatNumber(currentTotals.sets, 0)} actual saved set${number(currentTotals.sets) === 1 ? "" : "s"} this week</span>
              <span class="pill ${outperformingRows.length >= underRows.length ? "good" : "watch"}">
                ${outperformingRows.length} lift${outperformingRows.length === 1 ? "" : "s"} up/equal vs prior signal, ${underRows.length} down
              </span>
              ${newKeys.length ? `<span class="pill watch">${newKeys.length} lift${newKeys.length === 1 ? "" : "s"} absent last week</span>` : ""}
              ${fallbackComparisonKeys.length ? `<span class="pill good">${fallbackComparisonKeys.length} older e1RM baseline${fallbackComparisonKeys.length === 1 ? "" : "s"} used</span>` : ""}
              ${trueNewKeys.length ? `<span class="pill watch">${trueNewKeys.length} true new baseline${trueNewKeys.length === 1 ? "" : "s"}</span>` : ""}
              ${missedKeys.length ? `<span class="pill watch">${missedKeys.length} last-week lift${missedKeys.length === 1 ? "" : "s"} not repeated yet</span>` : ""}
            </div>
          </section>

          <section class="grid metrics" style="margin-top: 18px;">
            <div class="metric-card good">
              <span class="muted">Actual saved sets</span>
              <span class="metric-value">${formatNumber(currentTotals.sets, 0)}</span>
              <span class="muted">from Mac database this week</span>
            </div>
            <div class="metric-card ${currentActualExerciseTotals.size ? "good" : "watch"}">
              <span class="muted">Actual saved lifts</span>
              <span class="metric-value">${formatNumber(currentActualExerciseTotals.size, 0)}</span>
              <span class="muted">exercise/variation pairs this week</span>
            </div>
            <div class="metric-card ${currentActualBest.size ? "good" : "watch"}">
              <span class="muted">Actual e1RM signals</span>
              <span class="metric-value">${formatNumber(currentActualBest.size, 0)}</span>
              <span class="muted">from real logged sets only</span>
            </div>
            <div class="metric-card ${copiedTotals.sets ? "watch" : "good"}">
              <span class="muted">Copied/projected sets</span>
              <span class="metric-value">${formatNumber(copiedTotals.sets, 0)}</span>
              <span class="muted">planning context, not logged truth</span>
            </div>
          </section>

          <section class="grid dashboard" style="margin-top: 18px;">
            <section class="panel">
              <h2>Current week on last week</h2>
              <div class="bar-list">
                ${compareValueBar("Actual saved hard sets", number(currentTotals.sets), number(previousTotals.sets))}
                ${compareValueBar("Actual + copied hard sets", currentObserved.sets, number(previousTotals.sets))}
                ${compareValueBar("Training-day pace sets", currentPace.sets, number(previousTotals.sets))}
                ${compareValueBar("Adjusted kg-load pace", currentPace.adjustedVolume, number(previousTotals.adjustedVolume), 1)}
                ${compareValueBar("Effective raw kg-load pace", currentPace.volume, number(previousTotals.volume), 1)}
              </div>
              <p class="muted">Green is this week; blue ghost is last week. Actual saved hard sets are database truth. Copied/projected sets are planning context. Pace scales represented training days to a full training week.</p>
            </section>
            <section class="panel">
              <h2>Lift coverage</h2>
              <div class="bar-list">
                ${compareValueBar("Repeated lifts", sharedKeys.length, previousExerciseTotals.size)}
                ${compareValueBar("Absent last week", newKeys.length, Math.max(previousExerciseTotals.size - sharedKeys.length, 0))}
                ${compareValueBar("Older e1RM baselines used", fallbackComparisonKeys.length, Math.max(currentBest.size, 1))}
                ${compareValueBar("Outperforming e1RM", outperformingRows.length, Math.max(comparisonKeys.length, 1))}
              </div>
              <p class="muted">Repeated lifts are exercises present in both weeks. If last week is missing for a lift, strength comparison falls back to the most recent prior observed week and flags the older baseline.</p>
            </section>
          </section>

          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Estimated 1RM vs available prior signal</h2>
              <span class="muted">Epley estimate: equipment-adjusted load x (1 + reps / 30)</span>
            </div>
            <div class="grid metrics">
              <div class="metric-card ${e1rmIndex === null ? "watch" : e1rmIndex >= 100 ? "good" : "watch"}">
                <span class="muted">Repeated-lift e1RM index</span>
                <span class="metric-value">${e1rmIndex === null ? "-" : `${formatNumber(e1rmIndex, 1)}%`}</span>
                <span class="muted">This week / comparison baseline average</span>
              </div>
              <div class="metric-card ${bestE1rmGain && bestE1rmGain.delta >= 0 ? "good" : "watch"}">
                <span class="muted">Best lift signal</span>
                <span class="metric-value">${bestE1rmGain ? `${formatNumber(bestE1rmGain.delta, 1)} kg` : "-"}</span>
                <span class="muted">${bestE1rmGain ? exerciseName(bestE1rmGain.exerciseId) : "no repeated lifts yet"}</span>
              </div>
              <div class="metric-card ${worstE1rmDrop && worstE1rmDrop.delta < 0 ? "watch" : "good"}">
                <span class="muted">Weakest lift signal</span>
                <span class="metric-value">${worstE1rmDrop ? `${formatNumber(worstE1rmDrop.delta, 1)} kg` : "-"}</span>
                <span class="muted">${worstE1rmDrop ? exerciseName(worstE1rmDrop.exerciseId) : "no repeated lifts yet"}</span>
              </div>
            </div>
            <div class="bar-list" style="margin-top: 14px;">
              ${e1rmRows
                .slice(0, 18)
                .map((row) => {
                  const previousValue = row.previous?.e1rm || 0;
                  const currentValue = row.current?.e1rm || 0;
                  const variation = variationName(row.variationId);
                  const status =
                    row.current && row.previous
                      ? row.previous.fallback
                        ? ` (vs older baseline, ${formatWeekRange(row.previous.week)}${comparisonAgeLabel(row.previous) ? `, ${comparisonAgeLabel(row.previous)}` : ""})`
                        : row.previous.copied && !row.current.copied
                        ? " (vs copied baseline)"
                        : row.current.copied
                          ? " (copied)"
                          : ""
                      : row.current
                        ? " (new baseline)"
                        : " (not repeated yet)";
                  const label = `${exerciseName(row.exerciseId)}${variation !== "Standard" ? `, ${variation}` : ""}${status}`;
                  return compareValueBar(label, currentValue, previousValue, 1, " kg");
                })
                .join("") || `<p class="muted">No current-week e1RM data imported yet.</p>`}
            </div>
            <p class="muted">Green is this week's best equipment-adjusted estimated 1RM for the lift; blue ghost is the comparison baseline. Last week is used when available; otherwise the chart uses the most recent prior observed week and labels it as older.</p>
          </section>

          <section class="panel" style="margin-top: 18px;">
            <h2>Completed lift overlays</h2>
            ${
              liftRows.length
                ? `<div class="table-wrap">
                    <table>
                      <thead><tr><th>Lift</th><th>Sets this/last</th><th>Load this/last</th><th>e1RM this/comparison</th><th>Signal</th></tr></thead>
                      <tbody>
                        ${liftRows
                          .map((key) => {
                            const [exerciseId, variationId] = key.split(":");
                            const current = currentExerciseTotals.get(key) || { sets: 0, adjustedVolume: 0 };
                            const previous = previousExerciseTotals.get(key) || { sets: 0, adjustedVolume: 0 };
                            const currentLiftBest = currentBest.get(key);
                            const previousLiftBest = previousBest.get(key);
                            const delta =
                              currentLiftBest && previousLiftBest
                                ? currentLiftBest.e1rm - previousLiftBest.e1rm
                                : null;
                            const fallbackSignal =
                              previousLiftBest?.fallback && previousLiftBest.week
                                ? `vs older baseline ${formatWeekRange(previousLiftBest.week)}${comparisonAgeLabel(previousLiftBest) ? ` (${comparisonAgeLabel(previousLiftBest)})` : ""}`
                                : "";
                            const signal =
                              !currentExerciseTotals.has(key)
                                ? "not repeated yet"
                                : fallbackSignal && delta !== null
                                ? `${delta >= 0 ? "up" : "down"} ${formatNumber(Math.abs(delta), 1)} kg ${fallbackSignal}`
                                : fallbackSignal
                                ? fallbackSignal
                                : !previousExerciseTotals.has(key)
                                ? "new this week"
                                : delta === null
                                  ? "volume only"
                                  : delta >= 0
                                    ? `up ${formatNumber(delta, 1)} kg`
                                    : `down ${formatNumber(delta, 1)} kg`;
                            return `
                              <tr>
                                <td>${exerciseName(exerciseId)}${variationName(variationId) !== "Standard" ? `, ${variationName(variationId)}` : ""}</td>
                                <td>
                                  ${formatNumber(current.sets, 0)}${current.copiedSets ? ` (${formatNumber(current.copiedSets, 0)} copied)` : ""}
                                  /
                                  ${formatNumber(previous.sets, 0)}${previous.copiedSets ? ` (${formatNumber(previous.copiedSets, 0)} copied)` : ""}
                                </td>
                                <td>${formatNumber(current.adjustedVolume, 1)} / ${formatNumber(previous.adjustedVolume, 1)}</td>
                                <td>${currentLiftBest ? formatNumber(currentLiftBest.e1rm, 1) : "-"} / ${previousLiftBest ? formatNumber(previousLiftBest.e1rm, 1) : "-"}</td>
                                <td>${signal}</td>
                              </tr>
                            `;
                          })
                          .join("")}
                      </tbody>
                    </table>
                  </div>`
                : `<p class="muted">No current-week lift data imported yet.</p>`
            }
            ${missedKeys.length ? `<p class="muted">Not repeated yet from last week: ${missedKeys.slice(0, 10).map((key) => exerciseName(key.split(":")[0])).join(", ")}${missedKeys.length > 10 ? ", ..." : ""}</p>` : ""}
          </section>
        `;
      }

      function renderPlans(summary) {
        const tables = summary.tables || {};
        const draft = loadPlanDraft(tables);
        const activePlan = draft.plans?.[0] || { id: "training-regime-2026", name: "Workout Plan" };
        const activeVersion =
          (draft.planVersions || []).find((version) => version.id === activePlan.currentVersionId) ||
          (draft.planVersions || [])[0] ||
          null;
        const template = draft.planTemplate || planTemplateFromTables(tables, activePlan.id);
        const assignments = (tables.plan_assignment || []).filter((assignment) => assignment.workout_plan_id === activePlan.id);
        const totalSets = (template.days || []).reduce(
          (sum, day) => sum + (day.exercises || []).reduce((daySum, exercise) => daySum + number(exercise.targetSets), 0),
          0,
        );
        const phoneContext = {
          schemaVersion: 1,
          exportedAt: new Date().toISOString(),
          kind: "lifting-tracker-phone-plan-context",
          activePlan,
          activeVersion,
          weekOverrides: draft.weekOverrides || [],
          planTemplate: template,
        };

        return `
          <section class="panel">
            <div class="bar-label">
              <div>
                <h2>Plans</h2>
                <p class="muted">Mac-side planning brain. The phone should receive this as context; logged sets remain the truth.</p>
              </div>
              <span class="pill good">${escapeHtml(activePlan.name)}</span>
            </div>
            <div class="grid metrics">
              <div class="metric-card good"><span class="muted">Active plan</span><span class="metric-value">${escapeHtml(activePlan.name)}</span><span class="muted">${escapeHtml(activeVersion?.name || "no version")}</span></div>
              <div class="metric-card"><span class="muted">Training days</span><span class="metric-value">${formatNumber(template.days?.length || 0, 0)}</span><span class="muted">${formatNumber(totalSets, 0)} planned sets per full week</span></div>
              <div class="metric-card watch"><span class="muted">Week overrides</span><span class="metric-value">${formatNumber((draft.weekOverrides || []).length, 0)}</span><span class="muted">normal / deload / test / travel / off</span></div>
            </div>
          </section>

          <section class="grid dashboard" style="margin-top: 18px;">
            <section class="panel">
              <h2>Plan identity</h2>
              <div class="toggle-row">
                <label for="plan-name-input" class="muted">Name</label>
                <input id="plan-name-input" type="text" value="${escapeHtml(activePlan.name)}" style="min-width: 260px;" />
              </div>
              <div class="toggle-row">
                <label for="plan-version-input" class="muted">Current version</label>
                <input id="plan-version-input" type="text" value="${escapeHtml(activeVersion?.name || "")}" style="min-width: 260px;" />
              </div>
              <p class="muted" style="margin-top: 12px;">Stable plan id stays <code>${escapeHtml(activePlan.id)}</code> so historic sessions do not detach.</p>
              <div class="pill-row">
                <button id="plan-save-button" type="button">Save browser draft</button>
                <button id="plan-reset-button" class="secondary" type="button">Reset from latest import</button>
                <button id="plan-download-button" class="secondary" type="button">Download plan-config.json</button>
                <button id="phone-plan-download-button" class="secondary" type="button">Download phone plan context</button>
              </div>
            </section>

            <section class="panel">
              <h2>Assigned eras</h2>
              ${
                assignments.length
                  ? `<div class="table-wrap" style="margin-top: 12px;">
                      <table>
                        <thead><tr><th>Assignment</th><th>Starts</th><th>Ends</th><th>Block</th></tr></thead>
                        <tbody>
                          ${assignments
                            .map(
                              (assignment) => `
                                <tr>
                                  <td>${escapeHtml(assignment.id)}</td>
                                  <td>${formatDate(assignment.started_at)}</td>
                                  <td>${assignment.ended_at ? formatDate(assignment.ended_at) : "active"}</td>
                                  <td>${escapeHtml(assignment.training_block_id || "-")}</td>
                                </tr>
                              `,
                            )
                            .join("")}
                        </tbody>
                      </table>
                    </div>`
                  : `<p class="muted" style="margin-top: 12px;">No plan assignment imported yet.</p>`
              }
              <p class="muted" style="margin-top: 12px;">Assignments say which plan was active during a date range. Week overrides below say whether a specific week was normal, deload, test, travel, or off.</p>
            </section>
          </section>

          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Weekly overrides</h2>
              <span class="muted">Use Monday week starts, e.g. 8 Jun 2026.</span>
            </div>
            <textarea id="week-overrides-textarea" spellcheck="false">${escapeHtml(JSON.stringify(draft.weekOverrides || [], null, 2))}</textarea>
            <p class="muted" style="margin-top: 10px;">Set <code>week_type</code> to <code>deload</code> and lower <code>volume_multiplier</code>/<code>intensity_multiplier</code> so adherence analytics do not treat a planned easy week as failure.</p>
          </section>

          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Plan template JSON</h2>
              <span class="muted">Edit days/exercises here, then download and promote it into <code>data/plan-config.json</code>.</span>
            </div>
            <textarea id="plan-template-textarea" spellcheck="false">${escapeHtml(JSON.stringify(template, null, 2))}</textarea>
          </section>

          <section class="grid dashboard" style="margin-top: 18px;">
            ${(template.days || [])
              .map(
                (day) => `
                  <section class="panel">
                    <div class="bar-label">
                      <h2>${escapeHtml(day.name || `Day ${day.dayIndex}`)}</h2>
                      <span class="muted">${formatNumber((day.exercises || []).reduce((sum, exercise) => sum + number(exercise.targetSets), 0), 0)} sets</span>
                    </div>
                    <div class="table-wrap" style="margin-top: 12px;">
                      <table>
                        <thead><tr><th>Exercise</th><th>Variation</th><th>Sets</th></tr></thead>
                        <tbody>
                          ${(day.exercises || [])
                            .map(
                              (exercise) => `
                                <tr>
                                  <td>${escapeHtml(exercise.sourceName || exerciseName(exercise.exerciseId))}</td>
                                  <td>${escapeHtml(variationName(exercise.variationId))}</td>
                                  <td>${formatNumber(exercise.targetSets, 0)}</td>
                                </tr>
                              `,
                            )
                            .join("")}
                        </tbody>
                      </table>
                    </div>
                  </section>
                `,
              )
              .join("")}
          </section>
        `;
      }

      function volumeBenchmarkStatus(value) {
        if (value < 5) return { label: "low", className: "bad", target: "5-9+" };
        if (value < 10) return { label: "moderate", className: "watch", target: "10-15" };
        if (value <= 15) return { label: "productive", className: "good", target: "10-15" };
        if (value <= 22) return { label: "high", className: "watch", target: "10-15" };
        return { label: "very high", className: "bad", target: "10-15" };
      }

      function lifterVolumeBand(sets) {
        if (sets < 30) return { label: "minimalist", className: "watch", description: "low total weekly workload" };
        if (sets < 60) return { label: "moderate", className: "good", description: "typical recreational lifter territory" };
        if (sets < 100) return { label: "high", className: "good", description: "serious hypertrophy/strength training volume" };
        if (sets < 140) return { label: "very high", className: "watch", description: "advanced or specialization block territory" };
        return { label: "extreme", className: "bad", description: "extreme weekly set count; recovery assumptions matter" };
      }

      function volumeMarkerPercent(sets) {
        return Math.max(0, Math.min(100, (number(sets) / 170) * 100));
      }

      function lifterVolumeScalePanel(title, setCount, subtitle = "") {
        const band = lifterVolumeBand(setCount || 0);
        const percent = volumeMarkerPercent(setCount || 0);
        const note = subtitle || band.description;
        const cleanNote = note.endsWith(".") ? note : `${note}.`;
        return `
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>${title}</h2>
              <span class="pill ${band.className}">${band.label}</span>
            </div>
            <div class="volume-scale">
              <div class="volume-scale-track">
                <div class="volume-band">0-29<br />minimalist</div>
                <div class="volume-band">30-59<br />moderate</div>
                <div class="volume-band">60-99<br />high</div>
                <div class="volume-band">100-139<br />very high</div>
                <div class="volume-band">140+<br />extreme</div>
                <div class="volume-marker" style="left:${percent}%"></div>
                <div class="volume-marker-label" style="left:${percent}%">${formatNumber(setCount || 0, 0)} sets</div>
              </div>
              <p class="muted">${cleanNote} This scale is based on total hard sets per week, so it is comparable across lifters in a way raw kg volume is not.</p>
            </div>
          </section>
        `;
      }

      function currentWeekFinishProjection(summary, currentObservedOrCopiedSets) {
        const row = (summary.weeklyPlanRows || []).find((item) => item.week === summary.currentWeek);
        if (!row || row.status !== "in_progress") {
          return currentObservedOrCopiedSets || 0;
        }
        const remainingPlannedSets = Math.max(0, number(row.fullPlannedSets) - number(row.plannedSets));
        return (currentObservedOrCopiedSets || 0) + remainingPlannedSets;
      }

      function volumeBenchmarksPanel(summary) {
        const rows = (summary.muscleWeeklyEffectiveSets || [])
          .filter((row) => row.week === summary.currentWeek)
          .sort((a, b) => b.value - a.value)
          .slice(0, 8);

        if (!rows.length) {
          return `
            <section class="panel" style="margin-top: 18px;">
              <h2>Volume benchmarks</h2>
              <p class="muted">No current-week effective-set data yet.</p>
            </section>
          `;
        }

        return `
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Volume benchmarks</h2>
              <span class="muted">effective sets per muscle this week</span>
            </div>
            <div class="bar-list">
              ${rows
                .map((row) => {
                  const status = volumeBenchmarkStatus(row.value);
                  const width = Math.max(4, Math.min(100, (row.value / 22) * 100));
                  return `
                    <div class="bar-row">
                      <div class="bar-label">
                        <span>${row.muscle}</span>
                        <strong>${formatNumber(row.value, 1)} <span class="muted">sets</span></strong>
                      </div>
                      <div class="bar-track"><div class="bar-fill" style="width:${width}%; background: ${
                        status.className === "good" ? "var(--green)" : status.className === "watch" ? "var(--amber)" : "var(--red)"
                      };"></div></div>
                      <span class="muted">${status.label}; broad productive range ${status.target} effective sets/week</span>
                    </div>
                  `;
                })
                .join("")}
            </div>
            <p class="muted" style="margin-top: 12px;">Benchmarks are deliberately broad. They use coefficient-weighted hard-set exposure, not raw kg volume.</p>
          </section>
        `;
      }

      function planProgressPanel(summary) {
        const progress = summary.planProgress;
        if (!progress) {
          return `
            <section class="panel" style="margin-top: 18px;">
              <h2>Current plan progress</h2>
              <p class="muted">No active plan assignment is available.</p>
            </section>
          `;
        }

        const completionPercent = progress.completion === null ? null : progress.completion * 100;
        const actualStatus = progress.totalActualSets > 0 ? "good" : "watch";
        const matchedStatus = completionPercent === null ? "watch" : completionPercent >= 80 ? "good" : completionPercent >= 40 ? "watch" : "bad";
        const extraLabel = progress.unplannedSets ? "extra actual work" : "no extra actual work";

        return `
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Current plan progress</h2>
              <span class="muted">${progress.planName}, ${formatWeekRange(progress.week)}; ${progress.weekType || "normal"}</span>
            </div>
            <div class="grid metrics">
              <div class="metric-card ${progress.plannedSets ? "good" : "watch"}"><span class="muted">Plan in scope</span><span class="metric-value">${progress.plannedSets}</span><span class="muted">${progress.expectedDays} of ${progress.totalDays} training days represented${progress.volumeMultiplier !== 1 ? `, ${formatNumber(progress.volumeMultiplier * 100)}% volume` : ""}</span></div>
              <div class="metric-card ${actualStatus}"><span class="muted">Actual sets logged</span><span class="metric-value">${progress.totalActualSets}</span><span class="muted">${progress.actualPlannedSets} matched plan${progress.copiedPlannedSets ? `, ${progress.copiedPlannedSets} copied` : ""}</span></div>
              <div class="metric-card ${matchedStatus}"><span class="muted">Matched plan sets</span><span class="metric-value">${progress.actualPlannedSets}</span><span class="muted">${completionPercent === null ? "no plan rows in scope" : `${formatNumber(completionPercent)}% of represented plan`}</span></div>
              <div class="metric-card ${progress.unplannedSets ? "watch" : "good"}"><span class="muted">Unplanned sets</span><span class="metric-value">${progress.unplannedSets}</span><span class="muted">${extraLabel}</span></div>
            </div>
            <p class="muted" style="margin-top: 12px;">Training days are inferred from actual exercise matches plus copied Day 4/5 projections. This avoids treating Wednesday as automatically requiring Wednesday's share of the weekly plan.</p>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Day</th><th>Exercise</th><th>Variation</th><th>Planned</th><th>Actual</th><th>Copied</th><th>Status</th></tr></thead>
                <tbody>
                  ${progress.rows
                    .map(
                      (row) => `
                        <tr>
                          <td>${row.dayLabel}</td>
                          <td>${exerciseName(row.exerciseId)}</td>
                          <td>${variationName(row.variationId)}</td>
                          <td>${row.plannedSets || "-"}</td>
                          <td>${row.actualSets}</td>
                          <td>${row.copiedSets || "-"}</td>
                          <td>${row.status}</td>
                        </tr>
                      `,
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
            <p class="muted">Unplanned means actual logged work that does not match a represented plan exercise. The current import only contains today's three bench sets; glute/preacher work will show here once those sets are imported.</p>
          </section>
        `;
      }

      function normsPanel(summary) {
        const rows = summary.applicableNorms || [];
        const levelOrder = ["beginner", "novice", "intermediate", "advanced", "elite"];
        const bestByExercise = new Map();
        for (const row of summary.exerciseBest) {
          const previous = bestByExercise.get(row.exerciseId);
          if (!previous || row.e1rm > previous.e1rm) bestByExercise.set(row.exerciseId, row);
        }
        const grouped = new Map();

        for (const row of rows) {
          grouped.set(row.exercise_id, [...(grouped.get(row.exercise_id) || []), row]);
        }

        const comparisonRows = [...grouped.entries()].map(([exerciseId, norms]) => {
          const sortedNorms = norms
            .filter((norm) => norm.metric === "absolute_e1rm")
            .sort((a, b) => levelOrder.indexOf(a.level) - levelOrder.indexOf(b.level));
          const best = bestByExercise.get(exerciseId);
          const achieved = best
            ? sortedNorms.filter((norm) => best.e1rm >= number(norm.value)).at(-1)?.level || "below beginner"
            : "no e1RM yet";

          return {
            exerciseId,
            best,
            achieved,
            sortedNorms,
          };
        });

        return `
          <section class="panel" style="margin-top: 18px;">
            <h2>External norms</h2>
            <p class="muted">Selected category: ${summary.normSex || "unspecified"}${
              summary.currentBodyWeight ? ` / ${formatNumber(summary.currentBodyWeight, 1)} kg bodyweight band` : ""
            }. Your lifts are scaled to estimated 1RM before comparison. Thresholds are editable kg data, not app logic.</p>
            ${
              comparisonRows.length
                ? `<div class="table-wrap" style="margin-top: 12px;"><table>
                    <thead><tr><th>Exercise</th><th>Best e1RM</th><th>Current level</th><th>Thresholds</th><th>Source</th></tr></thead>
                    <tbody>
                      ${comparisonRows
                        .map(
                          (row) => `
                            <tr>
                              <td>${exerciseName(row.exerciseId)}</td>
                              <td>${row.best ? `${formatNumber(row.best.e1rm, 1)} kg` : "missing"}</td>
                              <td>${row.achieved}</td>
                              <td>${row.sortedNorms.map((norm) => `${norm.level}: ${formatNumber(number(norm.value), 1)}kg`).join(" / ")}</td>
                              <td>${row.sortedNorms[0]?.source || ""}</td>
                            </tr>
                          `,
                        )
                        .join("")}
                    </tbody>
                  </table></div>`
                : `<p class="muted">No norms match this category yet. Add rows to strength_norm and re-export.</p>`
            }
          </section>
        `;
      }

      function standardsSnapshotPanel(summary) {
        const priorityExerciseIds = ["bench-press", "overhead-press", "squat", "deadlift", "pull-up", "incline-bench-press"];
        const levelOrder = ["beginner", "novice", "intermediate", "advanced", "elite"];
        const latestByExercise = new Map();
        const bestByExercise = new Map();

        for (const row of summary.exerciseWeeklyBest || []) {
          const latest = latestByExercise.get(row.exerciseId);
          if (!latest || row.week > latest.week || (row.week === latest.week && row.e1rm > latest.e1rm)) latestByExercise.set(row.exerciseId, row);
          const best = bestByExercise.get(row.exerciseId);
          if (!best || row.e1rm > best.e1rm) bestByExercise.set(row.exerciseId, row);
        }

        const normsByExercise = new Map();
        for (const norm of summary.applicableNorms || []) {
          if (norm.metric !== "absolute_e1rm") continue;
          normsByExercise.set(norm.exercise_id, [...(normsByExercise.get(norm.exercise_id) || []), norm]);
        }

        const preferredNorms = (norms) => {
          if (!norms.length) return norms;
          const strengthLevel = norms.filter((norm) => String(norm.source || "").includes("Strength Level"));
          return strengthLevel.length ? strengthLevel : norms;
        };

        const benchmarkSourceText = (row) => {
          const source = row.latest || row.best;
          if (!source) return "";
          if (source.loggedAt && Number.isFinite(number(source.reps)) && Number.isFinite(number(source.loadWeight))) {
            return `e1RM source: ${formatNumber(number(source.loadWeight), 1)}kg x ${formatNumber(number(source.reps), 0)} on ${formatDateTime(source.loggedAt)}`;
          }
          return `${row.latest ? "latest" : "best"} observed week: ${formatWeekRange(source.week)}`;
        };

        const rows = priorityExerciseIds
          .map((exerciseId) => {
            const norms = preferredNorms(normsByExercise.get(exerciseId) || [])
              .slice()
              .sort((a, b) => levelOrder.indexOf(a.level) - levelOrder.indexOf(b.level));
            const latest = latestByExercise.get(exerciseId);
            const best = bestByExercise.get(exerciseId);
            const value = latest?.e1rm ?? best?.e1rm ?? null;
            const maxNorm = Math.max(...norms.map((norm) => number(norm.value)), 0);
            const maxValue = Math.max(maxNorm, value || 0, 1);
            const achieved = !norms.length
              ? "no standard loaded"
              : value
                ? norms.filter((norm) => value >= number(norm.value)).at(-1)?.level || "below beginner"
                : "no e1RM";

            return {
              exerciseId,
              norms,
              latest,
              best,
              value,
              maxValue,
              achieved,
            };
          })
          .filter((row) => row.norms.length || row.value);

        if (!rows.length) {
          return `
            <section class="panel" style="margin-top: 18px;">
              <h2>Strength standards snapshot</h2>
              <p class="muted">No benchmark lifts have matching standards in this import yet.</p>
            </section>
          `;
        }

        return `
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Strength standards snapshot</h2>
              <span class="muted">${summary.normSex || "unspecified"}${summary.currentBodyWeight ? `, ${formatNumber(summary.currentBodyWeight, 1)}kg` : ""}</span>
            </div>
            <div class="standards-list">
              ${rows
                .map((row) => {
                  const markerLeft = row.value ? Math.min(100, (row.value / row.maxValue) * 100) : 0;
                  const fillWidth = row.value ? markerLeft : 0;
                  const sourceText = benchmarkSourceText(row);
                  return `
                    <div class="standard-row">
                      <div class="standard-name">
                        <strong>${exerciseName(row.exerciseId)}</strong>
                <span class="muted">${row.achieved}${row.latest ? `, latest ${formatWeekRange(row.latest.week)}` : row.best ? `, best ${formatWeekRange(row.best.week)}` : ""}</span>
                        ${sourceText ? `<span class="muted">${escapeHtml(sourceText)}</span>` : ""}
                        ${row.norms[0]?.source ? `<span class="muted">${row.norms[0].source}</span>` : ""}
                      </div>
                      <div class="standard-track" aria-label="${exerciseName(row.exerciseId)} standards">
                        ${row.norms.length
                          ? row.norms
                              .map((norm, index) => {
                                const previousValue = index === 0 ? 0 : number(row.norms[index - 1].value);
                                const currentValue = number(norm.value);
                                const left = Math.min(100, (previousValue / row.maxValue) * 100);
                                const width = Math.max(0, Math.min(100, (currentValue / row.maxValue) * 100) - left);
                                return `<span class="standard-band ${norm.level}" style="left: ${left}%; width: ${width}%" title="${norm.level}: ${formatNumber(currentValue, 1)}kg"></span>`;
                              })
                              .join("")
                          : `<span class="muted" style="position: absolute; left: 10px; top: -1px; font-size: 0.75rem;">No standard in loaded norms</span>`}
                        ${row.norms.length ? `<div class="standard-fill" style="width: ${fillWidth}%"></div>` : ""}
                        ${row.norms
                          .map((norm) => {
                            const left = Math.min(100, (number(norm.value) / row.maxValue) * 100);
                            return `<span class="standard-tick" style="left: ${left}%" title="${norm.level}: ${formatNumber(number(norm.value), 1)}kg"></span>`;
                          })
                          .join("")}
                        ${row.value ? `<span class="standard-marker" style="left: ${markerLeft}%" title="You: ${formatNumber(row.value, 1)}kg"></span>` : ""}
                      </div>
                      <div class="standard-value">${row.value ? `${formatNumber(row.value, 1)}kg` : "missing"}</div>
                    </div>
                  `;
                })
                .join("")}
            </div>
            <div class="pill-row">
              ${levelOrder.map((level) => `<span class="pill">${level}</span>`).join("")}
            </div>
            <p class="muted" style="margin-top: 12px;">Ticks are standard thresholds; the bright marker is your latest e1RM for that lift. If a lift has no recent data, the panel falls back to imported best so dormant lifts still have context.</p>
          </section>
        `;
      }

      function sessionTable(rows) {
        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Session</th><th>Mode</th><th>Sets</th><th>Adherence</th><th>Skipped</th><th>Unplanned</th></tr></thead>
              <tbody>
                ${rows
                  .map(
                    (row) => `
                      <tr>
                        <td>${row.startedAt || row.id}</td>
                        <td>${row.mode}</td>
                        <td>${row.completedSets} / ${row.plannedSets || "-"}</td>
                        <td>${row.completion === null ? "freestyle" : `${formatNumber(row.completion * 100)}%`}</td>
                        <td>${row.skippedExercises}</td>
                        <td>${row.unplannedExercisesAdded}</td>
                      </tr>
                    `,
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function benchmarkTable(summary) {
        const rows = summary.exerciseBest || [];
        const displayRows = normalizeBenchmarks ? rows.filter((row) => row.normalized) : rows;
        const latestByExercise = new Map();
        const recentCutoffWeek = addWeek(summary.currentWeek, -3);
        const recentBestByExercise = new Map();
        for (const row of summary.exerciseWeeklyBest || []) {
          const key = `${row.exerciseId}:${row.variationId}`;
          const previous = latestByExercise.get(key);
          if (!previous || row.week > previous.week) latestByExercise.set(key, row);

          if (row.week >= recentCutoffWeek) {
            const recentPrevious = recentBestByExercise.get(key);
            if (!recentPrevious || row.e1rm > recentPrevious.e1rm) recentBestByExercise.set(key, row);
          }
        }

        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Exercise</th><th>Variation</th><th>Recent best</th><th>All-time best</th><th>Latest observed</th><th>Delta from best</th></tr></thead>
              <tbody>
                ${displayRows
                  .slice(0, 30)
                  .map((row) => {
                    const latest = latestByExercise.get(`${row.exerciseId}:${row.variationId}`);
                    const recent = recentBestByExercise.get(`${row.exerciseId}:${row.variationId}`);
                    const bestValue = normalizeBenchmarks ? row.normalized : row.e1rm;
                    const latestValue = latest ? (normalizeBenchmarks ? latest.normalized : latest.e1rm) : null;
                    const recentValue = recent ? (normalizeBenchmarks ? recent.normalized : recent.e1rm) : null;
                    const delta = latestValue === null || latestValue === undefined ? null : latestValue - bestValue;
                    return `
                      <tr>
                        <td>${exerciseName(row.exerciseId)}</td>
                        <td>${variationName(row.variationId)}</td>
                        <td>${recent ? `${normalizeBenchmarks ? formatNumber(recentValue, 2) : `${formatNumber(recentValue, 1)} kg`} (${formatWeekRange(recent.week)})` : "missing"}</td>
                        <td>${normalizeBenchmarks ? formatNumber(bestValue, 2) : `${formatNumber(bestValue, 1)} kg`}</td>
                        <td>${latest ? `${normalizeBenchmarks ? formatNumber(latestValue, 2) : `${formatNumber(latestValue, 1)} kg`} (${formatWeekRange(latest.week)})` : "missing"}</td>
                        <td>${delta === null ? "missing" : `${delta >= 0 ? "+" : ""}${formatNumber(delta, normalizeBenchmarks ? 2 : 1)}${normalizeBenchmarks ? "" : " kg"}`}</td>
                      </tr>
                    `;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function benchmarkTrendPanels(summary) {
        const domainWeeks = chartWeeksFor(summary, summary.exerciseWeeklyBest || []);
        const earliestWeek = domainWeeks[0];
        const latestObservedByExercise = new Map();
        const priorityExerciseIds = ["bench-press", "overhead-press", "squat", "deadlift", "pull-up", "incline-bench-press", "landmine-row"];
        for (const row of summary.exerciseWeeklyBest || []) {
          if (earliestWeek && row.week < earliestWeek) continue;
          const key = `${row.exerciseId}:${row.variationId}`;
          const previous = latestObservedByExercise.get(key);
          if (!previous || row.week > previous.week || (row.week === previous.week && row.e1rm > previous.e1rm)) latestObservedByExercise.set(key, row);
        }
        const priorityKeys = priorityExerciseIds
          .map((exerciseId) => [...latestObservedByExercise.keys()].find((key) => key.startsWith(`${exerciseId}:`)))
          .filter(Boolean);
        const topExercises = [...new Set([
          ...priorityKeys,
          ...[...latestObservedByExercise.entries()]
          .sort((a, b) => b[1].week.localeCompare(a[1].week) || b[1].e1rm - a[1].e1rm)
          .map(([key]) => key),
        ])].slice(0, 8);
        return topExercises
          .map((key) => {
            const [exerciseId, variationId] = key.split(":");
            const rows = (summary.exerciseWeeklyBest || [])
              .filter((row) => row.exerciseId === exerciseId && row.variationId === variationId)
              .filter((row) => (normalizeBenchmarks ? row.normalized : row.e1rm))
              .map((row) => ({ week: row.week, value: normalizeBenchmarks ? row.normalized : row.e1rm }));
            const suffix = normalizeBenchmarks ? "e1RM / bodyweight" : "e1RM";
            return lineChart(`${exerciseName(exerciseId)} ${suffix}`, rows, { color: "#7fa8ef", weeks: domainWeeks });
          })
          .join("");
      }

      function normalizedStrengthPanels(summary) {
        const domainWeeks = chartWeeksFor(summary, summary.exerciseWeeklyBest || []);
        const priorityExerciseIds = ["bench-press", "overhead-press", "squat", "deadlift", "pull-up", "incline-bench-press", "landmine-row"];
        const bestByKey = new Map();
        for (const row of summary.exerciseWeeklyBest || []) {
          const key = `${row.exerciseId}:${row.variationId}`;
          const previous = bestByKey.get(key);
          if (!previous || row.e1rm > previous.e1rm) bestByKey.set(key, row);
        }
        const keys = priorityExerciseIds
          .map((exerciseId) => [...bestByKey.keys()].find((key) => key.startsWith(`${exerciseId}:`)))
          .filter(Boolean);
        const series = keys.map((key) => {
          const [exerciseId, variationId] = key.split(":");
          const best = bestByKey.get(key)?.e1rm || 1;
          return {
            label: exerciseName(exerciseId),
            rows: (summary.exerciseWeeklyBest || [])
              .filter((row) => row.exerciseId === exerciseId && row.variationId === variationId)
              .map((row) => ({ week: row.week, value: (row.e1rm / best) * 100 })),
          };
        });
        const indexByWeek = new Map();
        for (const item of series) {
          for (const row of item.rows) {
            const current = indexByWeek.get(row.week) || [];
            current.push(row.value);
            indexByWeek.set(row.week, current);
          }
        }
        const indexRows = [...indexByWeek.entries()]
          .map(([week, values]) => ({ week, value: values.reduce((sum, value) => sum + value, 0) / values.length }))
          .sort((a, b) => a.week.localeCompare(b.week));

        const overlayWeeks = benchmarkOverlayRange === "3m" ? domainWeeks.slice(Math.max(0, domainWeeks.length - 13)) : domainWeeks;
        const rangeControls = `
          <button class="${benchmarkOverlayRange === "all" ? "" : "secondary"}" type="button" data-benchmark-overlay-range="all">All-time</button>
          <button class="${benchmarkOverlayRange === "3m" ? "" : "secondary"}" type="button" data-benchmark-overlay-range="3m">3 months</button>
        `;

        return `
          ${lineChart("Overall strength index", indexRows, { color: "#72c69a", weeks: domainWeeks })}
          ${multiLineChart("Benchmark lifts overlaid", series, {
            weeks: overlayWeeks,
            tightY: benchmarkOverlayRange === "3m",
            minYSpan: 8,
            rangeControls,
            note:
              benchmarkOverlayRange === "3m"
                ? "Each lift is normalized to its own imported all-time best. This view is zoomed to the last 3 months with a tighter y-axis so small changes are visible. Dashed lines mark no-data spans."
                : "Each lift is normalized to its own imported all-time best, so different lifts can be overlaid. Dashed lines mark no-data spans.",
          })}
        `;
      }

      function renderOverview(summary) {
        const currentRows = summary.sessionRows.filter((row) => row.week === summary.currentWeek);
        const currentAdherenceRows = summary.weeklyPlanRows.filter((row) => row.week === summary.currentWeek);
        const currentAdherence = currentAdherenceRows[0]?.completion;
        const currentMuscles = (summary.muscleWeeklyVolume || [])
          .filter((row) => row.week === summary.currentWeek)
          .sort((a, b) => b.value - a.value)
          .map((row) => [row.muscle, row.value]);
        const completeWeeks = (summary.weeklyTotals || []).filter((row) => row.week !== summary.currentWeek);
        const latestComplete = completeWeeks.at(-1);
        const median = (values) => {
          const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
          if (!sorted.length) return null;
          const middle = Math.floor(sorted.length / 2);
          return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
        };
        const medianCompleteSets = median(completeWeeks.map((row) => row.sets)) || 0;
        const volumeStatus =
          !latestComplete || !medianCompleteSets
            ? "watch"
            : latestComplete.sets >= medianCompleteSets
              ? "good"
              : latestComplete.sets >= medianCompleteSets * 0.7
                ? "watch"
                : "bad";
        const currentStatus = summary.currentWeekStats.sets > 0 ? "good" : "watch";
        const planCompletion = summary.planProgress?.completion;
        const planInScope = summary.planProgress?.plannedSets || 0;
        const planActual = summary.planProgress?.actualPlannedSets || 0;
        const planCopied = summary.planProgress?.copiedPlannedSets || 0;
        const planExtras = summary.planProgress?.unplannedSets || 0;
        const planStatus =
          !summary.planProgress ? "watch" : planActual > 0 || planCopied > 0 ? "good" : planInScope > 0 ? "watch" : "bad";
        const currentComparableSets = (summary.currentWeekStats.sets || 0) + (summary.currentProjectedStats.sets || 0);
        const currentFinishProjectedSets = currentWeekFinishProjection(summary, currentComparableSets);

        return `
          <section class="grid metrics">
            <div class="metric-card ${currentStatus}"><span class="muted">Current week</span><span class="metric-value">${summary.currentWeekStats.sets || 0}</span><span class="muted">sets so far</span></div>
            <div class="metric-card ${volumeStatus}"><span class="muted">Latest complete week</span><span class="metric-value">${latestComplete ? latestComplete.sets : "-"}</span><span class="muted">${latestComplete ? `${formatWeekRange(latestComplete.week)}, median ${formatNumber(medianCompleteSets, 1)}` : "missing"}</span></div>
            <div class="metric-card ${planStatus}"><span class="muted">Plan in scope</span><span class="metric-value">${planInScope || "-"}</span><span class="muted">${planActual} actual matched${planCopied ? `, ${planCopied} copied` : ""}${planExtras ? `, ${planExtras} extra` : ""}</span></div>
          </section>

          <section class="panel">
            <h2>Overall overview</h2>
            <div class="pill-row">
              <span class="pill ${volumeStatus}">Latest complete week ${volumeStatus === "good" ? "above median sets" : volumeStatus === "watch" ? "near/lower than median" : "well below median"}</span>
              <span class="pill ${currentStatus}">Current week ${summary.currentWeekStats.sets ? "in progress" : "no sets yet"}</span>
              <span class="pill ${planStatus}">Plan ${summary.planProgress ? `${summary.planProgress.expectedDays}/${summary.planProgress.totalDays} days represented` : "not assigned"}</span>
              ${planExtras ? `<span class="pill watch">${planExtras} unplanned actual set${planExtras === 1 ? "" : "s"}</span>` : ""}
            </div>
          </section>

          <section class="grid dashboard">
            ${bars("This week muscle volume", currentMuscles.length ? currentMuscles : [["No sets this week", 1]])}
            ${bars("All-time compound/accessory split", summary.splitVolume.length ? summary.splitVolume : [["No tagged volume", 1]])}
          </section>

          ${lifterVolumeScalePanel(
            "Current week projected finish lifter-volume scale",
            currentFinishProjectedSets,
            `${currentComparableSets} actual/copied sets so far, projected to ${formatNumber(currentFinishProjectedSets, 0)} if the remaining planned training days are completed. Use this as a broad external scale; use kg volume only for your own week-to-week trend.`,
          )}
          ${weekComparisonPanel(summary)}
          ${volumeBenchmarksPanel(summary)}
          ${planProgressPanel(summary)}
          ${weeklyPlanPanel(summary)}
          ${currentRows.length ? sessionTable(currentRows) : `<section class="empty" style="margin-top: 18px;">No sessions logged for the current ${weekStartLabel()} week yet.</section>`}
          ${weightTrend(summary.bodyWeights)}
        `;
      }

      function renderBodyComposition(summary) {
        const composition = bodyCompositionSeries(summary);
        const rows = composition.rows;
        const latest = rows.at(-1);
        const domainWeeks = chartWeeksFor(summary, rows);
        const ffmiRows = rows.map((row) => ({
          week: row.week,
          value: row.ffmi,
          low: row.ffmiLow,
          high: row.ffmiHigh,
          title: `${row.provenance} | FFMI ${formatNumber(row.ffmi, 2)} (${formatNumber(row.ffmiLow, 2)}-${formatNumber(row.ffmiHigh, 2)})`,
        }));
        const ensembleFfmiRows = rows.map((row) => ({
          week: row.week,
          value: row.ensembleFfmi,
          low: row.ensembleFfmiLow,
          high: row.ensembleFfmiHigh,
          title: `${row.provenance} | ensemble FFMI ${formatNumber(row.ensembleFfmi, 2)} (${formatNumber(row.ensembleFfmiLow, 2)}-${formatNumber(row.ensembleFfmiHigh, 2)}); waist trust ${formatNumber(row.waistTrust * 100, 0)}%`,
        }));
        const trainedFfmiRows = rows.map((row) => ({
          week: row.week,
          value: row.trainedFfmi,
          low: row.trainedFfmiLow,
          high: row.trainedFfmiHigh,
          title: `${row.trainedProvenance} | trained-lifter adjusted FFMI ${formatNumber(row.trainedFfmi, 2)} (${formatNumber(row.trainedFfmiLow, 2)}-${formatNumber(row.trainedFfmiHigh, 2)})`,
        }));
        const disagreementRows = rows.map((row) => ({
          week: row.week,
          value: row.modelDisagreement,
        }));
        const bodyFatRows = rows.map((row) => ({
          week: row.week,
          value: row.estimatedBodyFat,
          low: row.bodyFatLow,
          high: row.bodyFatHigh,
          title: `${row.provenance} | body fat ${formatNumber(row.estimatedBodyFat, 1)}% (${formatNumber(row.bodyFatLow, 1)}-${formatNumber(row.bodyFatHigh, 1)}%)`,
        }));
        const ensembleBodyFatRows = rows.map((row) => ({
          week: row.week,
          value: row.ensembleBodyFat,
          low: row.ensembleBodyFatLow,
          high: row.ensembleBodyFatHigh,
          title: `${row.provenance} | ensemble body fat ${formatNumber(row.ensembleBodyFat, 1)}% (${formatNumber(row.ensembleBodyFatLow, 1)}-${formatNumber(row.ensembleBodyFatHigh, 1)}%); votes ${row.bodyFatVotes?.map((vote) => `${vote.label} ${formatNumber(vote.value, 1)}% @ ${formatNumber((vote.normalisedWeight || 0) * 100, 0)}%`).join(", ")}`,
        }));
        const fatFreeRows = rows.map((row) => ({
          week: row.week,
          value: row.fatFreeMass,
          low: row.fatFreeMassLow,
          high: row.fatFreeMassHigh,

        }));
        const almiRows = rows
          .filter((row) => Number.isFinite(row.almi))
          .map((row) => ({
            week: row.week,

          ${confidenceLineChart("Adjusted FFMI vs athlete reference", ffmiRows, { weeks: domainWeeks, color: "#72c69a", referenceBands: ffmiBands, note: referenceNote })}

          ${confidenceLineChart("Model disagreement from selected athlete reference", distanceRows, { weeks: domainWeeks, color: "#b899ff", zeroBase: true, referenceBands: distanceBands, note: "Distance is the average absolute z-score across available body fat, FFMI, and ALMI-style estimates. Lower means the NHANES estimate sits closer to the selected ATHLAS athlete profile." })}

      function renderGrowthForecast(summary) {
        const composition = bodyCompositionSeries(summary);
        const model = growthForecastModel(summary, composition);
        const modelRows = Object.values(composition.models).filter(Boolean);

        if (!modelRows.length) {
          return `
            <section class="panel">
              <h2>Growth forecast</h2>
              <p class="muted">No NHANES body-composition models are loaded yet. Load the Body composition reference models first.</p>
            </section>
          `;
        }

        if (!model) {
          return `
            <section class="panel">
              <h2>Growth forecast</h2>
              <p class="muted">Waiting for bodyweight plus waist/hip/arm measurements before estimating FFMI trajectory.</p>
            </section>
          `;
        }

        const { profile, rows, latest } = model;
        const historicalWeeks = chartWeeksFor(summary, rows);
        const forecastEnd = weekStart(addMonthsIsoDay(latest.week, 60));
        const forecastWeeks = allWeeksBetween(latest.week, forecastEnd);
        const heightSquared = (profile.heightCm / 100) ** 2;
        const expectedFfm = model.expectedEndpointFfmi * heightSquared;
        const expectedFfmLow = model.expectedEndpointLow * heightSquared;
        const expectedFfmHigh = model.expectedEndpointHigh * heightSquared;
        const improvedPotentialFfm = model.improvedTrainingPotentialFfmi * heightSquared;
        const improvedPotentialFfmLow = model.improvedTrainingPotentialLow * heightSquared;
        const improvedPotentialFfmHigh = model.improvedTrainingPotentialHigh * heightSquared;
        const outlierUpperFfm = model.statisticalOutlierUpperBound * heightSquared;
        const policyLabel = growthModelSourcePolicyLabels[profile.growthModelSourcePolicy] || profile.growthModelSourcePolicy;
        const morphologyLabel = morphologyAdjustmentStrengthOptions[profile.morphologyAdjustmentStrength]?.label || "Moderate";
        const observedSeries = [
          { label: "NHANES FFMI", rows: rows.map((row) => ({ week: row.week, value: row.ffmi })) },
          { label: "Ensemble-adjusted FFMI", rows: rows.map((row) => ({ week: row.week, value: row.ensembleFfmi })) },
          { label: "Trained-lifter adjusted FFMI", rows: rows.map((row) => ({ week: row.week, value: row.trainedFfmi })) },
        ];
        const firstTrainedFfmi = rows.find((row) => Number.isFinite(row.trainedFfmi))?.trainedFfmi || 1;
        const firstStrengthValue = model.strengthSeries.find((row) => Number.isFinite(row.value) && row.value > 0)?.value || 1;
        const strengthValueAtOrBefore = (week) => {
          const available = model.strengthSeries
            .filter((row) => row.week <= week && Number.isFinite(row.value))
            .sort((a, b) => a.week.localeCompare(b.week));
          return available.at(-1)?.value ?? null;
        };
        const ffmiIndexRows = rows.map((row) => ({
          week: row.week,
          value: (row.trainedFfmi / firstTrainedFfmi) * 100,
          title: `${formatWeekRange(row.week)}: adjusted FFMI index ${formatNumber((row.trainedFfmi / firstTrainedFfmi) * 100, 1)}; FFMI ${formatNumber(row.trainedFfmi, 2)}`,
        }));
        const strengthIndexRows = model.strengthSeries
          .filter((row) => Number.isFinite(row.value) && row.value > 0)
          .map((row) => ({
            week: row.week,
            value: (row.value / firstStrengthValue) * 100,
            title: `${formatWeekRange(row.week)}: overall strength index ${formatNumber((row.value / firstStrengthValue) * 100, 1)}; composite ${formatNumber(row.value, 3)}`,
          }));
        const strengthDisagreementRows = rows
          .map((row) => {
            const strengthValue = strengthValueAtOrBefore(row.week);
            if (!Number.isFinite(strengthValue) || strengthValue <= 0) return null;
            const ffmiIndex = (row.trainedFfmi / firstTrainedFfmi) * 100;
            const strengthIndex = (strengthValue / firstStrengthValue) * 100;
            return {
              week: row.week,
              value: strengthIndex - ffmiIndex,
              title: `${formatWeekRange(row.week)}: strength index minus adjusted FFMI index ${formatNumber(strengthIndex - ffmiIndex, 1)} points. Strength ${formatNumber(strengthIndex, 1)}, FFMI ${formatNumber(ffmiIndex, 1)}.`,
            };
          })
          .filter(Boolean);
        const forecastFfmiSeries = model.forecasts.map((forecast) => ({
          label: forecast.label,
          rows: forecast.rows.map((row) => ({ week: row.week, value: row.value })),
        }));
        const forecastFfmSeries = model.forecasts.map((forecast) => ({
          label: forecast.label,
          rows: forecast.rows.map((row) => ({ week: row.week, value: row.fatFreeMass })),
        }));
        const latestEvidenceRows = [
          ["Bodyweight", `${formatNumber(latest.bodyWeight, 1)} kg`],
          ["Waist", `${formatNumber(measurementValue(latest, "waist"), 1)} cm`],
          ["Hip", `${formatNumber(measurementValue(latest, "hip"), 1)} cm`],

      function renderTrainingVolume(summary) {
        const currentWeekRatio = summary.currentTrainingDayRatio || weekProgressRatio();
        const projectedByWeek = new Map((summary.projectedWeeklyTotals || []).map((row) => [row.week, row]));
        const volumeRows = (summary.weeklyTotals || []).map((row) => ({
          week: row.week,
          value:
            row.week === summary.currentWeek
              ? row.adjustedVolume + (projectedByWeek.get(row.week)?.adjustedVolume || 0)
              : row.adjustedVolume,
        }));
        const rawVolumeRows = (summary.weeklyTotals || []).map((row) => ({
          week: row.week,
          value: row.week === summary.currentWeek ? row.volume + (projectedByWeek.get(row.week)?.volume || 0) : row.volume,
        }));
        const paceVolumeRows = (summary.weeklyTotals || []).map((row) => ({
          week: row.week,
          value:
            row.week === summary.currentWeek
              ? (row.adjustedVolume + (projectedByWeek.get(row.week)?.adjustedVolume || 0)) / currentWeekRatio
              : row.adjustedVolume,
        }));
        const setRows = (summary.weeklyTotals || []).map((row) => ({
          week: row.week,
          value: row.week === summary.currentWeek ? row.sets + (projectedByWeek.get(row.week)?.sets || 0) : row.sets,
        }));
        const paceSetRows = (summary.weeklyTotals || []).map((row) => ({
          week: row.week,
          value:
            row.week === summary.currentWeek
              ? (row.sets + (projectedByWeek.get(row.week)?.sets || 0)) / currentWeekRatio
              : row.sets,
        }));
        const domainWeeks = chartWeeksFor(summary, setRows);
        const visibleWeeks = new Set(domainWeeks);
        const visibleTotals = (summary.weeklyTotals || []).filter((row) => visibleWeeks.has(row.week));
        const currentWeekTotals = visibleTotals.find((row) => row.week === summary.currentWeek);
        const currentHardCopyProjection = currentWeekTotals
          ? {
              sets: currentWeekTotals.sets + (projectedByWeek.get(summary.currentWeek)?.sets || 0),
              volume: currentWeekTotals.volume + (projectedByWeek.get(summary.currentWeek)?.volume || 0),
              adjustedVolume: currentWeekTotals.adjustedVolume + (projectedByWeek.get(summary.currentWeek)?.adjustedVolume || 0),
              projectedSets: projectedByWeek.get(summary.currentWeek)?.sets || 0,
            }
          : null;
        const currentProjection = currentWeekTotals
          ? {
              adjustedVolume: (currentWeekTotals.adjustedVolume + (projectedByWeek.get(summary.currentWeek)?.adjustedVolume || 0)) / currentWeekRatio,
              volume: (currentWeekTotals.volume + (projectedByWeek.get(summary.currentWeek)?.volume || 0)) / currentWeekRatio,
              ratio: currentWeekRatio,
            }
          : null;
        const completeTotals = visibleTotals.filter((row) => row.week !== summary.currentWeek);
        const latestWeek = completeTotals.at(-1);
        const bySets = [...completeTotals].sort((a, b) => b.sets - a.sets);
        const byVolume = [...completeTotals].sort((a, b) => b.adjustedVolume - a.adjustedVolume);
        const byRawVolume = [...completeTotals].sort((a, b) => b.volume - a.volume);
        const median = (values) => {
          const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
          if (!sorted.length) return null;
          const middle = Math.floor(sorted.length / 2);
          return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
        };
        const latestSetRank = latestWeek ? bySets.findIndex((row) => row.week === latestWeek.week) + 1 : null;
        const latestVolumeRank = latestWeek ? byVolume.findIndex((row) => row.week === latestWeek.week) + 1 : null;
        const medianSets = median(completeTotals.map((row) => row.sets));
        const medianVolume = median(completeTotals.map((row) => row.adjustedVolume));
        const medianRawVolume = median(completeTotals.map((row) => row.volume));
        const currentComparableSets = currentHardCopyProjection?.sets || currentWeekTotals?.sets || 0;
        const currentFinishProjectedSets = currentWeekFinishProjection(summary, currentComparableSets);
        const totalHardSets = (summary.weeklyTotals || []).reduce((sum, row) => sum + number(row.sets), 0);
        const muscleVolumeForWeek = (week) =>
          (summary.muscleWeeklyVolume || [])
            .filter((row) => row.week === week)
            .sort((a, b) => b.value - a.value)
            .map((row) => [row.muscle, row.value]);
        const majorMuscleVolumeForWeek = (week) =>
          (summary.majorMuscleWeeklyVolume || [])
            .filter((row) => row.week === week)
            .sort((a, b) => b.value - a.value)
            .map((row) => [row.muscle, row.value]);
        const currentWeekMajorMuscles = majorMuscleVolumeForWeek(summary.currentWeek);
        const latestCompleteWeekMajorMuscles = latestWeek ? majorMuscleVolumeForWeek(latestWeek.week) : [];
        const currentWeekMuscles = muscleVolumeForWeek(summary.currentWeek);
        const latestCompleteWeekMuscles = latestWeek ? muscleVolumeForWeek(latestWeek.week) : [];
        const majorMuscleTrendNames = [
          ...new Set([
            ...currentWeekMajorMuscles.slice(0, 6).map(([muscle]) => muscle),
            ...latestCompleteWeekMajorMuscles.slice(0, 6).map(([muscle]) => muscle),
            ...(summary.majorMuscleVolume || []).slice(0, 8).map(([muscle]) => muscle),
          ]),
        ].slice(0, 8);
        const majorMuscleTrendPanels = majorMuscleTrendNames
          .map((muscle) => {
            const rows = (summary.majorMuscleWeeklyVolume || [])
              .filter((row) => row.muscle === muscle)
              .map((row) => ({ week: row.week, value: row.value }));
            return lineChart(`${muscle} major-group kg-volume`, rows, { zeroBase: true, color: "#72c69a", weeks: domainWeeks });
          })
          .join("");
        const muscleTrendNames = [
          ...new Set([
            ...currentWeekMuscles.slice(0, 6).map(([muscle]) => muscle),
            ...latestCompleteWeekMuscles.slice(0, 6).map(([muscle]) => muscle),
            ...(summary.muscleVolume || []).slice(0, 8).map(([muscle]) => muscle),
          ]),
        ].slice(0, 8);
        const muscleTrendPanels = muscleTrendNames
          .map((muscle) => {
            const rows = (summary.muscleWeeklyVolume || [])
              .filter((row) => row.muscle === muscle)
              .map((row) => ({ week: row.week, value: row.value }));
            return lineChart(`${muscle} weekly muscle kg-volume`, rows, { zeroBase: true, color: "#72c69a", weeks: domainWeeks });
          })
          .join("");

        return `
          <section class="grid metrics">
            <div class="metric-card"><span class="muted">Total hard sets</span><span class="metric-value">${formatNumber(totalHardSets, 0)}</span><span class="muted">includes reported-only plan sets</span></div>
            <div class="metric-card"><span class="muted">Adjusted kg load</span><span class="metric-value">${formatNumber(summary.totalAdjustedVolume)}</span></div>
