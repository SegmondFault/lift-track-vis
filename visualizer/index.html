          if (!session.week) continue;
          const weekly = weeklyTotals.get(session.week) || { week: session.week, sets: 0, volume: 0, adjustedVolume: 0, e1rmAttempts: 0 };
          const setCountDeficit = Math.max(0, number(session.completedSets) - number(session.observedWeightedSets));
          weekly.sets += setCountDeficit;
          weekly.sessions = (weekly.sessions || 0) + 1;
          weeklyTotals.set(session.week, weekly);
        }

        const currentWeek = weekStart(new Date().toISOString());
        const projectedWeeklyTotals = new Map();
        for (const set of projectedSets) {
          const week = weekStart(set.logged_at);
          if (!week) continue;
          const weekly = projectedWeeklyTotals.get(week) || { week, sets: 0, volume: 0, adjustedVolume: 0 };
          weekly.sets += 1;
          weekly.volume += rawSetVolume(set);
          weekly.adjustedVolume += adjustedSetVolume(set);
          projectedWeeklyTotals.set(week, weekly);
        }

        const currentWeekStats = weeklyTotals.get(currentWeek) || { week: currentWeek, sets: 0, volume: 0, adjustedVolume: 0, sessions: 0, e1rmAttempts: 0 };
        const currentProjectedStats = projectedWeeklyTotals.get(currentWeek) || { week: currentWeek, sets: 0, volume: 0, adjustedVolume: 0 };
        const planProgress = buildPlanProgress(tables, sets, projectedSets);
        const sessionsById = new Map(sessions.map((session) => [session.id, session]));
        const currentActualPlanDays = new Set(
          sets
            .filter((set) => weekStart(set.logged_at) === currentWeek)
            .map((set) => sessionsById.get(set.workout_session_id)?.day_index)
            .filter((dayIndex) => dayIndex !== null && dayIndex !== undefined)
            .map(Number),
        );
        const hasCurrentUnassignedSets = sets.some((set) => {
          if (weekStart(set.logged_at) !== currentWeek) return false;
          const dayIndex = sessionsById.get(set.workout_session_id)?.day_index;
          return dayIndex === null || dayIndex === undefined;
        });
        const currentProjectedPlanDays = new Set(
          projectedSets
            .filter((set) => weekStart(set.logged_at) === currentWeek && set.day_index !== null && set.day_index !== undefined)
            .map((set) => Number(set.day_index)),
        );
        const unassignedActualDayCount = hasCurrentUnassignedSets ? 1 : 0;
        const representedTrainingDays = Math.min(
          planProgress?.totalDays || 1,
          unassignedActualDayCount +
            currentActualPlanDays.size +
            [...currentProjectedPlanDays].filter((dayIndex) => !currentActualPlanDays.has(dayIndex)).length,
        );
        const currentTrainingDayRatio = Math.min(
          1,
          Math.max(1 / Math.max(1, planProgress?.totalDays || representedTrainingDays || 1), representedTrainingDays / Math.max(1, planProgress?.totalDays || representedTrainingDays || 1)),
        );
        const allObservedWeeks = [...new Set([
          ...weeklyTotals.keys(),
          ...projectedWeeklyTotals.keys(),
          ...(tables.body_metric_entry || []).map((entry) => weekStart(entry.measured_at)).filter(Boolean),
        ])].sort();

        return {
          exportedAt: imported.exportedAt || imported.generatedAt || "unknown",
          setCount: sets.length,
          sessionRows,
          weeklyPlanRows: buildWeeklyPlanRows(tables, sets, projectedSets),
          planProgress,
          currentWeek,
          currentWeekStats,
          currentProjectedStats,
          representedTrainingDays,
          currentTrainingDayRatio,
          weeklyTotals: [...weeklyTotals.values()].sort((a, b) => a.week.localeCompare(b.week)),
          projectedWeeklyTotals: [...projectedWeeklyTotals.values()].sort((a, b) => a.week.localeCompare(b.week)),
          allObservedWeeks,
          totalVolume: sets.reduce((sum, set) => sum + rawSetVolume(set), 0),
          totalAdjustedVolume: sets.reduce((sum, set) => sum + adjustedSetVolume(set), 0),
          exerciseBest: [...exerciseBest.values()].sort((a, b) => b.e1rm - a.e1rm),
          exerciseWeeklyBest: [...exerciseWeeklyBest.values()].sort((a, b) => a.week.localeCompare(b.week)),
          exerciseWeeklyTotals: [...exerciseWeeklyTotals.values()].sort((a, b) => a.week.localeCompare(b.week)),
          muscleVolume: [...muscleVolume.entries()].sort((a, b) => b[1] - a[1]),
          majorMuscleVolume: [...majorMuscleVolume.entries()].sort((a, b) => b[1] - a[1]),
          muscleVolumeProvenance: [...muscleVolumeProvenance.values()].sort((a, b) => b.allocatedKgLoad - a.allocatedKgLoad),
          muscleVolumeCoverage: {
            weightedContributionSetCount,
            missingContributionSetCount,
            countOnlySetCount,
          },
          muscleWeeklyVolume: [...muscleWeeklyVolume.entries()]
            .map(([key, value]) => {
              const [week, muscle] = key.split(":");
              return { week, muscle, value };
            })
            .sort((a, b) => a.week.localeCompare(b.week)),
          majorMuscleWeeklyVolume: [...majorMuscleWeeklyVolume.entries()]
            .map(([key, value]) => {
              const [week, muscle] = key.split(":");
              return { week, muscle, value };
            })
            .sort((a, b) => a.week.localeCompare(b.week)),
          muscleWeeklyEffectiveSets: [...muscleWeeklyEffectiveSets.entries()]
            .map(([key, value]) => {
              const [week, muscle] = key.split(":");
              return { week, muscle, value };
            })
            .sort((a, b) => a.week.localeCompare(b.week)),
          majorMuscleWeeklyEffectiveSets: [...majorMuscleWeeklyEffectiveSets.entries()]
            .map(([key, value]) => {
              const [week, muscle] = key.split(":");
              return { week, muscle, value };
            })
            .sort((a, b) => a.week.localeCompare(b.week)),
          muscleWeeklyStrength: [...muscleWeeklyStrength.values()].sort((a, b) => a.week.localeCompare(b.week)),
          contributionDetails,
          splitVolume: [...splitVolume.entries()].filter(([, value]) => value > 0),
          equipmentVolume: [...equipmentVolume.entries()].sort((a, b) => b[1] - a[1]),
          norms,
          normSex,
          currentBodyWeight,
          applicableNorms: norms.filter((norm) => (!norm.sex || norm.sex === normSex) && normMatchesBodyweight(norm, currentBodyWeight)),
          hasBodyweight: validBodyMetricRows(tables).length > 0,
          bodyWeights: validBodyMetricRows(tables)
            .map((entry) => ({
              measuredAt: entry.measured_at,
              bodyWeight: number(entry.body_weight),
              source: entry.source || "",
            }))
            .sort((a, b) => Date.parse(a.measuredAt) - Date.parse(b.measuredAt)),
          tables,
          tableCounts: tableCounts(tables),
          importCount: (imported.imports || loadImportHistory()).length,
        };
      }

      function bars(title, rows) {
        const max = Math.max(...rows.map((row) => row[1]), 1);
        return `
          <section class="panel">
            <h2>${title}</h2>
            <div class="bar-list">
              ${rows
                .slice(0, 10)
                .map(
                  ([label, value]) => `
                    <div class="bar-row">
                      <div class="bar-label"><span>${label}</span><strong>${formatNumber(value, 1)}</strong></div>
                      <div class="bar-track"><div class="bar-fill" style="width: ${(value / max) * 100}%"></div></div>
                    </div>
                  `,
                )
                .join("")}
            </div>
          </section>
        `;
      }

      function majorMuscleGroupId(muscle) {
        const groups = {
          chest: "pecs",
          "upper-chest": "pecs",
          lats: "back",
          "upper-back": "back",
          "spinal-erectors": "back",
          "front-delts": "shoulders",
          "side-delts": "shoulders",
          "rear-delts": "shoulders",
          biceps: "arms",
          brachialis: "arms",
          triceps: "arms",
          quads: "legs",
          hamstrings: "legs",
          calves: "legs",
          glutes: "glutes",
          core: "core",
        };
        return groups[muscle] || muscle;
      }

      function chartDateTicks(weeks, maxTicks = 5) {
        if (!weeks.length) return [];
        if (weeks.length <= maxTicks) return weeks;
        const lastIndex = weeks.length - 1;
        return Array.from({ length: maxTicks }, (_, index) => weeks[Math.round((index / (maxTicks - 1)) * lastIndex)]);
      }

      function chartValueTicks(lower, upper, count = 4) {
        if (!Number.isFinite(lower) || !Number.isFinite(upper)) return [];
        if (count <= 1 || lower === upper) return [lower];
        return Array.from({ length: count }, (_, index) => lower + ((upper - lower) * index) / (count - 1));
      }

      function renderXAxisTicks(weeks, xByWeek, height, pad) {
        return chartDateTicks(weeks)
          .map((week, index, ticks) => {
            const x = xByWeek.get(week);
            if (!Number.isFinite(x)) return "";
            const anchor = index === 0 ? "start" : index === ticks.length - 1 ? "end" : "middle";
            return `
              <line x1="${x.toFixed(1)}" y1="${height - pad}" x2="${x.toFixed(1)}" y2="${height - pad + 4}" stroke="#58665c" />
              <text x="${x.toFixed(1)}" y="${height - 6}" fill="#a9b6aa" text-anchor="${anchor}" font-size="11">${formatDate(week)}</text>
            `;
          })
          .join("");
      }

      function renderYAxisTicks(ticks, yFor, width, pad, suffix = "") {
        return ticks
          .map((tick) => {
            const y = yFor(tick);
            if (!Number.isFinite(y)) return "";
            return `
              <line x1="${pad}" y1="${y.toFixed(1)}" x2="${width - pad}" y2="${y.toFixed(1)}" stroke="#263229" stroke-dasharray="3 6" />
              <text x="${pad - 6}" y="${(y + 4).toFixed(1)}" fill="#a9b6aa" text-anchor="end" font-size="11">${formatNumber(tick, 1)}${suffix}</text>
            `;
          })
          .join("");
      }

      function weightTrend(rows) {
        if (!rows.length) {
          return `
            <section class="panel" style="margin-top: 18px;">
              <h2>Weekly bodyweight</h2>
              <p class="muted">No bodyweight entries imported yet.</p>
            </section>
          `;
        }

        const width = 720;
        const height = 210;
        const pad = 42;
        const minWeight = Math.min(...rows.map((row) => row.bodyWeight)) - 0.5;
        const maxWeight = Math.max(...rows.map((row) => row.bodyWeight)) + 0.5;
        const weeklyRows = rows.map((row) => ({ ...row, week: weekStart(row.measuredAt) })).filter((row) => row.week);
        const weeks = weekRange(weeklyRows);
        const xByWeek = new Map(
          weeks.map((week, index) => [
            week,
            weeks.length === 1 ? width / 2 : pad + (index / (weeks.length - 1)) * (width - pad * 2),
          ]),
        );
        const yFor = (value) => height - pad - ((value - minWeight) / (maxWeight - minWeight || 1)) * (height - pad * 2);
        const points = rows.map((row, index) => {
          const week = weekStart(row.measuredAt);
          const x = xByWeek.get(week) ?? (rows.length === 1 ? width / 2 : pad + (index / (rows.length - 1)) * (width - pad * 2));
          const y = yFor(row.bodyWeight);
          return { ...row, week, x, y };
        });
        const path = points.map((point, index) => `${index === 0 ? "M" : "L"} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`).join(" ");
        const latest = rows[rows.length - 1];
        const missingCount = weeks.length - new Set(points.map((point) => point.week).filter(Boolean)).size;
        const yTicks = chartValueTicks(minWeight, maxWeight, 5);

        return `
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Weekly bodyweight</h2>
              <strong>${formatNumber(latest.bodyWeight, 1)} kg latest</strong>
            </div>
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Weekly bodyweight trend" style="width: 100%; height: auto; margin-top: 12px;">
              <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${height - pad}" stroke="#3a463d" />
              <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="#3a463d" />
              ${renderYAxisTicks(yTicks, yFor, width, pad, "kg")}
              <path d="${path}" fill="none" stroke="#7fa8ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
              ${points
                .map(
                  (point) =>
                    `<circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="5" fill="#172019" stroke="#7fa8ef" stroke-width="3" style="cursor: help;"><title>${formatDate(point.measuredAt)}: ${formatNumber(point.bodyWeight, 1)}kg${point.source ? ` (${point.source})` : ""}</title></circle>`,
                )
                .join("")}
              ${renderXAxisTicks(weeks, xByWeek, height, pad)}
            </svg>
            <p class="muted">${rows.length} bodyweight entries. Weeks are ${weekStartLabel()}${missingCount ? `; ${missingCount} missing week${missingCount === 1 ? "" : "s"} interpolated visually, not counted as zero.` : "."}</p>
          </section>
        `;
      }

      function lineChart(title, rows, options = {}) {
        const rawRows = rows.filter((row) => row.week && Number.isFinite(row.value)).sort((a, b) => a.week.localeCompare(b.week));
        const weeks = options.weeks?.length ? options.weeks : weekRange(rawRows);
        const firstWeek = weeks[0];
        const lastWeek = weeks.at(-1);
        const actualRows = rawRows.filter((row) => !firstWeek || (row.week >= firstWeek && row.week <= lastWeek));
        if (actualRows.length === 0) {
          return `
            <section class="panel" style="margin-top: 18px;">
              <h2>${title}</h2>
              <p class="muted">No dated data in the selected period.</p>
            </section>
          `;
        }

        const width = 720;
        const height = 210;
        const pad = 28;
        const xByWeek = new Map(
          weeks.map((week, index) => [
            week,
            weeks.length === 1 ? width / 2 : pad + (index / (weeks.length - 1)) * (width - pad * 2),
          ]),
        );
        const minValue = Math.min(...actualRows.map((row) => row.value));
        const maxValue = Math.max(...actualRows.map((row) => row.value));
        const lower = options.zeroBase ? 0 : minValue - (maxValue - minValue || 1) * 0.08;
        const upper = maxValue + (maxValue - minValue || 1) * 0.08;
        const yFor = (value) => height - pad - ((value - lower) / (upper - lower || 1)) * (height - pad * 2);
        const points = actualRows.map((row) => ({ ...row, x: xByWeek.get(row.week), y: yFor(row.value) }));
        const yTicks = chartValueTicks(lower, upper, 4);
        const pathSegments = [];
        const gapSegments = [];
        let segment = [];
        for (const point of points) {
          const previous = segment.at(-1);
          const gapWeeks = previous ? weeks.indexOf(point.week) - weeks.indexOf(previous.week) : 0;
          if (previous && gapWeeks > (options.maxConnectedGapWeeks ?? 2)) {
            gapSegments.push([previous, point]);
            pathSegments.push(segment);
            segment = [];
          }
          segment.push(point);
        }
        if (segment.length) pathSegments.push(segment);
        const paths = pathSegments
          .map((pathPoints) =>
            pathPoints.map((point, index) => `${index === 0 ? "M" : "L"} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`).join(" "),
          )
          .join("|");
        const missingCount = weeks.length - new Set(actualRows.map((row) => row.week)).size;

        return `
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>${title}</h2>
              <span class="muted">${formatPeriodRange(firstWeek, lastWeek)}</span>
            </div>
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${title}" style="width: 100%; height: auto; margin-top: 12px;">
              <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${height - pad}" stroke="#3a463d" />
              <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="#3a463d" />
              ${renderYAxisTicks(yTicks, yFor, width, pad)}
              ${paths
                .split("|")
                .filter(Boolean)
                .map(
                  (path) =>
                    `<path d="${path}" fill="none" stroke="${options.color || "#7fa8ef"}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />`,
                )
                .join("")}
              ${gapSegments
                .map(
                  ([from, to]) =>
                    `<line x1="${from.x.toFixed(1)}" y1="${from.y.toFixed(1)}" x2="${to.x.toFixed(1)}" y2="${to.y.toFixed(1)}" stroke="${options.color || "#7fa8ef"}" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round" opacity="0.6"><title>No observed data between ${formatWeekRange(from.week)} and ${formatWeekRange(to.week)}</title></line>`,
                )
                .join("")}
              ${points
                .map(
                  (point) =>
                    `<circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="4.8" fill="#172019" stroke="${options.color || "#7fa8ef"}" stroke-width="3" style="cursor: help;"><title>${formatWeekRange(point.week)}: ${formatNumber(point.value, 1)}</title></circle>`,
                )
                .join("")}
              ${renderXAxisTicks(weeks, xByWeek, height, pad)}
            </svg>
            <p class="muted">${actualRows.length} observed weeks in this period${missingCount ? `; ${missingCount} missing week${missingCount === 1 ? "" : "s"} shown as gaps, not counted as zero.` : "."} Weeks are ${weekStartLabel()}.</p>
          </section>
        `;
      }

      function confidenceLineChart(title, rows, options = {}) {
        const rawRows = rows
          .filter((row) => row.week && Number.isFinite(row.value) && Number.isFinite(row.low) && Number.isFinite(row.high))
          .sort((a, b) => a.week.localeCompare(b.week));
        const referenceBands = (options.referenceBands || []).filter(
          (band) => Number.isFinite(band.low) && Number.isFinite(band.high) && Number.isFinite(band.value),
        );
        const weeks = options.weeks?.length ? options.weeks : weekRange(rawRows);
        const firstWeek = weeks[0];
        const lastWeek = weeks.at(-1);
        const actualRows = rawRows.filter((row) => !firstWeek || (row.week >= firstWeek && row.week <= lastWeek));
        if (!actualRows.length) {
          return `
            <section class="panel" style="margin-top: 18px;">
              <h2>${title}</h2>
              <p class="muted">No dated body-composition estimates in the selected period.</p>
            </section>
          `;
        }

        const width = 720;
        const height = 230;
        const pad = 32;
        const xByWeek = new Map(
          weeks.map((week, index) => [
            week,
            weeks.length === 1 ? width / 2 : pad + (index / (weeks.length - 1)) * (width - pad * 2),
          ]),
        );
        const values = [
          ...actualRows.flatMap((row) => [row.low, row.value, row.high]),
          ...referenceBands.flatMap((band) => [band.low, band.value, band.high]),
        ];
        const minValue = Math.min(...values);
        const maxValue = Math.max(...values);
        const lower = options.zeroBase ? 0 : minValue - (maxValue - minValue || 1) * 0.1;
        const upper = maxValue + (maxValue - minValue || 1) * 0.1;
        const yFor = (value) => height - pad - ((value - lower) / (upper - lower || 1)) * (height - pad * 2);
        const yTicks = chartValueTicks(lower, upper, 4);
        const points = actualRows.map((row) => ({
          ...row,
          x: xByWeek.get(row.week),
          y: yFor(row.value),
          yLow: yFor(row.low),
          yHigh: yFor(row.high),
        }));
        const segments = [];
        const gapSegments = [];
        let segment = [];
        for (const point of points) {
          const previous = segment.at(-1);
          const gapWeeks = previous ? weeks.indexOf(point.week) - weeks.indexOf(previous.week) : 0;
          if (previous && gapWeeks > (options.maxConnectedGapWeeks ?? 2)) {
            gapSegments.push([previous, point]);
            segments.push(segment);
            segment = [];
          }
          segment.push(point);
        }
        if (segment.length) segments.push(segment);
        const color = options.color || "#72c69a";
        const suffix = options.suffix || "";
        const missingCount = weeks.length - new Set(actualRows.map((row) => row.week)).size;
        const note =
          options.note ||
          `${actualRows.length} estimated weeks in this period${missingCount ? `; ${missingCount} missing week${missingCount === 1 ? "" : "s"} shown as gaps, not counted as zero.` : "."} Bands combine model prediction error with stale/interpolated measurement penalties.`;

        return `
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>${title}</h2>
              <span class="muted">${formatPeriodRange(firstWeek, lastWeek)}</span>
            </div>
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${title}" style="width: 100%; height: auto; margin-top: 12px;">
              <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${height - pad}" stroke="#3a463d" />
              <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="#3a463d" />
              ${renderYAxisTicks(yTicks, yFor, width, pad, suffix)}
              ${referenceBands
                .map((band) => {
                  const yHigh = yFor(Math.max(band.low, band.high));
                  const yLow = yFor(Math.min(band.low, band.high));
                  const yMid = yFor(band.value);
                  return `
                    <rect x="${pad}" y="${yHigh.toFixed(1)}" width="${width - pad * 2}" height="${Math.max(1, yLow - yHigh).toFixed(1)}" fill="${band.color || "#72c69a"}" opacity="${band.opacity ?? 0.14}">
                      <title>${escapeHtml(band.title || `${band.label}: ${formatNumber(band.low, 1)}-${formatNumber(band.high, 1)}${suffix}`)}</title>
                    </rect>
                    <line x1="${pad}" y1="${yMid.toFixed(1)}" x2="${width - pad}" y2="${yMid.toFixed(1)}" stroke="${band.color || "#72c69a"}" stroke-width="${band.selected ? 2 : 1}" stroke-dasharray="${band.selected ? "none" : "4 6"}" opacity="${band.selected ? 0.62 : 0.34}" />
                    <text x="${width - pad - 4}" y="${(yMid - 4).toFixed(1)}" fill="${band.color || "#72c69a"}" text-anchor="end" font-size="10" opacity="${band.selected ? 0.9 : 0.55}">${escapeHtml(band.label || "")}</text>
                  `;
                })
                .join("")}
              ${segments
                .map((pathPoints) => {
                  const top = pathPoints.map((point, index) => `${index === 0 ? "M" : "L"} ${point.x.toFixed(1)} ${point.yHigh.toFixed(1)}`).join(" ");
                  const bottom = pathPoints
                    .slice()
                    .reverse()
                    .map((point) => `L ${point.x.toFixed(1)} ${point.yLow.toFixed(1)}`)
                    .join(" ");
                  return `<path d="${top} ${bottom} Z" fill="${color}" opacity="0.16" />`;
                })
                .join("")}
              ${segments
                .map((pathPoints) =>
                  `<path d="${pathPoints
                    .map((point, index) => `${index === 0 ? "M" : "L"} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`)
                    .join(" ")}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />`,
                )
                .join("")}
              ${gapSegments
                .map(
                  ([from, to]) =>
                    `<line x1="${from.x.toFixed(1)}" y1="${from.y.toFixed(1)}" x2="${to.x.toFixed(1)}" y2="${to.y.toFixed(1)}" stroke="${color}" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round" opacity="0.6"><title>No observed bodyweight/measurement row between ${formatWeekRange(from.week)} and ${formatWeekRange(to.week)}</title></line>`,
                )
                .join("")}
              ${points
                .map(
                  (point) =>
                    `<circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="5" fill="#172019" stroke="${color}" stroke-width="3" style="cursor: help;"><title>${escapeHtml(point.title || `${formatWeekRange(point.week)}: ${formatNumber(point.value, 1)}${suffix}`)}</title></circle>`,
                )
                .join("")}
              ${renderXAxisTicks(weeks, xByWeek, height, pad)}
            </svg>
            <p class="muted">${note}</p>
          </section>
        `;
      }

      function multiLineChart(title, series, options = {}) {
        const rows = series.flatMap((item) => item.rows.map((row) => ({ ...row, label: item.label })));
        const weeks = options.weeks?.length ? options.weeks : weekRange(rows);
        const firstWeek = weeks[0];
        const lastWeek = weeks.at(-1);
        const actualSeries = series
          .map((item) => ({
            ...item,
            rows: item.rows
              .filter((row) => row.week && Number.isFinite(row.value) && (!firstWeek || (row.week >= firstWeek && row.week <= lastWeek)))
              .sort((a, b) => a.week.localeCompare(b.week)),
          }))
          .filter((item) => item.rows.length);

        if (!actualSeries.length) {
          return `
            <section class="panel" style="margin-top: 18px;">
              <h2>${title}</h2>
              <p class="muted">No dated data in the selected period.</p>
            </section>
          `;
        }

        const width = 720;
        const height = 240;
        const pad = 30;
        const xByWeek = new Map(
          weeks.map((week, index) => [
            week,
            weeks.length === 1 ? width / 2 : pad + (index / (weeks.length - 1)) * (width - pad * 2),
          ]),
        );
        const referenceLines = (options.referenceLines || []).filter((line) => Number.isFinite(Number(line.value)));
        const values = actualSeries
          .flatMap((item) => item.rows.map((row) => row.value))
          .concat(referenceLines.map((line) => Number(line.value)));
        const minValue = Math.min(...values);
        const maxValue = Math.max(...values);
        const yPadding = Math.max((maxValue - minValue || 1) * 0.18, options.minYPadding ?? 1.5);
        let lower = options.tightY ? minValue - yPadding : 0;
        let upper = options.tightY ? maxValue + yPadding : Math.max(110, maxValue * 1.08);
        if (options.clampLowerToZero !== false) lower = Math.max(0, lower);
        const minYSpan = options.minYSpan ?? 8;
        if (upper - lower < minYSpan) {
          const midpoint = (upper + lower) / 2;
          lower = midpoint - minYSpan / 2;
          upper = midpoint + minYSpan / 2;
          if (options.clampLowerToZero !== false && lower < 0) {
            upper += Math.abs(lower);
            lower = 0;
          }
        }
        const yFor = (value) => height - pad - ((value - lower) / (upper - lower || 1)) * (height - pad * 2);
        const yTicks = chartValueTicks(lower, upper, 4);
        const palette = ["#7fa8ef", "#72c69a", "#e4b464", "#b69cff", "#ef8b7d", "#69c7d0", "#d69c55", "#a4c46f"];
        const renderedReferenceLines = referenceLines
          .map((line, index) => {
            const color = line.color || palette[(actualSeries.length + index) % palette.length];
            const y = yFor(Number(line.value));
            const suffix = line.valueSuffix ?? options.valueSuffix ?? "%";
            const label = `${line.label}: ${formatNumber(Number(line.value), line.precision ?? 2)}${suffix}`;
            return `
              <line x1="${pad}" y1="${y.toFixed(1)}" x2="${width - pad}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="2" stroke-dasharray="5 7" opacity="0.68"><title>${escapeHtml(label)}</title></line>
              <text x="${width - pad - 4}" y="${Math.max(pad + 10, y - 6).toFixed(1)}" text-anchor="end" fill="${color}" font-size="11" font-weight="700">${escapeHtml(line.label)}</text>
            `;
          })
          .join("");

        const renderedSeries = actualSeries
          .map((item, seriesIndex) => {
            const color = palette[seriesIndex % palette.length];
            const points = item.rows.map((row) => ({ ...row, x: xByWeek.get(row.week), y: yFor(row.value) }));
            const solidSegments = [];
            const dashSegments = [];
            let segment = [];
            for (const point of points) {
              const previous = segment.at(-1);
              const gapWeeks = previous ? weeks.indexOf(point.week) - weeks.indexOf(previous.week) : 0;
              if (previous && gapWeeks > (options.maxConnectedGapWeeks ?? 2)) {
                dashSegments.push([previous, point]);
                solidSegments.push(segment);
                segment = [];
              }
              segment.push(point);
            }
            if (segment.length) solidSegments.push(segment);

            return `
              ${solidSegments
                .map((pathPoints) => {
                  const path = pathPoints
                    .map((point, index) => `${index === 0 ? "M" : "L"} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`)
                    .join(" ");
                  return `<path d="${path}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />`;
                })
                .join("")}
              ${dashSegments
                .map(
                  ([from, to]) =>
                    `<line x1="${from.x.toFixed(1)}" y1="${from.y.toFixed(1)}" x2="${to.x.toFixed(1)}" y2="${to.y.toFixed(1)}" stroke="${color}" stroke-width="2.5" stroke-dasharray="7 8" stroke-linecap="round" opacity="0.55" />`,
                )
                .join("")}
              ${points
                .map(
                  (point) =>
                    `<circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="3.8" fill="#172019" stroke="${color}" stroke-width="2.5" style="cursor: help;"><title>${escapeHtml(point.title || `${item.label} ${formatWeekRange(point.week)}: ${formatNumber(point.value, 1)}${options.valueSuffix ?? "%"}`)}</title></circle>`,
                )
                .join("")}
            `;
          })
          .join("");

        return `
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>${title}</h2>
              <div class="toggle-row" style="margin-top: 0;">
                ${options.rangeControls || ""}
                <span class="muted">${formatPeriodRange(firstWeek, lastWeek)}</span>
              </div>
            </div>
            <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${title}" style="width: 100%; height: auto; margin-top: 12px;">
              <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${height - pad}" stroke="#3a463d" />
              <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="#3a463d" />
              ${renderYAxisTicks(yTicks, yFor, width, pad, options.valueSuffix ?? "%")}
              ${renderedReferenceLines}
              ${renderedSeries}
              ${renderXAxisTicks(weeks, xByWeek, height, pad)}
            </svg>
            <div class="pill-row">
              ${actualSeries
                .map((item, index) => `<span class="pill" style="border: 2px solid ${palette[index % palette.length]}; background: #172019;">${item.label}</span>`)
                .join("")}
            </div>
            <p class="muted">${options.note || "Each lift is normalized to its own imported all-time best, so different lifts can be overlaid. Dashed lines mark no-data spans."}</p>
          </section>
        `;
      }

      function trendPanels(summary) {
        const topExercises = [...new Set(summary.exerciseBest.slice(0, 3).map((row) => `${row.exerciseId}:${row.variationId}`))];
        const exercisePanels = topExercises
          .map((key) => {
            const [exerciseId, variationId] = key.split(":");
            const rows = (summary.exerciseWeeklyBest || [])
              .filter((row) => row.exerciseId === exerciseId && row.variationId === variationId)
              .map((row) => ({ week: row.week, value: row.e1rm }));
            return lineChart(`${exerciseName(exerciseId)} e1RM`, rows);
          })
          .join("");

        const topMuscles = summary.muscleVolume.slice(0, 3).map(([muscle]) => muscle);
        const musclePanels = topMuscles
          .map((muscle) => {
            const rows = (summary.muscleWeeklyVolume || [])
              .filter((row) => row.muscle === muscle)
              .map((row) => ({ week: row.week, value: row.value }));
            return lineChart(`${muscle} weekly volume`, rows, { zeroBase: true, color: "#72c69a" });
          })
          .join("");

        return `${exercisePanels}${musclePanels}`;
      }

      function muscleVolumeMethodPanel(summary) {
        const coverage = summary.muscleVolumeCoverage || {};
        const included = formatNumber(coverage.weightedContributionSetCount || 0);
        const missing = formatNumber(coverage.missingContributionSetCount || 0);
        const excluded = formatNumber(coverage.countOnlySetCount || 0);

        return `
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Muscle load provenance</h2>
              <span class="muted">${included} weighted sets included</span>
            </div>
            <p class="muted" style="margin-top: 10px;">
              Allocated muscle kg-volume is calculated as reps x effective kg x muscle coefficient. Dumbbell entries are logged per hand and counted as both hands for analytics. For example, a 6 x 30kg incline dumbbell set uses 60kg effective load before coefficients.
            </p>
            <p class="muted">
              These values use the exercise_muscle_contribution table. They are raw allocated kg-load, not machine-adjusted load, and not a biological truth. They are best read as a consistent scoring model for trends. Count-only sets or sets without reps/weight are excluded from kg-volume charts; ${excluded} such set${coverage.countOnlySetCount === 1 ? "" : "s"} are currently excluded, and ${missing} weighted set${coverage.missingContributionSetCount === 1 ? "" : "s"} have no muscle coefficient.
            </p>
            <p class="muted">
              Parent and child muscles can both receive direct coefficients, so do not sum all muscle rows as total body volume. Compare a muscle with itself through time, or compare muscles while remembering the coefficients are editable assumptions.
            </p>
          </section>
        `;
      }

      function muscleVolumeProvenanceTable(summary) {
        const topMuscles = summary.muscleVolume.slice(0, 6).map(([muscle]) => muscle);
        const rows = topMuscles.flatMap((muscle) =>
          (summary.muscleVolumeProvenance || [])
            .filter((row) => row.muscle === muscle)
            .slice(0, 3),
        );

        if (!rows.length) return "";

        return `
          <section class="panel" style="margin-top: 18px;">
            <h2>Top muscle load sources</h2>
            <div class="table-wrap" style="margin-top: 12px;">
              <table>
                <thead>
                  <tr>
                    <th>Muscle</th>
                    <th>Exercise</th>
                    <th>Coefficient</th>
                    <th>Sets</th>
                    <th>Effective kg-load</th>
                    <th>Allocated kg-volume</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows
                    .map(
                      (row) => `
                        <tr>
                          <td>${row.muscle}</td>
                          <td>${exerciseName(row.exerciseId)}${variationName(row.variationId) && variationName(row.variationId) !== "standard" ? `, ${variationName(row.variationId)}` : ""}</td>
                          <td>${formatNumber(row.coefficient, 2)}</td>
                          <td>${formatNumber(row.sets)}</td>
                          <td>${formatNumber(row.rawKgLoad, 1)}</td>
                          <td>${formatNumber(row.allocatedKgLoad, 1)}</td>
                        </tr>
                      `,
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
            <p class="muted">This table shows the largest exercise sources behind the top muscle totals, so the chart can be audited back to exercises and coefficients.</p>
          </section>
        `;
      }

      function weeklyPlanPanel(summary) {
        const rows = (summary.weeklyPlanRows || []).slice().sort((a, b) => b.week.localeCompare(a.week)).slice(0, 12);

        if (!rows.length) {
          return `
            <section class="panel" style="margin-top: 18px;">
              <h2>Weekly plan adherence</h2>
              <p class="muted">No plan assignment is available in this import.</p>
            </section>
          `;
        }

        return `
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Weekly plan adherence</h2>
              <span class="muted">Weeks are ${weekStartLabel()}</span>
            </div>
            <div class="table-wrap" style="margin-top: 12px;">
              <table>
                <thead><tr><th>Week</th><th>Plan</th><th>Type</th><th>Expected</th><th>Actual</th><th>Status</th></tr></thead>
                <tbody>
                  ${rows
                    .map((row) => {
                      const statusText =
                        row.status === "in_progress"
                          ? "in progress"
                          : row.actualSets === null
                            ? "no observed data"
                            : `${formatNumber(row.completion * 100)}%`;
                      return `
                        <tr>
                          <td>${formatWeekRange(row.week)}</td>
                          <td>${row.planName}</td>
                          <td>${row.weekType || "normal"}</td>
                          <td>${row.plannedSets} sets${row.volumeMultiplier !== 1 ? ` (${formatNumber(row.volumeMultiplier * 100)}% volume)` : ""}</td>
                          <td>${row.actualSets === null ? "missing" : `${row.actualSets} sets`}</td>
                          <td>${statusText}</td>
                        </tr>
                      `;
                    })
                    .join("")}
                </tbody>
              </table>
            </div>
            <p class="muted">Current week is judged differently because it is still open. Missing prior weeks are missing data, not zero completed sets. Week types and deload multipliers come from the Plans page.</p>
          </section>
        `;
      }

      function medianValue(values) {
        const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
        if (!sorted.length) return null;
        const middle = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
      }

      function deltaText(current, baseline, digits = 0, suffix = "") {
        if (!Number.isFinite(current) || !Number.isFinite(baseline) || baseline === 0) return "missing";
        const delta = current - baseline;
        const percent = (delta / baseline) * 100;
        return `${delta >= 0 ? "+" : ""}${formatNumber(delta, digits)}${suffix} (${percent >= 0 ? "+" : ""}${formatNumber(percent, 0)}%)`;
      }

      function weekComparisonPanel(summary) {
        const current = summary.currentWeekStats || { week: summary.currentWeek, sets: 0, volume: 0, adjustedVolume: 0 };
        const projected = summary.currentProjectedStats || { sets: 0, volume: 0, adjustedVolume: 0 };
        const currentObservedOrCopied = {
          sets: number(current.sets) + number(projected.sets),
          volume: number(current.volume) + number(projected.volume),
          adjustedVolume: number(current.adjustedVolume) + number(projected.adjustedVolume),
        };
        const finishSets = currentWeekFinishProjection(summary, currentObservedOrCopied.sets);
        const representedRatio = Math.max(0.01, Math.min(1, number(summary.currentTrainingDayRatio) || 1));
        const currentPace = {
          sets: currentObservedOrCopied.sets / representedRatio,
          volume: currentObservedOrCopied.volume / representedRatio,
          adjustedVolume: currentObservedOrCopied.adjustedVolume / representedRatio,
        };
        const completeWeeks = (summary.weeklyTotals || [])
          .filter((row) => row.week && row.week !== summary.currentWeek && number(row.sets) > 0)
          .sort((a, b) => a.week.localeCompare(b.week));
        const previousComplete = completeWeeks.at(-1);
        const medianWeek = {
          sets: medianValue(completeWeeks.map((row) => number(row.sets))),
          volume: medianValue(completeWeeks.map((row) => number(row.volume))),
          adjustedVolume: medianValue(completeWeeks.map((row) => number(row.adjustedVolume))),
        };

        const currentExerciseKeys = new Set(
          (summary.exerciseWeeklyBest || [])
            .filter((row) => row.week === summary.currentWeek)
            .map((row) => `${row.exerciseId}:${row.variationId}`),
        );
        const liftRows = [...currentExerciseKeys]
          .map((key) => {
            const [exerciseId, variationId] = key.split(":");
            const currentBest = (summary.exerciseWeeklyBest || [])
              .filter((row) => row.week === summary.currentWeek && row.exerciseId === exerciseId && row.variationId === variationId)
              .sort((a, b) => b.e1rm - a.e1rm)[0];
            const previousBest = (summary.exerciseWeeklyBest || [])
              .filter((row) => row.week < summary.currentWeek && row.exerciseId === exerciseId && row.variationId === variationId)
              .sort((a, b) => b.week.localeCompare(a.week) || b.e1rm - a.e1rm)[0];
            if (!currentBest) return null;
            return { exerciseId, variationId, currentBest, previousBest };
          })
          .filter(Boolean)
          .slice(0, 8);

        return `
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>This week versus previous weeks</h2>
              <span class="muted">${formatWeekRange(summary.currentWeek)}</span>
            </div>
            <div class="table-wrap" style="margin-top: 12px;">
              <table>
                <thead><tr><th>Metric</th><th>This week so far</th><th>Training-day pace</th><th>Previous complete week</th><th>Median complete week</th></tr></thead>
                <tbody>
                  <tr>
                    <td>Hard sets</td>
                    <td>${formatNumber(currentObservedOrCopied.sets, 0)}${projected.sets ? ` incl. ${formatNumber(projected.sets, 0)} copied` : ""}</td>
                    <td>${formatNumber(currentPace.sets, 0)} pace; ${formatNumber(finishSets, 0)} projected finish</td>
                    <td>${previousComplete ? `${formatNumber(previousComplete.sets, 0)} (${deltaText(currentPace.sets, number(previousComplete.sets))})` : "missing"}</td>
                    <td>${medianWeek.sets === null ? "missing" : `${formatNumber(medianWeek.sets, 0)} (${deltaText(currentPace.sets, medianWeek.sets)})`}</td>
                  </tr>
                  <tr>
                    <td>Adjusted kg-load</td>
                    <td>${formatNumber(currentObservedOrCopied.adjustedVolume, 1)}</td>
                    <td>${formatNumber(currentPace.adjustedVolume, 1)}</td>
                    <td>${previousComplete ? `${formatNumber(previousComplete.adjustedVolume, 1)} (${deltaText(currentPace.adjustedVolume, number(previousComplete.adjustedVolume), 1)})` : "missing"}</td>
                    <td>${medianWeek.adjustedVolume === null ? "missing" : `${formatNumber(medianWeek.adjustedVolume, 1)} (${deltaText(currentPace.adjustedVolume, medianWeek.adjustedVolume, 1)})`}</td>
                  </tr>
                  <tr>
                    <td>Effective raw kg-load</td>
                    <td>${formatNumber(currentObservedOrCopied.volume, 1)}</td>
                    <td>${formatNumber(currentPace.volume, 1)}</td>
                    <td>${previousComplete ? `${formatNumber(previousComplete.volume, 1)} (${deltaText(currentPace.volume, number(previousComplete.volume), 1)})` : "missing"}</td>
                    <td>${medianWeek.volume === null ? "missing" : `${formatNumber(medianWeek.volume, 1)} (${deltaText(currentPace.volume, medianWeek.volume, 1)})`}</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <p class="muted">Because the current week is still open, the pace column scales represented training days to a full training week. Missing weeks are not treated as zero.</p>
            ${
              liftRows.length
                ? `<div class="table-wrap" style="margin-top: 14px;">
                    <table>
                      <thead><tr><th>Lift done this week</th><th>This week e1RM</th><th>Previous observed e1RM</th><th>Delta</th></tr></thead>
                      <tbody>
                        ${liftRows
                          .map(
                            (row) => `
                              <tr>
                                <td>${exerciseName(row.exerciseId)}${variationName(row.variationId) !== "Standard" ? `, ${variationName(row.variationId)}` : ""}</td>
                                <td>${formatNumber(row.currentBest.e1rm, 1)} kg</td>
                                <td>${row.previousBest ? `${formatNumber(row.previousBest.e1rm, 1)} kg (${formatWeekRange(row.previousBest.week)})` : "missing"}</td>
                                <td>${row.previousBest ? deltaText(row.currentBest.e1rm, row.previousBest.e1rm, 1, " kg") : "missing"}</td>
                              </tr>
                            `,
                          )
                          .join("")}
                      </tbody>
                    </table>
                  </div>`
                : `<p class="muted">No weighted lift benchmarks have been imported for this week yet.</p>`
            }
          </section>
        `;
      }

      function compareValueBar(label, current, previous, digits = 0, suffix = "") {
        const max = Math.max(number(current), number(previous), 1);
        const currentWidth = number(current) > 0 ? Math.max(2, (number(current) / max) * 100) : 0;
        const previousWidth = number(previous) > 0 ? Math.max(2, (number(previous) / max) * 100) : 0;
        return `
          <div class="bar-row">
            <div class="bar-label">
              <span>${label}</span>
              <strong>${formatNumber(current, digits)}${suffix} <span class="muted">vs ${formatNumber(previous, digits)}${suffix}</span></strong>
            </div>
            <div class="bar-track" style="height: 18px;">
              <div class="bar-fill" style="width:${previousWidth}%; background: rgba(127, 168, 239, 0.38); height: 18px;"></div>
              <div class="bar-fill" style="width:${currentWidth}%; background: var(--green); height: 9px; margin-top: -13.5px;"></div>
            </div>
          </div>
        `;
      }

      function renderDesktopLog(summary) {
        const tables = summary.tables || {};
        const desktopTables = loadDesktopLogTables();
        const exercises = (tables.exercise || []).slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
        const exercisesById = new Map(exercises.map((exercise) => [exercise.id, exercise]));
        const variationsByExercise = new Map();
        for (const variation of tables.exercise_variation || []) {
          variationsByExercise.set(variation.exercise_id, [...(variationsByExercise.get(variation.exercise_id) || []), variation]);
        }
        const days = (tables.workout_day || [])
          .filter((day) => day.workout_plan_id === (tables.workout_plan || [])[0]?.id)
          .sort((a, b) => number(a.day_index) - number(b.day_index));
        const targetsByDayIndex = new Map();
        for (const day of days) {
          const targets = (tables.workout_day_exercise || [])
            .filter((target) => target.workout_day_id === day.id)
            .sort((a, b) => number(a.sort_order) - number(b.sort_order));
          targetsByDayIndex.set(String(number(day.day_index)), targets);
        }
        const latestDesktopSets = (desktopTables.lift_set || [])
          .slice()
          .sort((a, b) => String(b.logged_at).localeCompare(String(a.logged_at)))
          .slice(0, 12);
        const activeSavedSets = (tables.lift_set || [])
          .filter((set) => !set.deleted_at)
          .slice()
          .sort((a, b) => String(b.logged_at).localeCompare(String(a.logged_at)));
        const currentLocalDate = localIsoDate(new Date());
        const savedTodaySets = activeSavedSets.filter((set) => localIsoDate(set.logged_at) === currentLocalDate);
        const latestSavedSets = activeSavedSets.slice(0, 40);
        const displayedSavedSets = savedTodaySets.length ? savedTodaySets : latestSavedSets;
        const latestDesktopWeights = (desktopTables.body_metric_entry || [])
          .slice()
          .sort((a, b) => String(b.measured_at).localeCompare(String(a.measured_at)))
          .slice(0, 8);
        const latestSet = latestDesktopSets[0]?.logged_at || null;
        const latestSavedSet = latestSavedSets[0]?.logged_at || null;
        const latestWeight = latestDesktopWeights[0]?.measured_at || null;
        const desktopForm = loadDesktopLogForm();
        const saveMessage = loadDesktopSaveMessage();
        const latestKnownBodyWeight = latestBodyWeight(tables);

        return `
          <section class="panel">
            <div class="bar-label">
              <div>
                <h2>Desktop log</h2>
                <p class="muted">Laptop mirror of phone logging. Saves straight to the local Mac database when the desktop autosave API is running.</p>
              </div>
              <div class="pill-row" style="justify-content: flex-end;">
                <span class="pill ${savedTodaySets.length ? "good" : "watch"}">${formatNumber(savedTodaySets.length, 0)} saved today</span>
                <span class="pill ${latestSavedSet ? "good" : "watch"}">${latestSavedSet ? `latest saved ${formatDateTime(latestSavedSet)}` : "no saved sets yet"}</span>
              </div>
            </div>
          </section>

          <section class="grid dashboard" style="margin-top: 18px;">
            <section class="panel">
              <h2>Log set</h2>
              <div class="toggle-row">
                <label class="muted" for="desktop-day-select">Day</label>
                <select id="desktop-day-select">
                  <option value="" ${desktopForm.dayValue ? "" : "selected"}>Freestyle</option>
                  ${days.map((day) => `<option value="${number(day.day_index)}" ${String(desktopForm.dayValue) === String(number(day.day_index)) ? "selected" : ""}>${escapeHtml(day.name || `Day ${number(day.day_index)}`)}</option>`).join("")}
                </select>
              </div>
              <div class="toggle-row">
                <label class="muted" for="desktop-exercise-select">Exercise</label>
                <select id="desktop-exercise-select"></select>
              </div>
              <div class="toggle-row">
                <label class="muted" for="desktop-variation-select">Variation</label>
                <select id="desktop-variation-select"></select>
              </div>
              <div class="input-grid two">
                <label class="field-label" for="desktop-reps-input">
                  <span class="muted">Reps per set</span>
                  <input id="desktop-reps-input" type="number" min="0" step="1" value="${escapeHtml(desktopForm.reps ?? 6)}" />
                </label>
                <label class="field-label" for="desktop-weight-input">
                  <span class="muted">Weight kg</span>
                  <input id="desktop-weight-input" type="number" min="0" step="0.5" value="${escapeHtml(desktopForm.weight ?? 0)}" />
                </label>
              </div>
              <label class="field-label" for="desktop-setdate-input" style="margin-top: 12px;">
                <span class="muted">Workout date/time</span>
                <input id="desktop-setdate-input" type="datetime-local" value="${escapeHtml(desktopSetDateValue)}" />
              </label>
              <p class="muted" style="margin-top: 8px;">Defaults to now. Select an earlier date/time when catching up a previous workout.</p>
              <p class="muted" style="margin-top: 8px;">One click logs one set with this rep count and weight.</p>
              <div class="pill-row">
                <button id="desktop-log-button" type="button">Log desktop set</button>
                <button id="desktop-download-button" class="secondary" type="button">Download desktop backup</button>
                <button id="desktop-rescue-origin-button" class="secondary" type="button">Rescue draft from ${window.location.hostname === "localhost" ? "127.0.0.1" : "localhost"}</button>
                <button id="desktop-clear-button" class="secondary" type="button">Clear desktop draft</button>
              </div>
