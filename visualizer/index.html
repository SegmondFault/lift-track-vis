            <div class="metric-card ${currentHardCopyProjection ? "good" : ""}"><span class="muted">Current week hard sets</span><span class="metric-value">${currentHardCopyProjection ? formatNumber(currentHardCopyProjection.sets, 0) : "-"}</span><span class="muted">${currentHardCopyProjection ? "actual + copied Day 4/5" : "no projection"}</span></div>
            <div class="metric-card ${currentProjection ? "watch" : ""}"><span class="muted">Current hard-set pace</span><span class="metric-value">${currentProjection ? formatNumber(currentComparableSets / currentWeekRatio, 0) : "-"}</span><span class="muted">${currentProjection ? `${summary.representedTrainingDays || 0}/${summary.planProgress?.totalDays || "?"} training days` : "no current data"}</span></div>
          </section>
          ${latestWeek ? lifterVolumeScalePanel("Latest complete week lifter-volume scale", latestWeek.sets, `${formatWeekRange(latestWeek.week)}: broad comparison by hard-set count. Kg-load charts below are only meaningful relative to your own weighted-set data.`) : ""}
          ${
            currentComparableSets
              ? lifterVolumeScalePanel(
                  "Current week projected finish lifter-volume scale",
                  currentFinishProjectedSets,
                  `${summary.currentWeekStats.sets || 0} actual sets${currentHardCopyProjection?.projectedSets ? ` + ${currentHardCopyProjection.projectedSets} copied Day 4/5 sets` : ""}; projected finish is ${formatNumber(currentFinishProjectedSets, 0)} sets if the remaining planned days are completed.`,
                )
              : ""
          }
          <section class="grid dashboard" style="margin-top: 18px;">
            ${bars(
              "This week major muscle-group kg-volume",
              currentWeekMajorMuscles.length ? currentWeekMajorMuscles : [["No logged major-group volume this week", 1]],
            )}
            ${bars(
              "Latest complete week major muscle-group kg-volume",
              latestCompleteWeekMajorMuscles.length ? latestCompleteWeekMajorMuscles : [["No complete-week major-group volume", 1]],
            )}
          </section>
          <section class="grid dashboard" style="margin-top: 18px;">
            ${bars("This week detailed muscle kg-volume", currentWeekMuscles.length ? currentWeekMuscles : [["No logged muscle volume this week", 1]])}
            ${bars(
              "Latest complete week detailed muscle kg-volume",
              latestCompleteWeekMuscles.length ? latestCompleteWeekMuscles : [["No complete-week muscle volume", 1]],
            )}
          </section>
          <p class="muted" style="margin-top: 10px;">Detailed muscles keep chest and upper-chest separate. Major muscle groups roll those into pecs/back/shoulders/arms/legs/core/glutes using the strongest same-set coefficient in the group, so parent and child muscles do not double-count the same set.</p>
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Weekly major muscle-group kg-volume trends</h2>
              <span class="muted">pecs, back, shoulders, arms, legs, core, glutes</span>
            </div>
            <p class="muted" style="margin-top: 10px;">These rollups answer the broad balance question: which big regions are getting more or less weekly work over time?</p>
          </section>
          <section class="grid dashboard" style="margin-top: 18px;">
            ${majorMuscleTrendPanels || `<section class="panel"><h2>Weekly major muscle-group kg-volume trends</h2><p class="muted">No major muscle-group trend data in this period.</p></section>`}
          </section>
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Weekly detailed muscle kg-volume trends</h2>
              <span class="muted">keeps chest, upper-chest, delts, lats, etc separate</span>
            </div>
            <p class="muted" style="margin-top: 10px;">These charts show the detailed coefficient buckets through time. Missing weeks are shown as gaps rather than zero-volume weeks.</p>
          </section>
          <section class="grid dashboard" style="margin-top: 18px;">
            ${muscleTrendPanels || `<section class="panel"><h2>Weekly muscle kg-volume trends</h2><p class="muted">No muscle volume trend data in this period.</p></section>`}
          </section>
          <section class="panel" style="margin-top: 18px;">
            <div class="bar-label">
              <h2>Latest complete week</h2>
              <span class="muted">${latestWeek ? formatWeekRange(latestWeek.week) : "missing"}</span>
            </div>
            ${
              latestWeek
                ? `<div class="table-wrap" style="margin-top: 12px;">
                    <table>

      function renderMuscleGroups(summary) {
        const topMuscles = summary.muscleVolume.slice(0, 8).map(([muscle]) => muscle);
        const domainWeeks = chartWeeksFor(summary, summary.muscleWeeklyVolume || []);
        const volumePanels = topMuscles
          .map((muscle) => {
            const rows = (summary.muscleWeeklyVolume || [])
              .filter((row) => row.muscle === muscle)
              .map((row) => ({ week: row.week, value: row.value }));
            return lineChart(`${muscle} allocated kg-volume`, rows, { zeroBase: true, color: "#72c69a", weeks: domainWeeks });
          })
          .join("");
        const strengthPanels = topMuscles
          .map((muscle) => {
            const rows = (summary.muscleWeeklyStrength || [])
              .filter((row) => row.muscle === muscle)
              .filter((row) => (normalizeBenchmarks ? row.hasNormalized : true))
              .map((row) => ({ week: row.week, value: normalizeBenchmarks ? row.normalizedValue : row.value }));
            return lineChart(`${muscle} compound strength index`, rows, { color: "#7fa8ef", weeks: domainWeeks });
          })
          .join("");

        return `
          <section class="panel">
            <div class="bar-label">
              <h2>Muscle groups</h2>
              <span class="muted">Volume and compound benchmark trends</span>
            </div>
            <label class="toggle-row">
              <input id="normalize-toggle" type="checkbox" ${normalizeBenchmarks ? "checked" : ""} />
              <span>Normalize compound strength index using interpolated bodyweight</span>
            </label>
          </section>
          <section class="grid dashboard" style="margin-top: 18px;">
            ${bars("All-time allocated muscle kg-volume", summary.muscleVolume.length ? summary.muscleVolume : [["No coefficients yet", 1]])}
            ${bars("Compound/accessory split", summary.splitVolume.length ? summary.splitVolume : [["No tagged volume", 1]])}
          </section>
          ${muscleVolumeMethodPanel(summary)}
          ${muscleVolumeProvenanceTable(summary)}
          <section class="panel" style="margin-top: 18px;">
            <p class="muted">Muscle strength index uses the best compound e1RM contribution for each muscle in each week. Accessory and isolation lifts count toward volume, but they do not decide relative strength.</p>
          </section>
          <section class="panel" style="margin-top: 18px;">
            <h2>Strength index contributors</h2>
            <div class="bar-list">
              ${topMuscles
                .slice(0, 6)
                .map((muscle) => {
                  const contributors = (summary.contributionDetails || [])
                    .filter((row) => row.muscle === muscle && row.isCompound)
                    .sort((a, b) => b.coefficient - a.coefficient)
                    .slice(0, 6);
                  return `
                    <div class="bar-row">
                      <div class="bar-label"><strong>${muscle}</strong></div>
                      <div class="pill-row">
                        ${
                          contributors.length
                            ? contributors
                                .map(
                                  (row) =>
                                    `<span class="pill">${row.exercise} x ${formatNumber(row.coefficient, 2)}</span>`,
                                )
                                .join("")
                            : `<span class="pill watch">No compound contributors</span>`
                        }
                      </div>
                    </div>
                  `;
                })
                .join("")}
            </div>
          </section>
          ${volumePanels || `<section class="empty" style="margin-top: 18px;">No muscle volume series yet.</section>`}
          ${strengthPanels || `<section class="empty" style="margin-top: 18px;">No muscle strength series yet.</section>`}
        `;
      }

      function renderImports(summary) {
        const history = loadImportHistory();
        const counts = summary.tableCounts || {};

        return `
          <div id="imports-controls-slot" class="grid" style="margin-bottom: 18px;"></div>
          <section class="grid metrics">
            <div class="metric-card"><span class="muted">Remembered imports</span><span class="metric-value">${history.length}</span></div>
            <div class="metric-card"><span class="muted">Cached sets</span><span class="metric-value">${counts.lift_set || summary.setCount}</span></div>
            <div class="metric-card"><span class="muted">Cached sessions</span><span class="metric-value">${counts.workout_session || summary.sessionRows.length}</span></div>
          </section>
          <section class="panel">
            <h2>Import history</h2>
            <p class="muted">Full phone exports are merged into this browser's read-only Mac cache by stable table IDs, so importing the same backup again updates rows instead of duplicating sets.</p>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Imported</th><th>Phone exported</th><th>Latest set</th><th>File</th><th>Sets in export</th></tr></thead>
                <tbody>
                  ${history
                    .map(
                      (row) => `
                        <tr>
                          <td>${formatDateTime(row.importedAt)}</td>
                          <td>${formatDateTime(row.exportedAt)}</td>
                          <td>${formatDateTime(row.latestSetLoggedAt)}</td>
                          <td>${row.fileName}</td>
                          <td>${row.setCount}</td>
                        </tr>
                      `,
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
          </section>
        `;
      }

      function renderSettings(summary) {
        const profile = userProfile(summary.tables || {});
        const labels = {
          barbell: "Barbell/free weight",
          dumbbell: "Dumbbell/free accessory",
          bodyweight: "Bodyweight",
          cable: "Cable",
          machine: "Machine",
          unknown: "Unknown",
        };

        return `
          <section class="panel">
            <h2>Body profile settings</h2>
            <p class="muted">Used for body-composition inference and strength-standard matching. Age is calculated from the measurement date, not from today.</p>
            <div class="grid dashboard">
              <label>
                <span class="muted">Date of birth</span>
                <input id="profile-dob-input" type="date" value="${escapeHtml(profile.dob)}" />
              </label>
              <label>
                <span class="muted">Sex</span>
                <select id="profile-sex-input">
                  <option value="male" ${profile.sex === "male" ? "selected" : ""}>male</option>
                  <option value="female" ${profile.sex === "female" ? "selected" : ""}>female</option>
                </select>
              </label>
              <label>
                <span class="muted">Height cm</span>
                <input id="profile-height-input" type="number" min="120" max="230" step="0.1" value="${escapeHtml(profile.heightCm)}" />
              </label>
            </div>
            <div class="panel" style="margin-top: 16px; padding: 14px;">
              <div class="bar-label">
                <h3 style="margin: 0;">Athlete reference blend</h3>
                <span class="muted" id="athlete-mix-summary">${athleteModelMixLabel(profile.athleteModelMix)}</span>
              </div>
              <p class="muted">Set each category from 0-100. The Athlete model page normalizes these into a weighted ATHLAS reference band, so crossover training can be represented without pretending you are exactly one cohort.</p>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Category</th><th>Training relevance</th><th>Weight</th></tr></thead>
                  <tbody>
                    ${athleteModelTypes
                      .map(
                        (type) => `
                          <tr>
                            <td>${athleteModelLabel(type)}</td>
                            <td>${type === "strength" ? "lifting and high-force training" : type === "sprint" ? "power, lower-body explosiveness, mixed sport" : type === "endurance" ? "running/conditioning bias" : "non-training comparison baseline"}</td>
                            <td><input class="athlete-mix-input" data-athlete-type="${type}" type="number" min="0" max="100" step="5" value="${formatNumber(profile.athleteModelMix?.[type] ?? defaultAthleteModelMix[type] ?? 0, 1)}" style="width: 90px;" />%</td>
                          </tr>
                        `,
                      )
                      .join("")}
                  </tbody>
                </table>
              </div>
            </div>
            <div class="panel" style="margin-top: 16px; padding: 14px;">
              <div class="bar-label">
                <h3 style="margin: 0;">Growth forecast model</h3>
                <span class="muted">Training age and morphology adjustment</span>
              </div>
              <p class="muted">These settings affect the trained-lifter adjusted FFMI and Growth forecast page. Raw NHANES FFMI remains visible separately.</p>
              <div class="grid dashboard">
                <label>
                  <span class="muted">Resistance training start date</span>
                  <input id="profile-training-start-input" type="date" value="${escapeHtml(profile.resistanceTrainingStartedAt)}" />
                </label>
                <label>
                  <span class="muted">Prior background credit, months</span>
                  <input id="profile-prior-credit-input" type="number" min="0" max="240" step="1" value="${escapeHtml(profile.priorBackgroundCreditMonths)}" />
                </label>
                <label>
                  <span class="muted">Growth model source policy</span>
                  <select id="profile-growth-policy-input">
                    ${growthModelSourcePolicies
                      .map(
                        (policy) => `
                          <option value="${escapeHtml(policy)}" ${profile.growthModelSourcePolicy === policy ? "selected" : ""}>${growthModelSourcePolicyLabels[policy] || policy}</option>
                        `,
                      )
                      .join("")}
                  </select>
                </label>
                <label>
                  <span class="muted">Morphology adjustment strength</span>
                  <select id="profile-morphology-strength-input">
                    ${Object.entries(morphologyAdjustmentStrengthOptions)
                      .map(
                        ([key, option]) => `
                          <option value="${escapeHtml(key)}" ${profile.morphologyAdjustmentStrength === key ? "selected" : ""}>${option.label}</option>
                        `,
                      )
                      .join("")}
                  </select>
                </label>
              </div>
            </div>
            <div class="pill-row">
              <button id="profile-save-button" type="button">Save body profile</button>
            </div>
            <p class="muted">Fallback profile values are synthetic and are used only until a profile is loaded or saved. Profile data stays local unless exported through the normal tracker backup.</p>
          </section>
          <section class="panel">
            <h2>Volume normalization settings</h2>
            <p class="muted">Adjusted volume = reps x effective weight x equipment factor. Dumbbell entries are logged per hand and counted as both hands for analytics. Raw data is preserved; these factors only affect visualizer analytics.</p>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Equipment</th><th>Factor</th><th>Default</th></tr></thead>
                <tbody>
                  ${Object.entries(defaultEquipmentFactors)
                    .map(
                      ([key, fallback]) => `
                        <tr>
                          <td>${labels[key]}</td>
                          <td><input class="factor-input" data-factor="${key}" type="number" min="0" step="0.05" value="${equipmentFactors[key] ?? fallback}" style="width: 90px;" /></td>
                          <td>${fallback}</td>
                        </tr>
                      `,
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
            <div class="pill-row">
              <button id="reset-factors-button" class="secondary" type="button">Reset factors</button>
            </div>
          </section>
          <section class="grid dashboard" style="margin-top: 18px;">
            ${bars("Raw volume by equipment", summary.equipmentVolume?.length ? summary.equipmentVolume : [["No equipment data", 1]])}
          </section>
        `;
      }

      function renderBiometricsHub(summary) {
        const sections = [
          ["measurements", "Measurements"],
          ["body-composition", "Body composition"],
          ["athlete-model", "Athlete model"],
          ["growth", "Growth forecast"],
        ];
        const content =
          currentBiometricsSection === "body-composition"
            ? renderBodyComposition(summary)
            : currentBiometricsSection === "athlete-model"
              ? renderAthleteModel(summary)
              : currentBiometricsSection === "growth"
                ? renderGrowthForecast(summary)
                : renderBiometrics(summary);

        return `
          <section class="panel">
            <div class="bar-label">
              <div>
                <h2>Biometrics</h2>
                <p class="muted">Measurements, body composition, athlete comparisons, and growth projections in one workspace.</p>
              </div>
            </div>
            <aside class="experimental-notice" aria-label="Experimental biometrics notice">
              <strong>Heuristic &amp; experimental</strong>
              Everything in this workspace is exploratory and model-dependent. Treat measurements, estimates, comparisons, and forecasts as directional signals—not medical findings, diagnoses, or reliable predictions.
            </aside>
            <nav class="workspace-nav" aria-label="Biometrics sections">
              ${sections
                .map(
                  ([id, label]) => `
                    <button
                      class="workspace-nav-button ${currentBiometricsSection === id ? "active" : ""}"
                      type="button"
                      data-biometrics-section="${id}"
                      aria-pressed="${currentBiometricsSection === id ? "true" : "false"}"
                    >${label}</button>
                  `,
                )
                .join("")}
            </nav>
          </section>
          <div style="margin-top: 18px;">
            ${content}
          </div>
        `;
      }

      function renderTrainingVolumeHub(summary) {
        const sections = [
          ["overview", "Volume overview"],
          ["muscles", "Muscle groups"],
        ];
        const content = currentTrainingVolumeSection === "muscles"
          ? renderMuscleGroups(summary)
          : renderTrainingVolume(summary);

        return `
          <section class="panel">
            <div class="bar-label">
              <div>
                <h2>Training volume</h2>
                <p class="muted">Overall workload and muscle-group distribution in one workspace.</p>
              </div>
            </div>
            <nav class="workspace-nav" aria-label="Training volume sections">
              ${sections
                .map(
                  ([id, label]) => `
                    <button
                      class="workspace-nav-button ${currentTrainingVolumeSection === id ? "active" : ""}"
                      type="button"
                      data-training-volume-section="${id}"
                      aria-pressed="${currentTrainingVolumeSection === id ? "true" : "false"}"
                    >${label}</button>
                  `,
                )
                .join("")}
            </nav>
          </section>
          <div style="margin-top: 18px;">
            ${content}
          </div>
        `;
      }

      function renderSettingsHub(summary) {
        const sections = [
          ["general", "General settings"],
          ["plans", "Plans"],
          ["imports", "Imports"],
        ];
        const content = currentSettingsSection === "plans"
          ? renderPlans(summary)
          : currentSettingsSection === "imports"
            ? renderImports(summary)
            : renderSettings(summary);

        return `
          <section class="panel">
            <div class="bar-label">
              <div>
                <h2>Settings</h2>
                <p class="muted">Visualizer preferences, profile configuration, training plans, and data imports.</p>
              </div>
            </div>
            <nav class="workspace-nav" aria-label="Settings sections">
              ${sections
                .map(
                  ([id, label]) => `
                    <button
                      class="workspace-nav-button ${currentSettingsSection === id ? "active" : ""}"
                      type="button"
                      data-settings-section="${id}"
                      aria-pressed="${currentSettingsSection === id ? "true" : "false"}"
                    >${label}</button>
                  `,
                )
                .join("")}
            </nav>
          </section>
          <div style="margin-top: 18px;">
            ${content}
          </div>
        `;
      }

      function render(imported) {
        currentImport = imported;
        const summary = summarize(imported);

        if (importControls.parentElement !== importControlsDock) {
          importControlsDock.appendChild(importControls);
        }

        root.className = "";
        root.innerHTML =
          currentPage === "benchmarks"
            ? renderBenchmarks(summary)
            : currentPage === "log"
              ? renderDesktopLog(summary)
              : currentPage === "week-compare"
                ? renderWeekCompare(summary)
                : currentPage === "biometrics"
                    ? renderBiometricsHub(summary)
                    : currentPage === "volume"
                      ? renderTrainingVolumeHub(summary)
                      : currentPage === "settings"
                        ? renderSettingsHub(summary)
                        : renderOverview(summary);

        document.getElementById("imports-controls-slot")?.appendChild(importControls);

        document.querySelectorAll("[data-biometrics-section]").forEach((button) => {
          button.addEventListener("click", () => {
            currentBiometricsSection = button.dataset.biometricsSection || "measurements";
            render(currentImport);
          });
        });

        document.querySelectorAll("[data-training-volume-section]").forEach((button) => {
          button.addEventListener("click", () => {
            currentTrainingVolumeSection = button.dataset.trainingVolumeSection || "overview";
            render(currentImport);
          });
        });

        document.querySelectorAll("[data-settings-section]").forEach((button) => {
          button.addEventListener("click", () => {
            currentSettingsSection = button.dataset.settingsSection || "general";
            render(currentImport);
          });
        });

        document.querySelectorAll("#normalize-toggle").forEach((toggle) => {
          toggle.addEventListener("change", (event) => {
            normalizeBenchmarks = event.target.checked;
            saveVisualizerSettings();
            render(currentImport);
          });
        });

        document.querySelectorAll("[data-benchmark-overlay-range]").forEach((button) => {
          button.addEventListener("click", () => {
            benchmarkOverlayRange = button.getAttribute("data-benchmark-overlay-range") || "all";
            saveVisualizerSettings();
            render(currentImport);
          });
        });

        document.querySelectorAll(".factor-input").forEach((input) => {
          input.addEventListener("change", (event) => {
            const key = event.target.dataset.factor;
            equipmentFactors = normalizeEquipmentFactors({
              ...equipmentFactors,
              [key]: Number(event.target.value),
            });
            saveVisualizerSettings();
            render(currentImport);
          });
        });

        document.getElementById("reset-factors-button")?.addEventListener("click", () => {
          equipmentFactors = normalizeEquipmentFactors(defaultEquipmentFactors);
          saveVisualizerSettings();
          render(currentImport);
        });

        const readAthleteMixInputs = () =>
          normalizeAthleteModelMix(
            Object.fromEntries(
              [...document.querySelectorAll(".athlete-mix-input")].map((input) => [
                input.dataset.athleteType,
                Number(input.value),
              ]),
            ),
            "strength",
          );

        document.querySelectorAll(".athlete-mix-input").forEach((input) => {
          input.addEventListener("input", () => {
            const mix = readAthleteMixInputs();
            const summaryLabel = document.getElementById("athlete-mix-summary");
            if (summaryLabel) summaryLabel.textContent = athleteModelMixLabel(mix);
          });
        });

        document.getElementById("profile-save-button")?.addEventListener("click", async () => {
          const dob = String(document.getElementById("profile-dob-input")?.value || "").slice(0, 10);
          const sex = String(document.getElementById("profile-sex-input")?.value || "male");
          const height = Number(document.getElementById("profile-height-input")?.value || 0);
          const trainingStart = String(document.getElementById("profile-training-start-input")?.value || "").slice(0, 10);
          const priorBackgroundCreditMonths = Number(document.getElementById("profile-prior-credit-input")?.value || 0);
          const growthModelSourcePolicy = String(document.getElementById("profile-growth-policy-input")?.value || "evidence-first hybrid");
          const morphologyAdjustmentStrength = String(document.getElementById("profile-morphology-strength-input")?.value || "moderate");
          const athleteModelMix = readAthleteMixInputs();
          const athleteModelType = dominantAthleteModelType(athleteModelMix, "strength");
          if (
            !/^\d{4}-\d{2}-\d{2}$/.test(dob) ||
            !["male", "female"].includes(sex) ||
            !Number.isFinite(height) ||
            height < 120 ||
            height > 230 ||
            !/^\d{4}-\d{2}-\d{2}$/.test(trainingStart) ||
            !Number.isFinite(priorBackgroundCreditMonths) ||
            priorBackgroundCreditMonths < 0 ||
            priorBackgroundCreditMonths > 240 ||
            !growthModelSourcePolicies.includes(growthModelSourcePolicy) ||
            !Object.prototype.hasOwnProperty.call(morphologyAdjustmentStrengthOptions, morphologyAdjustmentStrength)
          ) {
            status.textContent = "Profile needs valid body settings, training start date, prior credit, and growth model options.";
            return;
          }
          profileOverrides = normalizeProfileOverrides({
            user_date_of_birth: dob,
            user_sex: sex,
            user_height_cm: String(height),
            user_athlete_model_type: athleteModelType,
            user_athlete_model_mix: athleteModelMix,
            user_resistance_training_started_at: trainingStart,
            user_prior_background_credit_months: String(priorBackgroundCreditMonths),
            user_growth_model_source_policy: growthModelSourcePolicy,
            user_morphology_adjustment_strength: morphologyAdjustmentStrength,
          });
          saveVisualizerSettings();
          const now = new Date().toISOString();
          const rows = [
            {
              key: "user_date_of_birth",
              value: dob,
              source: "desktop-settings",
              notes: "Used for age-at-measurement body-composition inference.",
              created_at: now,
              updated_at: now,
            },
            {
              key: "user_sex",
              value: sex,
              source: "desktop-settings",
              notes: "Used for body-composition and strength-standard inference.",
              created_at: now,
              updated_at: now,
            },
            {
              key: "user_height_cm",
              value: String(height),
              source: "desktop-settings",
              notes: "Used for BMI, FFMI, and strength-standard inference.",
              created_at: now,
              updated_at: now,
            },
            {
              key: "user_athlete_model_type",
              value: athleteModelType,
              source: "desktop-settings",
              notes: "Dominant athlete reference type derived from the manual ATHLAS blend.",
              created_at: now,
              updated_at: now,
            },
            {
              key: "user_athlete_model_mix",
              value: JSON.stringify(athleteModelMix),
              source: "desktop-settings",
              notes: "Manual 0-100 athlete reference blend for ATHLAS-trained body-composition inference.",
              created_at: now,
              updated_at: now,
            },
            {
              key: "user_resistance_training_started_at",
              value: trainingStart,
              source: "desktop-settings",
              notes: "Used for effective resistance-training age in growth forecasting.",
              created_at: now,
              updated_at: now,
            },
            {
              key: "user_prior_background_credit_months",
              value: String(Math.round(priorBackgroundCreditMonths)),
              source: "desktop-settings",
              notes: "Prior endurance/work/manual-strength background credit applied to effective training age.",
              created_at: now,
              updated_at: now,
            },
            {
              key: "user_growth_model_source_policy",
              value: growthModelSourcePolicy,
              source: "desktop-settings",
              notes: "Controls how conservative the growth forecast is around evidence and heuristic context.",
              created_at: now,
              updated_at: now,
            },
            {
              key: "user_morphology_adjustment_strength",
              value: morphologyAdjustmentStrength,
              source: "desktop-settings",
              notes: "Caps the signed trained-lifter morphology adjustment applied over the ensemble estimate.",
              created_at: now,
              updated_at: now,
            },
          ];
          const saved = await saveAppMetadataRowsToMac(
            rows,
            `Saved body profile: DOB ${formatDate(dob)}, ${sex}, ${formatNumber(height, 1)}cm, athlete blend ${athleteModelMixLabel(athleteModelMix)}, training start ${formatDate(trainingStart)}.`,
          );
          if (!saved) render(currentImport);
        });

        document.getElementById("plan-save-button")?.addEventListener("click", () => {
          const tables = summary.tables || {};
          const currentDraft = loadPlanDraft(tables);
          let weekOverrides;
          let planTemplate;
          try {
            weekOverrides = JSON.parse(document.getElementById("week-overrides-textarea")?.value || "[]");
            planTemplate = JSON.parse(document.getElementById("plan-template-textarea")?.value || "{}");
          } catch (error) {
            status.textContent = `Plan JSON is not valid: ${error.message}`;
            return;
          }

          const planName = document.getElementById("plan-name-input")?.value?.trim() || "Workout Plan";
          const versionName = document.getElementById("plan-version-input")?.value?.trim() || "Workout Plan v1";
          const activePlan = { ...(currentDraft.plans?.[0] || {}), name: planName };
          const activeVersionId = activePlan.currentVersionId || currentDraft.planVersions?.[0]?.id || "custom-full-body-2026-v1";
          activePlan.currentVersionId = activeVersionId;
          const planVersions = (currentDraft.planVersions || []).length
            ? currentDraft.planVersions.map((version, index) => (index === 0 || version.id === activeVersionId ? { ...version, name: versionName } : version))
            : [
                {
                  id: activeVersionId,
                  workout_plan_id: activePlan.id || "training-regime-2026",
                  version_name: "v1",
                  name: versionName,
                  status: "active",
                  created_at: new Date().toISOString(),
                  notes: "",
                },
              ];

          const nextDraft = savePlanDraft({
            ...currentDraft,
            plans: [activePlan],
            planVersions,
            weekOverrides,
            planTemplate,
          });
          status.textContent = `Saved plan draft at ${new Date(nextDraft.updatedAt).toLocaleString("en-GB")}`;
          render(currentImport);
        });

        document.getElementById("plan-reset-button")?.addEventListener("click", () => {
          localStorage.removeItem(planEditorKey);
          status.textContent = "Reset plan draft from latest import.";
          render(currentImport);
        });

        document.getElementById("plan-download-button")?.addEventListener("click", () => {
          const draft = loadPlanDraft(summary.tables || {});
          downloadJson("plan-config.json", draft);
        });

        document.getElementById("phone-plan-download-button")?.addEventListener("click", () => {
          const draft = loadPlanDraft(summary.tables || {});
          downloadJson("phone-plan-context.json", {
            schemaVersion: 1,
            exportedAt: new Date().toISOString(),
            kind: "lifting-tracker-phone-plan-context",
            activePlan: draft.plans?.[0] || null,
            activeVersion: (draft.planVersions || []).find((version) => version.id === draft.plans?.[0]?.currentVersionId) || null,
            weekOverrides: draft.weekOverrides || [],
            planTemplate: draft.planTemplate || null,
          });
        });

        const setDefaultDateTimeInput = (id, { maxNow = false } = {}) => {
          const input = document.getElementById(id);
          const now = new Date();
          const nowLocal = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
          if (input && !input.value) {
            input.value = nowLocal;
          }
          if (input && maxNow) input.max = nowLocal;
        };
        setDefaultDateTimeInput("biometrics-bodymetric-date-input");
        setDefaultDateTimeInput("biometrics-measurement-date-input");

        document.getElementById("biometrics-log-weight-button")?.addEventListener("click", async () => {
          const button = document.getElementById("biometrics-log-weight-button");
          if (button?.disabled) return;
          const bodyWeight = Number(document.getElementById("biometrics-bodyweight-input")?.value || 0);
          const bodyFatValue = document.getElementById("biometrics-bodyfat-input")?.value || "";
          const bodyFat = bodyFatValue === "" ? null : Number(bodyFatValue);
          const dateValue = document.getElementById("biometrics-bodymetric-date-input")?.value || "";
          if (!plausibleBodyWeight(bodyWeight) || (bodyFat !== null && (!Number.isFinite(bodyFat) || bodyFat < 0 || bodyFat > 70))) {
            status.textContent = `Enter a plausible bodyweight in kg (${minPlausibleBodyweightKg}-${maxPlausibleBodyweightKg}) and optional body fat %.`;
            return;
          }
          const measuredAt = dateValue ? new Date(dateValue).toISOString() : new Date().toISOString();
          if (!Number.isFinite(Date.parse(measuredAt))) {
            status.textContent = "Choose a valid measurement date/time.";
            return;
          }
          if (button) {
            button.disabled = true;
            button.textContent = "Saving...";
          }
          const now = new Date().toISOString();
          const desktopTables = loadDesktopLogTables();
          desktopTables.body_metric_entry = [
            ...(desktopTables.body_metric_entry || []),
            {
              id: makeDesktopId("bodymetric"),
              measured_at: measuredAt,
              body_weight: bodyWeight,
              body_fat: bodyFat,
              source: "desktop-biometrics",
              created_at: now,
              updated_at: now,
            },
          ];
          await saveDesktopTablesToMac(desktopTables, `Logged bodyweight ${formatNumber(bodyWeight, 1)} kg from Biometrics.`);
        });

        document.getElementById("biometrics-log-measurement-button")?.addEventListener("click", async () => {
          const button = document.getElementById("biometrics-log-measurement-button");
          if (button?.disabled) return;
          const measurementType = document.getElementById("biometrics-measurement-type-input")?.value || "";
          const value = Number(document.getElementById("biometrics-measurement-value-input")?.value || 0);
          const sideValue = document.getElementById("biometrics-measurement-side-input")?.value || "";
          const confidence = document.getElementById("biometrics-measurement-confidence-input")?.value || "high";
          const dateValue = document.getElementById("biometrics-measurement-date-input")?.value || "";
          const notes = document.getElementById("biometrics-measurement-notes-input")?.value?.trim() || "";
          if (!biometricMeasurementTypeLabels[measurementType] || !Number.isFinite(value) || value <= 0 || value > 300) {
            status.textContent = "Choose a measurement type and enter a plausible value in cm.";
            return;
          }
          const measuredAt = dateValue ? new Date(dateValue).toISOString() : new Date().toISOString();
          if (!Number.isFinite(Date.parse(measuredAt))) {
            status.textContent = "Choose a valid measurement date/time.";
            return;
          }
          if (button) {
            button.disabled = true;
            button.textContent = "Saving...";
          }
          const now = new Date().toISOString();
          const desktopTables = loadDesktopLogTables();
          desktopTables.body_measurement_entry = [
            ...(desktopTables.body_measurement_entry || []),
            {
              id: makeDesktopId("bodymeasurement"),
              measured_at: measuredAt,
              measurement_type: measurementType,
              value,
              unit: "cm",
              side: sideValue || null,
              confidence,
              source: "desktop-biometrics",
              notes,
              created_at: now,
              updated_at: now,
            },
          ];
          await saveDesktopTablesToMac(
            desktopTables,
            `Logged ${measurementTypeLabel(measurementType)} ${formatNumber(value, 1)} cm from Biometrics.`,
          );
        });

        document.querySelectorAll("[data-mac-delete-weight]").forEach((button) => {
          button.addEventListener("click", async () => {
            const entryId = button.getAttribute("data-mac-delete-weight");
            const entry = (summary.tables?.body_metric_entry || []).find((row) => row.id === entryId);
            if (button.disabled) return;
            button.disabled = true;
            button.textContent = "Deleting...";
            await deleteMacRow(
              "body_metric_entry",
              entryId,
              entry
                ? `Deleted saved bodyweight: ${formatNumber(entry.body_weight, 1)} kg.`
                : "Deleted saved bodyweight.",
            );
          });
        });

        document.querySelectorAll("[data-mac-delete-measurement]").forEach((button) => {
          button.addEventListener("click", async () => {
            const entryId = button.getAttribute("data-mac-delete-measurement");
            const entry = (summary.tables?.body_measurement_entry || []).find((row) => row.id === entryId);
            if (button.disabled) return;
            button.disabled = true;
            button.textContent = "Deleting...";
            await deleteMacRow(
              "body_measurement_entry",
              entryId,
              entry
                ? `Deleted saved ${measurementTypeLabel(entry.measurement_type)} measurement.`
                : "Deleted saved measurement.",
            );
          });
        });

        document.querySelectorAll("[data-desktop-delete-measurement]").forEach((button) => {
          button.addEventListener("click", () => {
            const entryId = button.getAttribute("data-desktop-delete-measurement");
            const desktopTables = loadDesktopLogTables();
            const removedEntry = (desktopTables.body_measurement_entry || []).find((entry) => entry.id === entryId);
            desktopTables.body_measurement_entry = (desktopTables.body_measurement_entry || []).filter((entry) => entry.id !== entryId);
            saveDesktopLogTables(desktopTables);
            status.textContent = removedEntry
              ? `Deleted draft ${measurementTypeLabel(removedEntry.measurement_type)} measurement.`
              : "Draft measurement was already gone.";
            render(currentImport);
          });
        });

        const desktopExerciseSelect = document.getElementById("desktop-exercise-select");
        const desktopVariationSelect = document.getElementById("desktop-variation-select");
        const desktopDaySelect = document.getElementById("desktop-day-select");
        const desktopPlanContext = document.getElementById("desktop-plan-context");
        const exerciseRows = (summary.tables?.exercise || []).slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
        const exerciseById = new Map(exerciseRows.map((exercise) => [exercise.id, exercise]));
        const dayRows = (summary.tables?.workout_day || []).filter((day) => day.workout_plan_id === (summary.tables?.workout_plan || [])[0]?.id);
        const targetsByDayIndex = new Map();
        for (const day of dayRows) {
          const seenTargets = new Set();
          targetsByDayIndex.set(
            String(number(day.day_index)),
            (summary.tables?.workout_day_exercise || [])
              .filter((target) => target.workout_day_id === day.id)
              .filter((target) => {
                const key = `${target.exercise_id}:${target.variation_id}`;
                if (seenTargets.has(key)) return false;
                seenTargets.add(key);
                return true;
              })
              .sort((a, b) => number(a.sort_order) - number(b.sort_order)),
          );
        }

        const populateDesktopExercises = (options = {}) => {
          if (!desktopExerciseSelect) return;
          const selectedDay = desktopDaySelect?.value || "";
          const plannedTargets = targetsByDayIndex.get(selectedDay) || [];
          const plannedIds = new Set(plannedTargets.map((target) => target.exercise_id));
          const previousValue = desktopExerciseSelect.value;
          const preferredExerciseId = options.preferredExerciseId || null;
          const plannedOptions = plannedTargets
            .map((target) => {
              const exercise = exerciseById.get(target.exercise_id);
              if (!exercise) return "";
              return `<option value="${escapeHtml(exercise.id)}" data-planned-variation="${escapeHtml(target.variation_id)}">${escapeHtml(exercise.name)} (${formatNumber(target.target_sets, 0)} planned)</option>`;
            })
            .join("");
          const otherOptions = exerciseRows
            .filter((exercise) => !plannedIds.has(exercise.id))
            .map((exercise) => `<option value="${escapeHtml(exercise.id)}">${escapeHtml(exercise.name)}</option>`)
            .join("");
          desktopExerciseSelect.innerHTML = selectedDay
            ? `${plannedOptions}${plannedOptions && otherOptions ? `<option disabled>-- all exercises --</option>` : ""}${otherOptions}`
            : otherOptions;
          const values = new Set([...desktopExerciseSelect.options].filter((option) => !option.disabled).map((option) => option.value));
          if (preferredExerciseId && values.has(preferredExerciseId)) {
            desktopExerciseSelect.value = preferredExerciseId;
          } else if (options.preserveCurrent && previousValue && values.has(previousValue)) {
            desktopExerciseSelect.value = previousValue;
          } else if (selectedDay && plannedTargets[0]?.exercise_id) {
            desktopExerciseSelect.value = plannedTargets[0].exercise_id;
          }
          if (desktopPlanContext) {
            desktopPlanContext.textContent = selectedDay
              ? `${plannedTargets.length} planned exercises are shown first for Day ${selectedDay}; all other exercises remain available below.`
              : "Freestyle mode shows the full exercise library.";
          }
          populateDesktopVariations();
        };

        const populateDesktopVariations = () => {
          if (!desktopExerciseSelect || !desktopVariationSelect) return;
          const exerciseId = desktopExerciseSelect.value;
          const plannedVariationId = desktopExerciseSelect.selectedOptions?.[0]?.dataset?.plannedVariation || null;
          const variations = (summary.tables?.exercise_variation || [])
            .filter((variation) => variation.exercise_id === exerciseId)
            .sort((a, b) => {
              if (plannedVariationId) {
                if (a.id === plannedVariationId) return -1;
                if (b.id === plannedVariationId) return 1;
              }
              return number(b.is_default) - number(a.is_default) || String(a.name).localeCompare(String(b.name));
            });
          desktopVariationSelect.innerHTML = variations
            .map((variation) => `<option value="${escapeHtml(variation.id)}">${escapeHtml(variation.name)}</option>`)
            .join("");
          if (plannedVariationId && variations.some((variation) => variation.id === plannedVariationId)) {
            desktopVariationSelect.value = plannedVariationId;
          }
        };
        const savedDesktopForm = loadDesktopLogForm();
        populateDesktopExercises({ preferredExerciseId: savedDesktopForm.exerciseId, preserveCurrent: true });
        if (savedDesktopForm.variationId && [...(desktopVariationSelect?.options || [])].some((option) => option.value === savedDesktopForm.variationId)) {
          desktopVariationSelect.value = savedDesktopForm.variationId;
        }
        desktopDaySelect?.addEventListener("change", () => {
          saveDesktopLogForm({
            ...loadDesktopLogForm(),
            dayValue: desktopDaySelect.value || "",
            exerciseId: "",
            variationId: "",
          });
          populateDesktopExercises();
        });
        desktopExerciseSelect?.addEventListener("change", () => {
          populateDesktopVariations();
          saveDesktopLogForm({
            ...loadDesktopLogForm(),
            exerciseId: desktopExerciseSelect.value || "",
            variationId: desktopVariationSelect?.value || "",
          });
        });
        desktopVariationSelect?.addEventListener("change", () => {
          saveDesktopLogForm({ ...loadDesktopLogForm(), variationId: desktopVariationSelect.value || "" });
        });
        const desktopBodyDateInput = document.getElementById("desktop-bodydate-input");
        setDefaultDateTimeInput("desktop-setdate-input", { maxNow: true });
        setDefaultDateTimeInput("desktop-bodydate-input");

        document.getElementById("desktop-log-button")?.addEventListener("click", async () => {
          const button = document.getElementById("desktop-log-button");
          if (button?.disabled) return;
          const exerciseId = document.getElementById("desktop-exercise-select")?.value;
          const variationId = document.getElementById("desktop-variation-select")?.value;
          const reps = Number(document.getElementById("desktop-reps-input")?.value || 0);
          const weight = Number(document.getElementById("desktop-weight-input")?.value || 0);
          const dayValue = document.getElementById("desktop-day-select")?.value || "";
          const dateValue = document.getElementById("desktop-setdate-input")?.value || "";
          const loggedAtDate = new Date(dateValue);
          if (!exerciseId || !variationId || reps <= 0) {
            status.textContent = "Choose an exercise/variation and enter reps before logging.";
            return;
          }
          if (!dateValue || !Number.isFinite(loggedAtDate.getTime())) {
            status.textContent = "Choose a valid workout date/time.";
            return;
          }
          if (loggedAtDate.getTime() > Date.now() + 60 * 1000) {
            status.textContent = "Workout date/time cannot be in the future.";
            return;
          }
          if (button) {
            button.disabled = true;
            button.textContent = "Saving...";
          }
          saveDesktopLogForm({ dayValue, exerciseId, variationId, reps, weight });
          desktopSetDateValue = dateValue;

          const desktopTables = loadDesktopLogTables();
          const now = new Date().toISOString();
          const loggedAt = loggedAtDate.toISOString();
          const dayIndex = dayValue ? Number(dayValue) : null;
          const mode = dayIndex ? "planned" : "freestyle";
          const sessionKey = `${mode}:${dayIndex ?? "free"}:${localIsoDate(loggedAt)}`;
          let session = (desktopTables.workout_session || []).find((row) => row.desktop_session_key === sessionKey)
            || (summary.tables?.workout_session || []).find((row) => row.desktop_session_key === sessionKey);
          const workoutDay = (summary.tables?.workout_day || []).find((day) => number(day.day_index) === dayIndex);
          const activePlan = (summary.tables?.workout_plan || [])[0] || null;
          const activeAssignment = (summary.tables?.plan_assignment || []).find((assignment) => assignment.workout_plan_id === activePlan?.id) || null;
          if (!session) {
            session = {
              id: makeDesktopId("session"),
              desktop_session_key: sessionKey,
              workout_plan_id: mode === "planned" ? activePlan?.id || null : null,
              workout_day_id: mode === "planned" ? workoutDay?.id || null : null,
              plan_assignment_id: mode === "planned" ? activeAssignment?.id || null : null,
              day_index: dayIndex,
              mode,
              started_at: loggedAt,
              created_at: now,
              updated_at: now,
            };
          }
          if (!(desktopTables.workout_session || []).some((row) => row.id === session.id)) {
            desktopTables.workout_session = [...(desktopTables.workout_session || []), session];
          }

          desktopTables.lift_set = [
            ...(desktopTables.lift_set || []),
            {
              id: makeDesktopId("set"),
              workout_session_id: session.id,
              day_index: dayIndex,
              exercise_id: exerciseId,
              variation_id: variationId,
              reps,
              weight,
              weight_unit: "kg",
              logged_at: loggedAt,
              created_at: now,
              updated_at: now,
            },
          ];
          await saveDesktopTablesToMac(
            desktopTables,
            `Logged ${reps} x ${weight} kg ${exerciseName(exerciseId)} for ${formatDateTime(loggedAt)} on desktop.`,
          );
        });

        document.getElementById("desktop-log-weight-button")?.addEventListener("click", async () => {
          const button = document.getElementById("desktop-log-weight-button");
          if (button?.disabled) return;
          const bodyWeight = Number(document.getElementById("desktop-bodyweight-input")?.value || 0);
          const bodyFatValue = document.getElementById("desktop-bodyfat-input")?.value || "";
          const bodyFat = bodyFatValue === "" ? null : Number(bodyFatValue);
          const dateValue = document.getElementById("desktop-bodydate-input")?.value || "";
          if (!plausibleBodyWeight(bodyWeight) || (bodyFat !== null && !Number.isFinite(bodyFat))) {
            status.textContent = `Enter a plausible bodyweight in kg (${minPlausibleBodyweightKg}-${maxPlausibleBodyweightKg}). Put body fat in the body fat field.`;
            return;
          }
          if (button) {
            button.disabled = true;
            button.textContent = "Saving...";
          }
          const measuredAt = dateValue ? new Date(dateValue).toISOString() : new Date().toISOString();
          const now = new Date().toISOString();
          const desktopTables = loadDesktopLogTables();
          desktopTables.body_metric_entry = [
            ...(desktopTables.body_metric_entry || []),
            {
              id: makeDesktopId("bodymetric"),
              measured_at: measuredAt,
              body_weight: bodyWeight,
              body_fat: bodyFat,
              source: "desktop-log",
              created_at: now,
              updated_at: now,
            },
          ];
          await saveDesktopTablesToMac(desktopTables, `Logged bodyweight ${formatNumber(bodyWeight, 1)} kg on desktop.`);
        });

        document.querySelectorAll("[data-desktop-delete-set]").forEach((button) => {
          button.addEventListener("click", () => {
            const setId = button.getAttribute("data-desktop-delete-set");
            const desktopTables = loadDesktopLogTables();
            const removedSet = (desktopTables.lift_set || []).find((set) => set.id === setId);
            desktopTables.lift_set = (desktopTables.lift_set || []).filter((set) => set.id !== setId);
            const sessionIdsWithSets = new Set((desktopTables.lift_set || []).map((set) => set.workout_session_id));
            desktopTables.workout_session = (desktopTables.workout_session || []).filter((session) => sessionIdsWithSets.has(session.id));
            saveDesktopLogTables(desktopTables);
            status.textContent = removedSet
              ? `Deleted desktop set: ${formatNumber(removedSet.reps, 0)} x ${formatNumber(removedSet.weight, 1)} kg ${exerciseName(removedSet.exercise_id)}.`
              : "Desktop set was already gone.";
            render(currentImport);
          });
        });

        document.querySelectorAll("[data-mac-delete-set]").forEach((button) => {
          button.addEventListener("click", async () => {
            const setId = button.getAttribute("data-mac-delete-set");
            const set = (summary.tables?.lift_set || []).find((row) => row.id === setId);
            const rowElement = button.closest("tr");
            if (button.disabled) return;
            button.disabled = true;
            button.textContent = "Deleting...";
            const deleted = await deleteMacRow(
              "lift_set",
              setId,
              set
                ? `Deleted saved set: ${formatNumber(set.reps, 0)} x ${formatNumber(set.weight, 1)} kg ${exerciseName(set.exercise_id)}.`
                : "Deleted saved set.",
            );
            if (deleted) rowElement?.remove();
          });
        });

        document.querySelectorAll("[data-desktop-delete-weight]").forEach((button) => {
          button.addEventListener("click", () => {
            const entryId = button.getAttribute("data-desktop-delete-weight");
            const desktopTables = loadDesktopLogTables();
            const removedEntry = (desktopTables.body_metric_entry || []).find((entry) => entry.id === entryId);
            desktopTables.body_metric_entry = (desktopTables.body_metric_entry || []).filter((entry) => entry.id !== entryId);
            saveDesktopLogTables(desktopTables);
            status.textContent = removedEntry
              ? `Deleted desktop weight: ${formatNumber(removedEntry.body_weight, 1)} kg.`
              : "Desktop weight was already gone.";
            render(currentImport);
          });
        });

        document.getElementById("desktop-download-button")?.addEventListener("click", () => {
          downloadJson("lift-track-vis-backup.json", desktopLogBackup());
        });

        document.getElementById("desktop-rescue-origin-button")?.addEventListener("click", () => {
          const alternateHost = window.location.hostname === "localhost" ? "127.0.0.1" : "localhost";
          const rescueUrl = `${window.location.protocol}//${alternateHost}:${window.location.port || "5175"}${window.location.pathname}?local-storage-export=1`;
          const popup = window.open(rescueUrl, "lifting-tracker-draft-rescue", "popup,width=520,height=360");
          status.textContent = popup
            ? `Looking for a browser draft on ${alternateHost}...`
            : `Popup blocked. Open ${rescueUrl} manually, then return here.`;
        });

        document.getElementById("desktop-clear-button")?.addEventListener("click", () => {
          saveDesktopLogTables({ workout_session: [], lift_set: [], body_metric_entry: [], body_measurement_entry: [] });
          status.textContent = "Cleared desktop logging draft.";
          render(currentImport);
        });

        status.textContent = `Loaded export from ${summary.exportedAt}`;
      }

      fileInput.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const text = await file.text();
        const imported = JSON.parse(text);
        applyImportedSettings(asTables(imported), true);
        saveVisualizerSettings();
        render(mergeImportIntoStoredDataset(imported, file.name));
      });

      async function fetchJsonOrThrow(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`${response.status} ${response.statusText}`.trim());
        }
        return response.json();
      }

      async function refreshTrackerAddresses() {
        const fallbackBase = window.location.origin === "null" ? desktopApiBase : window.location.origin;
        let desktopUrl = `${fallbackBase.replace(/\/$/, "")}/`;
        let phoneUrl = `${fallbackBase.replace(/\/$/, "")}/phone/`;
        try {
          const trackerStatus = await fetchJsonOrThrow(`${desktopApiBase}/api/status?cacheBust=${Date.now()}`);
          desktopUrl = trackerStatus.access?.baseUrl || desktopUrl;
          phoneUrl = trackerStatus.access?.phoneUrl || phoneUrl;
        } catch {
          // Keep showing the address used to load this page if status cannot be refreshed.
        }
        trackerDesktopUrl.href = desktopUrl;
        trackerDesktopUrl.textContent = desktopUrl;
        trackerPhoneUrl.href = phoneUrl;
        trackerPhoneUrl.textContent = phoneUrl;
      }

      async function loadMacGroundTruthExport() {
        const cacheBust = Date.now();
        const attempts = [
          {
            label: "Mac autosave API",
            fileName: "mac-autosave-api.full-backup.json",
            url: `${desktopApiBase}/api/export?cacheBust=${cacheBust}`,
          },
          {
            label: "local JSON export",
            fileName: "most-recent.full-backup.json",
            url: `../data/imports/most-recent.full-backup.json?cacheBust=${cacheBust}`,
          },
        ];
        const errors = [];
        for (const attempt of attempts) {
          try {
            const imported = await fetchJsonOrThrow(attempt.url);
            return { imported, source: attempt };
          } catch (error) {
            errors.push(`${attempt.label}: ${error.message}`);
          }
        }
        throw new Error(errors.join("; "));
      }

      async function importMostRecentExport() {
        status.textContent = "Loading Mac ground-truth backup...";
        const { imported, source } = await loadMacGroundTruthExport();
        applyImportedSettings(asTables(imported), true);
        saveVisualizerSettings();
        const merged = mergeImportIntoStoredDataset(imported, source.fileName, { replace: true });
        render(merged);
        flushDesktopDraftToMac().catch(() => {});
        return merged;
      }

      sexSelect.addEventListener("change", () => {
        if (currentImport) render(currentImport);
      });

      weekStartSelect.addEventListener("change", () => {
        saveVisualizerSettings();
        if (currentImport) render(currentImport);
      });

      periodSelect.addEventListener("change", () => {
        saveVisualizerSettings();
        if (currentImport) render(currentImport);
      });

      sampleButton.addEventListener("click", async () => {
        await importMostRecentExport();
      });

      pageNav.addEventListener("click", (event) => {
        const button = event.target.closest("[data-page]");
        if (!button) return;
        currentPage = button.dataset.page;
        pageNav.querySelectorAll("[data-page]").forEach((item) => item.classList.toggle("active", item.dataset.page === currentPage));
        if (currentImport) render(currentImport);
      });

      applyImportedSettings({}, false);
      renderFreshness();
      refreshTrackerAddresses();
      importMostRecentExport().catch((error) => {
        const storedDataset = loadStoredDataset();
        if (storedDataset) {
          render(storedDataset);
          status.textContent = `Loaded this browser's cached data. Mac backup unavailable: ${error.message}`;
        } else {
          root.innerHTML = `
            <section class="card">
              <h2>Mac backup not loaded</h2>
              <p class="muted">No browser cache exists here, and the Mac ground-truth backup could not be reached.</p>
              <p class="muted">Run <code>workout</code>, then open <code>http://127.0.0.1:5175/</code>. Your saved data lives in <code>data/mac/lifting-tracker.sqlite</code>, not in this browser tab.</p>
            </section>
          `;
          status.textContent = `Mac backup unavailable: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
