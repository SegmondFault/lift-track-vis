<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lift-track-vis</title>
    <style>
      :root {
        color: #eef5ee;
        background: #101612;
        color-scheme: dark;
        --page: #101612;
        --surface: #172019;
        --surface-raised: #1d281f;
        --surface-soft: #243027;
        --border: #344238;
        --border-soft: #2a342d;
        --text: #eef5ee;
        --muted: #a9b6aa;
        --muted-strong: #c5d0c6;
        --green: #72c69a;
        --green-strong: #4faa78;
        --amber: #e4b464;
        --red: #ef8b7d;
        --blue: #7fa8ef;
        --button: #3f9a70;
        --button-text: #07100b;
        --secondary: #26342b;
        --secondary-text: #eaf3ec;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 20% -10%, rgba(79, 170, 120, 0.14), transparent 32rem),
          radial-gradient(circle at 100% 0%, rgba(127, 168, 239, 0.1), transparent 34rem),
          var(--page);
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 18px 56px;
      }

      header {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 24px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 4rem);
        line-height: 0.96;
      }

      .tracker-addresses {
        display: grid;
        gap: 7px;
        margin-top: 16px;
      }

      .tracker-address {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
      }

      .tracker-address strong {
        min-width: 78px;
        color: var(--muted-strong);
      }

      .tracker-address a {
        color: var(--green);
        font-size: clamp(1rem, 2vw, 1.18rem);
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      h2 {
        font-size: 1.15rem;
      }

      h3 {
        font-size: 0.95rem;
      }

      .toolbar,
      .panel,
      .metric-card,
      .table-wrap {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: color-mix(in srgb, var(--surface) 94%, black);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.18);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 12px;
      }

      input[type="file"] {
        max-width: 100%;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: var(--button);
        color: var(--button-text);
        cursor: pointer;
        font-weight: 800;
        padding: 11px 14px;
      }

      button.secondary {
        background: var(--secondary);
        color: var(--secondary-text);
      }

      button.nav-button {
        background: var(--secondary);
        color: var(--secondary-text);
      }

      button.nav-button.active {
        background: var(--button);
        color: var(--button-text);
      }

      input,
      select,
      textarea {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #111812;
        color: var(--text);
        padding: 8px 9px;
      }

      textarea {
        width: 100%;
        min-height: 180px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 0.86rem;
        line-height: 1.45;
      }

      .page-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .workspace-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--border-soft);
      }

      button.workspace-nav-button {
        background: transparent;
        color: var(--muted-strong);
        border: 1px solid var(--border);
      }

      button.workspace-nav-button.active {
        background: var(--button);
        border-color: var(--button);
        color: var(--button-text);
      }

      .experimental-notice {
        margin-top: 14px;
        padding: 12px 14px;
        border: 1px solid color-mix(in srgb, var(--amber) 70%, var(--border));
        border-radius: 6px;
        background: rgba(228, 180, 100, 0.1);
        color: var(--muted-strong);
      }

      .experimental-notice strong {
        display: block;
        margin-bottom: 3px;
        color: var(--amber);
      }

      .import-controls {
        display: grid;
        gap: 14px;
      }

      .toggle-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
      }

      .input-grid {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }

      .input-grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field-label {
        display: grid;
        gap: 6px;
        font-weight: 700;
      }

      .field-label input,
      .field-label select {
        width: 100%;
      }

      .muted {
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 14px;
      }

      .metrics {
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        margin: 18px 0;
      }

      .metric-card {
        padding: 14px;
      }

      .metric-card.good {
        border-color: var(--green-strong);
        background: rgba(79, 170, 120, 0.12);
      }

      .metric-card.watch {
        border-color: var(--amber);
        background: rgba(228, 180, 100, 0.12);
      }

      .metric-card.bad {
        border-color: var(--red);
        background: rgba(239, 139, 125, 0.12);
      }

      .metric-card.danger {
        border-color: rgba(239, 139, 125, 0.8);
        background: rgba(91, 48, 45, 0.28);
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .pill {
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--muted-strong);
        font-size: 0.82rem;
        font-weight: 800;
        padding: 6px 9px;
      }

      .pill.good {
        background: rgba(114, 198, 154, 0.18);
        color: #bff2d3;
      }

      .pill.watch {
        background: rgba(228, 180, 100, 0.18);
        color: #f2d6a1;
      }

      .pill.bad {
        background: rgba(239, 139, 125, 0.18);
        color: #ffc2ba;
      }

      .metric-value {
        display: block;
        font-size: 1.9rem;
        font-weight: 900;
        margin-top: 8px;
      }

      .dashboard {
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      }

      @media (max-width: 680px) {
        .input-grid.two {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        padding: 16px;
      }

      .bar-list {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .bar-row {
        display: grid;
        gap: 6px;
      }

      .bar-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.9rem;
      }

      .bar-track {
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--surface-soft);
      }

      .bar-fill {
        height: 100%;
        border-radius: inherit;
        background: var(--green);
      }

      .standards-list {
        display: grid;
        gap: 16px;
        margin-top: 14px;
      }

      .standard-row {
        display: grid;
        grid-template-columns: minmax(120px, 190px) 1fr minmax(86px, auto);
        gap: 12px;
        align-items: center;
      }

      .standard-name {
        display: grid;
        gap: 3px;
      }

      .standard-track {
        position: relative;
        height: 18px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(36, 48, 39, 0.72);
      }

      .standard-fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(127, 168, 239, 0.4), rgba(114, 198, 154, 0.68));
      }

      .standard-band {
        position: absolute;
        top: 0;
        bottom: 0;
        border-right: 1px solid rgba(238, 245, 238, 0.2);
      }

      .standard-band.beginner {
        background: rgba(127, 168, 239, 0.22);
      }

      .standard-band.novice {
        background: rgba(114, 198, 154, 0.22);
      }

      .standard-band.intermediate {
        background: rgba(228, 180, 100, 0.22);
      }

      .standard-band.advanced {
        background: rgba(182, 156, 255, 0.22);
      }

      .standard-band.elite {
        background: rgba(239, 139, 125, 0.22);
      }

      .standard-tick {
        position: absolute;
        top: -5px;
        width: 2px;
        height: 28px;
        border-radius: 999px;
        background: var(--muted);
        opacity: 0.75;
        z-index: 3;
      }

      .standard-marker {
        position: absolute;
        top: -7px;
        width: 4px;
        height: 32px;
        border-radius: 999px;
        background: #eef5ee;
        box-shadow: 0 0 0 2px rgba(16, 22, 18, 0.8);
        z-index: 4;
      }

      .standard-value {
        text-align: right;
        font-weight: 900;
      }

      .volume-scale {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .volume-scale-track {
        display: grid;
        grid-template-columns: 30fr 30fr 40fr 40fr 30fr;
        min-height: 58px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-soft);
        position: relative;
      }

      .volume-band {
        display: flex;
        align-items: end;
        justify-content: center;
        padding: 8px 4px;
        border-right: 1px solid rgba(238, 245, 238, 0.12);
        color: var(--muted-strong);
        font-size: 0.75rem;
        font-weight: 800;
        text-align: center;
      }

      .volume-band:nth-child(1) {
        background: rgba(127, 168, 239, 0.12);
      }

      .volume-band:nth-child(2) {
        background: rgba(114, 198, 154, 0.13);
      }

      .volume-band:nth-child(3) {
        background: rgba(228, 180, 100, 0.13);
      }

      .volume-band:nth-child(4) {
        background: rgba(239, 139, 125, 0.14);
      }

      .volume-band:nth-child(5) {
        background: rgba(182, 156, 255, 0.13);
        border-right: 0;
      }

      .volume-marker {
        position: absolute;
        top: 5px;
        bottom: 5px;
        width: 4px;
        border-radius: 999px;
        background: #eef5ee;
        box-shadow: 0 0 0 2px rgba(16, 22, 18, 0.8);
      }

      .volume-marker-label {
        position: absolute;
        top: 6px;
        transform: translateX(-50%);
        color: var(--text);
        font-size: 0.72rem;
        font-weight: 900;
        white-space: nowrap;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      th,
      td {
        border-bottom: 1px solid var(--border-soft);
        padding: 9px 7px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .table-wrap {
        margin-top: 18px;
        overflow-x: auto;
      }

      .empty {
        padding: 18px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        color: var(--muted);
      }

      .freshness-panel {
        display: grid;
        gap: 6px;
        padding: 12px;
      }

      .freshness-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
      }

      .freshness-item strong {
        display: block;
        color: var(--text);
        font-size: 0.95rem;
      }

      .status-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 6px;
        border-radius: 999px;
        background: var(--green);
      }

      .status-dot.warn {
        background: var(--amber);
      }

      @media (max-width: 680px) {
        main {
          padding: 20px 12px 40px;
        }

        .dashboard {
          grid-template-columns: 1fr;
        }

        .standard-row {
          grid-template-columns: 1fr;
        }

        .standard-value {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="muted">Local read-only analytics</p>
          <h1>lift-track-vis</h1>
          <div class="tracker-addresses" aria-label="Private tracker addresses">
            <div class="tracker-address">
              <strong>Computer</strong>
              <a id="tracker-desktop-url" href="/">Checking private address…</a>
            </div>
            <div class="tracker-address">
              <strong>Phone</strong>
              <a id="tracker-phone-url" href="/phone/">Checking private address…</a>
            </div>
          </div>
        </div>
        <div id="import-controls-dock" hidden>
          <div id="import-controls" class="import-controls">
            <div class="toolbar">
              <input id="file-input" type="file" accept=".json,application/json" />
              <label class="muted" for="sex-select">Norms</label>
              <select id="sex-select">
                <option value="auto">Auto</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="unspecified">Unset</option>
              </select>
              <label class="muted" for="week-start-select">Week starts</label>
              <select id="week-start-select">
                <option value="monday">Monday</option>
              </select>
              <label class="muted" for="period-select">Period</label>
              <select id="period-select">
                <option value="all">All data</option>
                <option value="52">1 year</option>
                <option value="26">6 months</option>
                <option value="12">12 weeks</option>
              </select>
              <button id="sample-button" class="secondary" type="button">Import most recent</button>
              <span id="status" class="muted">Import full-backup.json from the phone export.</span>
            </div>
            <div id="freshness" class="panel freshness-panel"></div>
          </div>
        </div>
        <nav id="page-nav" class="page-nav" aria-label="Visualizer pages">
          <button class="nav-button active" type="button" data-page="overview">Overview</button>
          <button class="nav-button" type="button" data-page="log">Log</button>
          <button class="nav-button" type="button" data-page="week-compare">Week to week</button>
          <button class="nav-button" type="button" data-page="benchmarks">Benchmarks</button>
          <button class="nav-button" type="button" data-page="biometrics">Biometrics</button>
          <button class="nav-button" type="button" data-page="volume">Training volume</button>
          <button class="nav-button" type="button" data-page="settings">Settings</button>
        </nav>
      </header>

      <section id="root" class="empty">No export loaded yet.</section>
    </main>

    <script>
      const root = document.getElementById("root");
      const status = document.getElementById("status");
      const freshness = document.getElementById("freshness");
      const fileInput = document.getElementById("file-input");
      const sexSelect = document.getElementById("sex-select");
      const weekStartSelect = document.getElementById("week-start-select");
      const periodSelect = document.getElementById("period-select");
      const sampleButton = document.getElementById("sample-button");
      const pageNav = document.getElementById("page-nav");
      const importControlsDock = document.getElementById("import-controls-dock");
      const importControls = document.getElementById("import-controls");
      const trackerDesktopUrl = document.getElementById("tracker-desktop-url");
      const trackerPhoneUrl = document.getElementById("tracker-phone-url");
      let currentImport = null;
      let currentPage = "overview";
      let currentBiometricsSection = "measurements";
      let currentTrainingVolumeSection = "overview";
      let currentSettingsSection = "general";
      let normalizeBenchmarks = false;
      let benchmarkOverlayRange = "all";
      let desktopSetDateValue = "";
      let equipmentFactors = {};
      let profileOverrides = {};
      const importHistoryKey = "liftingTracker.importHistory.v1";
      const datasetKey = "liftingTracker.dataset.v1";
      const planEditorKey = "liftingTracker.planEditor.v1";
      const desktopLogKey = "liftingTracker.desktopLogTables.v1";
      const desktopLogFormKey = "liftingTracker.desktopLogForm.v1";
      const desktopSaveMessageKey = "liftingTracker.desktopSaveMessage.v1";
      const visualizerSettingsKey = "liftingTracker.visualizerSettings.v1";
      const desktopApiBase = window.location.protocol === "file:"
        ? "http://127.0.0.1:5175"
        : window.location.port === "5174"
          ? `${window.location.protocol}//${window.location.hostname}:5175`
          : window.location.origin;

      const exerciseNames = new Map();
      const variationNames = new Map();
      const exerciseTags = new Map();
      const defaultEquipmentFactors = {
        barbell: 1,
        dumbbell: 0.95,
        bodyweight: 1,
        cable: 0.75,
        machine: 0.65,
        unknown: 1,
      };
      const minPlausibleBodyweightKg = 35;
      const maxPlausibleBodyweightKg = 250;
      const athleteModelTypes = ["strength", "sprint", "endurance", "non-training-control"];
      const athleteModelTypeLabels = {
        strength: "Strength athlete",
        sprint: "Sprint athlete",
        endurance: "Endurance athlete",
        "non-training-control": "Non-training control",
      };
      const athleteModelTypeColors = {
        strength: "#72c69a",
        sprint: "#69c7d0",
        endurance: "#e4b464",
        "non-training-control": "#a9b6aa",
      };
      const defaultAthleteModelMix = {
        strength: 100,
        sprint: 0,
        endurance: 0,
        "non-training-control": 0,
      };
      const growthModelSourcePolicies = ["evidence-first hybrid", "strict evidence", "exploratory hybrid"];
      const growthModelSourcePolicyLabels = {
        "evidence-first hybrid": "Evidence-first hybrid",
        "strict evidence": "Strict evidence",
        "exploratory hybrid": "Exploratory hybrid",
      };
      const morphologyAdjustmentStrengthOptions = {
        off: { label: "Off", factor: 0, cap: 0 },
        mild: { label: "Mild", factor: 0.65, cap: 0.35 },
        moderate: { label: "Moderate", factor: 1, cap: 0.8 },
        strong: { label: "Strong", factor: 1.35, cap: 1.1 },
      };
      const biometricMeasurementTypes = [
        { id: "waist", label: "Waist", side: false },
        { id: "hip", label: "Hip", side: false },
        { id: "upper_arm", label: "Upper arm", side: true },
        { id: "chest_under_arms", label: "Chest under arms", side: false },
        { id: "neck", label: "Neck", side: false },
        { id: "calf", label: "Calf", side: true },
      ];
      const biometricMeasurementTypeLabels = Object.fromEntries(
        biometricMeasurementTypes.map((type) => [type.id, type.label]),
      );

      function number(value) {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function clamp(value, lower, upper) {
        const parsed = Number(value);
        if (!Number.isFinite(parsed)) return lower;
        return Math.max(lower, Math.min(upper, parsed));
      }

      function plausibleBodyWeight(value) {
        const parsed = Number(value);
        return Number.isFinite(parsed) && parsed >= minPlausibleBodyweightKg && parsed <= maxPlausibleBodyweightKg;
      }

      function validBodyMetricRows(tables) {
        return (tables.body_metric_entry || [])
          .filter((entry) => !entry.deleted_at && plausibleBodyWeight(entry.body_weight) && Number.isFinite(Date.parse(entry.measured_at)));
      }

      function formatNumber(value, digits = 0) {
        return new Intl.NumberFormat("en-GB", { maximumFractionDigits: digits }).format(value);
      }

      function dateFromIsoDay(value) {
        const text = String(value || "").slice(0, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) return null;
        return new Date(`${text}T12:00:00.000Z`);
      }

      function formatDate(value) {
        const date = dateFromIsoDay(value);
        if (!date) return "unknown";
        return new Intl.DateTimeFormat("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
          timeZone: "UTC",
        }).format(date);
      }

      function addDays(value, days) {
        const date = dateFromIsoDay(value);
        if (!date) return null;
        date.setUTCDate(date.getUTCDate() + days);
        return date.toISOString().slice(0, 10);
      }

      function formatWeekRange(week) {
        const end = addDays(week, 6);
        if (!end) return "unknown week";
        return `${formatDate(week)}-${formatDate(end)}`;
      }

      function formatPeriodRange(firstWeek, lastWeek) {
        const end = addDays(lastWeek, 6);
        if (!firstWeek || !end) return "unknown period";
        return `${formatDate(firstWeek)} to ${formatDate(end)}`;
      }

      function formatDateTime(value) {
        const parsed = Date.parse(value || "");
        if (!Number.isFinite(parsed)) return "unknown";
        return new Intl.DateTimeFormat("en-GB", {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(new Date(parsed));
      }

      function localIsoDate(value) {
        const parsed = value instanceof Date ? value.getTime() : Date.parse(value || "");
        if (!Number.isFinite(parsed)) return "";
        const parts = new Intl.DateTimeFormat("en-CA", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(new Date(parsed));
        const byType = Object.fromEntries(parts.map((part) => [part.type, part.value]));
        return `${byType.year}-${byType.month}-${byType.day}`;
      }

      function daysSince(value) {
        const parsed = Date.parse(value || "");
        if (!Number.isFinite(parsed)) return null;
        return (Date.now() - parsed) / (24 * 60 * 60 * 1000);
      }

      function loadImportHistory() {
        try {
          return JSON.parse(localStorage.getItem(importHistoryKey) || "[]");
        } catch {
          return [];
        }
      }

      function extractImportMetadata(imported, fileName = "sample") {
        const tables = imported.tables || {};
        const latestSetLoggedAt =
          imported.latestSetLoggedAt ||
          (tables.lift_set || [])
            .map((row) => row.logged_at)
            .filter(Boolean)
            .sort()
            .at(-1) ||
          null;

        return {
          exportId: imported.exportId || imported.generatedAt || imported.exportedAt || fileName,
          fileName,
          exportedAt: imported.exportedAt || imported.generatedAt || imported.createdOnDeviceAt || null,
          importedAt: new Date().toISOString(),
          latestSetLoggedAt,
          setCount: (tables.lift_set || []).filter((set) => !set.deleted_at).length ||
            (imported.sessions || []).reduce((sum, session) => sum + number(session.completedSets), 0),
          schemaVersion: imported.schemaVersion || null,
        };
      }

      function rememberImport(imported, fileName) {
        const metadata = extractImportMetadata(imported, fileName);
        const nextHistory = [metadata, ...loadImportHistory().filter((item) => item.exportId !== metadata.exportId)].slice(0, 10);
        localStorage.setItem(importHistoryKey, JSON.stringify(nextHistory));
        renderFreshness(metadata, nextHistory);
        return metadata;
      }

      function loadStoredDataset() {
        try {
          return JSON.parse(localStorage.getItem(datasetKey) || "null");
        } catch {
          return null;
        }
      }

      function rowKey(tableName, row) {
        if (row.id !== undefined && row.id !== null && row.id !== "") return String(row.id);
        const stableParts = {
          workout_day_exercise: ["workout_day_id", "exercise_id", "variation_id", "sort_order"],
          exercise_muscle_contribution: ["variation_id", "muscle_group_id"],
          app_metadata: ["key"],
          strength_norm: ["source", "exercise_id", "sex", "bodyweight_min", "bodyweight_max", "level", "metric"],
          body_composition_norm: ["source", "cycle", "sex", "age_min", "age_max", "metric", "percentile"],
          body_composition_model: ["source", "cycle", "sex", "target", "model_type"],
          body_composition_reference: ["source", "cycle", "sex", "athlete_type", "age_min", "age_max", "metric"],
        }[tableName];

        if (stableParts) return stableParts.map((key) => row[key] ?? "").join("|");
        return JSON.stringify(row);
      }

      function mergeTables(baseTables = {}, incomingTables = {}) {
        const merged = {};
        const tableNames = new Set([...Object.keys(baseTables), ...Object.keys(incomingTables)]);

        for (const tableName of tableNames) {
          const byKey = new Map();
          for (const row of baseTables[tableName] || []) byKey.set(rowKey(tableName, row), row);
          for (const row of incomingTables[tableName] || []) byKey.set(rowKey(tableName, row), row);
          merged[tableName] = [...byKey.values()];
        }

        return merged;
      }

      function liftingTrackerLocalStorageItems() {
        const items = {};
        for (const key of Object.keys(localStorage)) {
          if (key.startsWith("liftingTracker.")) items[key] = localStorage.getItem(key);
        }
        return items;
      }

      function maybeSendLocalStorageExport() {
        const params = new URLSearchParams(window.location.search);
        if (!params.has("local-storage-export")) return false;
        const payload = {
          type: "liftingTracker.localStorageExport",
          sourceOrigin: window.location.origin,
          items: liftingTrackerLocalStorageItems(),
        };
        if (window.opener) window.opener.postMessage(payload, "*");
        document.body.innerHTML = `
          <main style="font-family: system-ui, sans-serif; padding: 32px;">
            <h1>Workout draft export sent</h1>
            <p>You can close this tab/window and return to the visualizer.</p>
          </main>
        `;
        return true;
      }
      const isLocalStorageExportMode = maybeSendLocalStorageExport();

      function tableCounts(tables = {}) {
        return Object.fromEntries(Object.entries(tables).map(([name, rows]) => [name, rows.length]));
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function planTemplateFromTables(tables = {}, planId = null) {
        const plan = (tables.workout_plan || []).find((row) => !planId || row.id === planId) || (tables.workout_plan || [])[0] || null;
        const days = (tables.workout_day || [])
          .filter((day) => day.workout_plan_id === plan?.id)
          .sort((a, b) => number(a.day_index) - number(b.day_index));
        const targetsByDay = new Map();
        for (const target of tables.workout_day_exercise || []) {
          targetsByDay.set(target.workout_day_id, [...(targetsByDay.get(target.workout_day_id) || []), target]);
        }
        return {
          planId: plan?.id || "training-regime-2026",
          planName: plan?.name || "Workout Plan",
          days: days.map((day) => ({
            id: day.id,
            dayIndex: number(day.day_index),
            name: day.name || `Day ${number(day.day_index)}`,
            exercises: (targetsByDay.get(day.id) || [])
              .slice()
              .sort((a, b) => number(a.sort_order) - number(b.sort_order))
              .map((target) => ({
                sourceName: target.source_name || exerciseName(target.exercise_id),
                exerciseId: target.exercise_id,
                variationId: target.variation_id,
                targetSets: number(target.target_sets),
                sortOrder: number(target.sort_order),
              })),
          })),
        };
      }

      function planDraftFromTables(tables = {}) {
        const importedPlan = (tables.workout_plan || [])[0] || { id: "training-regime-2026", name: "Workout Plan" };
        const planTemplate = planTemplateFromTables(tables, importedPlan.id);
        const planVersions = tables.workout_plan_version?.length
          ? tables.workout_plan_version
          : [
              {
                id: "custom-full-body-2026-v1",
                workout_plan_id: importedPlan.id,
                version_name: "v1",
                name: "Workout Plan v1",
                status: "active",
                created_at: new Date().toISOString(),
                notes: "Initial Mac-side version wrapper around the existing five-day plan.",
              },
            ];
        return {
          schemaVersion: 1,
          updatedAt: new Date().toISOString(),
          plans: [
            {
              id: importedPlan.id,
              name: importedPlan.name || "Workout Plan",
              currentVersionId: importedPlan.current_version_id || planVersions[0]?.id || "custom-full-body-2026-v1",
              notes: importedPlan.notes || "Phone uses this as logging context; actual lift sets remain the source of truth.",
            },
          ],
          planVersions,
          weekOverrides: tables.plan_week_override?.length ? tables.plan_week_override : [],
          planTemplate,
        };
      }

      function loadPlanDraft(tables = {}) {
        try {
          const stored = JSON.parse(localStorage.getItem(planEditorKey) || "null");
          if (stored?.schemaVersion) return stored;
        } catch {}
        return planDraftFromTables(tables);
      }

      function applyStoredPlanDraftToTables(tables = {}) {
        let stored = null;
        try {
          stored = JSON.parse(localStorage.getItem(planEditorKey) || "null");
        } catch {}
        if (!stored?.schemaVersion) return tables;

        const next = { ...tables };
        const planById = new Map((stored.plans || []).map((plan) => [plan.id, plan]));
        next.workout_plan = (tables.workout_plan || []).map((plan) => {
          const override = planById.get(plan.id);
          return override
            ? {
                ...plan,
                name: override.name || plan.name,
                notes: override.notes || plan.notes,
                current_version_id: override.currentVersionId || plan.current_version_id,
              }
            : plan;
        });
        next.workout_plan_version = stored.planVersions || tables.workout_plan_version || [];
        next.plan_week_override = stored.weekOverrides || tables.plan_week_override || [];
        return next;
      }

      function savePlanDraft(draft) {
        const next = { ...draft, updatedAt: new Date().toISOString() };
        localStorage.setItem(planEditorKey, JSON.stringify(next));
        return next;
      }

      function downloadJson(fileName, value) {
        const blob = new Blob([JSON.stringify(value, null, 2) + "\n"], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function loadDesktopLogTables() {
        try {
          const stored = JSON.parse(localStorage.getItem(desktopLogKey) || "null");
          if (stored?.schemaVersion && stored.tables) return stored.tables;
        } catch {}
        return { workout_session: [], lift_set: [], body_metric_entry: [], body_measurement_entry: [] };

      function saveDesktopLogTables(tables) {

      function setDesktopSaveMessage(message, kind = "muted") {

      function loadDesktopSaveMessage() {

        } catch {

        }
      }

      function desktopLogBackup(tables = loadDesktopLogTables()) {
        const exportedAt = new Date().toISOString();
        const latestSetLoggedAt = (tables.lift_set || [])
          .map((set) => set.logged_at)
          .filter(Boolean)
          .sort()
          .at(-1) || null;
        return {
          schemaVersion: 2,
          exportId: `desktop-log-${exportedAt.replace(/[-:.TZ]/g, "").slice(0, 12)}`,
          exportedAt,
          createdOnDeviceAt: exportedAt,
          latestSetLoggedAt,
          format: "lifting-tracker-full-backup-json",
          notes: "Desktop visualizer logging backup. Merge into Mac ground truth with scripts/import-latest-phone-backup.sh.",
          tables,
        };
      }

      async function saveAppMetadataRowsToMac(rows, successMessage) {
        const exportedAt = new Date().toISOString();
        const backup = {
          schemaVersion: 2,
          exportId: `desktop-profile-${exportedAt.replace(/[-:.TZ]/g, "").slice(0, 12)}`,
          exportedAt,
          createdOnDeviceAt: exportedAt,
          latestSetLoggedAt: null,
          format: "lifting-tracker-full-backup-json",
          notes: "Desktop visualizer profile metadata update.",
          tables: { app_metadata: rows },
        };
        try {
          const response = await fetch(`${desktopApiBase}/api/desktop-log`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(backup),
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || !result.ok || !result.backup) {
            throw new Error(result.error || `HTTP ${response.status}`);
          }
          applyImportedSettings(asTables(result.backup), true);
          saveVisualizerSettings();
          const merged = mergeImportIntoStoredDataset(result.backup, "profile-settings", { replace: true });
          status.textContent = `${successMessage} Saved to Mac database.`;
          render(merged);
          return true;
        } catch (error) {
          status.textContent = `${successMessage} Saved locally only: ${error.message}. Run workout to persist it to the Mac database.`;
          return false;
        }
      }

      async function saveDesktopTablesToMac(tables, successMessage) {
        saveDesktopLogTables(tables);
        const backup = desktopLogBackup(tables);
        status.textContent = "Saving desktop log to Mac database...";
        setDesktopSaveMessage("Saving to Mac database...", "muted");

        try {
          const response = await fetch(`${desktopApiBase}/api/desktop-log`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(backup),
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || !result.ok || !result.backup) {
            throw new Error(result.error || `HTTP ${response.status}`);
          }

          applyImportedSettings(asTables(result.backup), true);
          saveVisualizerSettings();
          const merged = mergeImportIntoStoredDataset(result.backup, "desktop-autosave", { replace: true });
          saveDesktopLogTables({ workout_session: [], lift_set: [], body_metric_entry: [], body_measurement_entry: [] });
          status.textContent = `${successMessage} Saved to Mac database.`;
          setDesktopSaveMessage(`${successMessage} Saved to Mac database.`, "good");
          render(merged);
          return true;
        } catch (error) {
          status.textContent = `${successMessage} Saved as browser draft only: ${error.message}. Run workout so the desktop autosave API is available, then reload to retry.`;
          setDesktopSaveMessage(`${successMessage} Saved as browser draft only: ${error.message}.`, "watch");
          render(currentImport);
          return false;
        }
      }

      async function deleteMacRow(tableName, rowId, successMessage) {
        status.textContent = "Deleting saved row from Mac database...";
        setDesktopSaveMessage("Deleting saved row from Mac database...", "muted");
        try {
          const response = await fetch(`${desktopApiBase}/api/delete-row`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tableName, rowId }),
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || !result.ok || !result.backup) {
            throw new Error(result.error || `HTTP ${response.status}`);
          }
          applyImportedSettings(asTables(result.backup), true);
          saveVisualizerSettings();
          const merged = mergeImportIntoStoredDataset(result.backup, "desktop-delete", { replace: true });
          status.textContent = successMessage;
          setDesktopSaveMessage(successMessage, "good");
          render(merged);
          return true;
        } catch (error) {
          status.textContent = `Delete failed: ${error.message}`;
          setDesktopSaveMessage(`Delete failed: ${error.message}`, "watch");
          return false;
        }
      }

      async function flushDesktopDraftToMac() {
        const desktopTables = loadDesktopLogTables();
        if (!(desktopTables.workout_session?.length || desktopTables.lift_set?.length || desktopTables.body_metric_entry?.length || desktopTables.body_measurement_entry?.length)) return false;
        return saveDesktopTablesToMac(desktopTables, "Recovered pending desktop draft.");
      }

      function importBrowserDraftPayload(payload) {
        const rawDesktopTables = payload?.items?.[desktopLogKey];
        const rawDesktopForm = payload?.items?.[desktopLogFormKey];
        let importedTables = null;
        try {
          importedTables = rawDesktopTables ? JSON.parse(rawDesktopTables)?.tables : null;
        } catch {}
        if (!importedTables) {
          status.textContent = `No desktop draft found on ${payload?.sourceOrigin || "that origin"}.`;
          return;
        }
        const currentTables = loadDesktopLogTables();
        saveDesktopLogTables(mergeTables(currentTables, importedTables));
        if (rawDesktopForm && !localStorage.getItem(desktopLogFormKey)) {
          localStorage.setItem(desktopLogFormKey, rawDesktopForm);
        }
        status.textContent = `Imported browser draft from ${payload.sourceOrigin}: ${formatNumber((importedTables.lift_set || []).length, 0)} sets, ${formatNumber((importedTables.body_metric_entry || []).length, 0)} weights, ${formatNumber((importedTables.body_measurement_entry || []).length, 0)} measurements.`;
        flushDesktopDraftToMac().catch(() => {
          if (currentImport) render(currentImport);
        });
      }

      window.addEventListener("message", (event) => {
        if (event.data?.type !== "liftingTracker.localStorageExport") return;
        importBrowserDraftPayload(event.data);
      });

      function makeDesktopId(prefix) {
        return `${prefix}-desktop-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      }

      function mergeDesktopLogTables(tables = {}) {
        const desktopTables = loadDesktopLogTables();
        if (!(desktopTables.workout_session?.length || desktopTables.lift_set?.length || desktopTables.body_metric_entry?.length || desktopTables.body_measurement_entry?.length)) return tables;
        return mergeTables(tables, desktopTables);
      }

      function mergeImportIntoStoredDataset(imported, fileName, options = {}) {
        const incomingTables = imported.tables || null;
        const metadata = rememberImport(imported, fileName);

        if (!incomingTables) {
          return imported;
        }

        const previous = options.replace
          ? {
              schemaVersion: imported.schemaVersion || 1,
              exportedAt: imported.exportedAt || imported.generatedAt || metadata.exportedAt,
              imports: [],
              tables: {},
            }
          : loadStoredDataset() || {
          schemaVersion: imported.schemaVersion || 1,
          exportedAt: imported.exportedAt || imported.generatedAt || metadata.exportedAt,
          imports: [],
          tables: {},
        };
        const mergedTables = mergeTables(previous.tables, incomingTables);
        const nextDataset = {
          schemaVersion: imported.schemaVersion || previous.schemaVersion || 1,
          exportId: "mac-merged-readonly",
          exportedAt: imported.exportedAt || imported.generatedAt || previous.exportedAt || metadata.exportedAt,
          latestSetLoggedAt: metadata.latestSetLoggedAt || previous.latestSetLoggedAt || null,
          imports: [metadata, ...(previous.imports || []).filter((item) => item.exportId !== metadata.exportId)].slice(0, 25),
          tables: mergedTables,
          tableCounts: tableCounts(mergedTables),
        };

        try {
          localStorage.setItem(datasetKey, JSON.stringify(nextDataset));
        } catch (error) {
          status.textContent = "Import loaded, but the browser cache is full. The current view is still usable.";
          return imported;
        }

        return nextDataset;
      }

      function renderFreshness(current = null, history = loadImportHistory()) {
        const latest = current || history[0] || null;

        if (!latest) {
          freshness.innerHTML = `
            <div class="bar-label"><strong><span class="status-dot warn"></span>No Mac import yet</strong></div>
            <p class="muted">Import a phone export to start freshness tracking.</p>
          `;
          return;
        }

        const exportAge = daysSince(latest.exportedAt);
        const latestSetAge = daysSince(latest.latestSetLoggedAt);
        const stale = (exportAge !== null && exportAge > 7) || (latestSetAge !== null && latestSetAge > 7);

        freshness.innerHTML = `
          <div class="bar-label"><strong><span class="status-dot ${stale ? "warn" : ""}"></span>${stale ? "Import may be stale" : "Import looks current"}</strong><span class="muted">${history.length} import${history.length === 1 ? "" : "s"} remembered</span></div>
          <div class="freshness-grid">
            <div class="freshness-item"><span class="muted">Mac imported</span><strong>${formatDateTime(latest.importedAt)}</strong></div>
            <div class="freshness-item"><span class="muted">Phone exported</span><strong>${formatDateTime(latest.exportedAt)}</strong></div>
            <div class="freshness-item"><span class="muted">Latest set in export</span><strong>${formatDateTime(latest.latestSetLoggedAt)}</strong></div>
            <div class="freshness-item"><span class="muted">File</span><strong>${latest.fileName}</strong></div>
          </div>
        `;
      }

      function safeJson(value, fallback) {
        if (!value) return fallback;
        try {
          return JSON.parse(value);
        } catch {
          return fallback;
        }
      }

      function structuredValue(value, fallback) {
        if (value === null || value === undefined || value === "") return fallback;
        if (typeof value === "object") return value;
        return safeJson(value, fallback);
      }

      function normalizeAthleteModelMix(value = null, fallbackType = "strength") {
        const raw = structuredValue(value, null);
        const fallback = athleteModelTypes.includes(fallbackType) ? fallbackType : "strength";
        const normalized = Object.fromEntries(
          athleteModelTypes.map((type) => {
            const parsed = Number(raw?.[type]);
            const clamped = Number.isFinite(parsed) ? Math.max(0, Math.min(100, parsed)) : 0;
            return [type, Math.round(clamped * 10) / 10];
          }),
        );
        const total = Object.values(normalized).reduce((sum, item) => sum + item, 0);
        if (total <= 0) normalized[fallback] = 100;
        return normalized;
      }

      function athleteModelMixTotal(mix) {
        return athleteModelTypes.reduce((sum, type) => sum + Number(mix?.[type] || 0), 0);
      }

      function athleteModelMixFractions(mix) {
        const normalized = normalizeAthleteModelMix(mix);
        const total = athleteModelMixTotal(normalized) || 1;
        return Object.fromEntries(athleteModelTypes.map((type) => [type, normalized[type] / total]));
      }

      function dominantAthleteModelType(mix, fallback = "strength") {
        const normalized = normalizeAthleteModelMix(mix, fallback);
        return athleteModelTypes
          .slice()
          .sort((a, b) => normalized[b] - normalized[a] || athleteModelTypes.indexOf(a) - athleteModelTypes.indexOf(b))[0];
      }

      function athleteModelMixLabel(mix) {
        const normalized = normalizeAthleteModelMix(mix);
        return athleteModelTypes
          .filter((type) => normalized[type] > 0)
          .map((type) => `${athleteModelLabel(type).replace(" athlete", "")} ${formatNumber(normalized[type], 0)}%`)
          .join(" / ");
      }

      function normalizeEquipmentFactors(value = {}) {
        return Object.fromEntries(
          Object.entries(defaultEquipmentFactors).map(([key, fallback]) => {
            const parsed = Number(value[key]);
            return [key, Number.isFinite(parsed) && parsed >= 0 ? parsed : fallback];
          }),
        );
      }

      function normalizeProfileOverrides(value = {}) {
        const profile = value && typeof value === "object" ? value : {};
        const dob = String(profile.user_date_of_birth || "").slice(0, 10);
        const sex = ["male", "female", "unspecified"].includes(profile.user_sex) ? profile.user_sex : "";
        const height = Number(profile.user_height_cm);
        const athleteModelType = athleteModelTypes.includes(profile.user_athlete_model_type) ? profile.user_athlete_model_type : "";
        const hasAthleteModelMix = profile.user_athlete_model_mix !== undefined && profile.user_athlete_model_mix !== null && profile.user_athlete_model_mix !== "";
        const athleteModelMix = hasAthleteModelMix || athleteModelType
          ? normalizeAthleteModelMix(profile.user_athlete_model_mix, athleteModelType || "strength")
          : null;
        const trainingStartedAt = String(profile.user_resistance_training_started_at || "").slice(0, 10);
        const priorBackgroundCreditMonths = Number(
          profile.user_prior_background_credit_months ?? profile.user_prior_training_credit_months,
        );
        const growthPolicy = growthModelSourcePolicies.includes(profile.user_growth_model_source_policy)
          ? profile.user_growth_model_source_policy
          : "";
        const morphologyStrength = Object.prototype.hasOwnProperty.call(
          morphologyAdjustmentStrengthOptions,
          profile.user_morphology_adjustment_strength,
        )
          ? profile.user_morphology_adjustment_strength
          : "";
        const normalized = {};
        if (/^\d{4}-\d{2}-\d{2}$/.test(dob)) normalized.user_date_of_birth = dob;
        if (sex) normalized.user_sex = sex;
        if (Number.isFinite(height) && height >= 120 && height <= 230) normalized.user_height_cm = String(height);
        if (athleteModelMix) {
          normalized.user_athlete_model_mix = athleteModelMix;
          normalized.user_athlete_model_type = athleteModelType || dominantAthleteModelType(athleteModelMix);
        }
        if (/^\d{4}-\d{2}-\d{2}$/.test(trainingStartedAt)) normalized.user_resistance_training_started_at = trainingStartedAt;
        if (Number.isFinite(priorBackgroundCreditMonths) && priorBackgroundCreditMonths >= 0 && priorBackgroundCreditMonths <= 240) {
          normalized.user_prior_background_credit_months = String(Math.round(priorBackgroundCreditMonths));
        }
        if (growthPolicy) normalized.user_growth_model_source_policy = growthPolicy;
        if (morphologyStrength) normalized.user_morphology_adjustment_strength = morphologyStrength;
        return normalized;
      }

      function metadataValue(tables, key, fallback = null) {
        if (profileOverrides[key] !== undefined && profileOverrides[key] !== null && profileOverrides[key] !== "") {
          return profileOverrides[key];
        }
        const row = (tables.app_metadata || []).find((item) => item.key === key && item.value !== undefined && item.value !== null);
        return row ? row.value : fallback;
      }

      function userProfile(tables = {}) {
        const sex = String(metadataValue(tables, "user_sex", "male") || "male").toLowerCase();
        const heightCm = Number(metadataValue(tables, "user_height_cm", 175));
        const dob = String(metadataValue(tables, "user_date_of_birth", "1990-01-01") || "1990-01-01").slice(0, 10);
        const athleteModelType = String(metadataValue(tables, "user_athlete_model_type", "strength") || "strength");
        const validAthleteModelType = athleteModelTypes.includes(athleteModelType) ? athleteModelType : "strength";
        const athleteModelMix = normalizeAthleteModelMix(metadataValue(tables, "user_athlete_model_mix", null), validAthleteModelType);
        const trainingStartedAt = String(metadataValue(tables, "user_resistance_training_started_at", "2024-01-01") || "2024-01-01").slice(0, 10);
        const priorBackgroundCreditMonths = Number(
          metadataValue(
            tables,
            "user_prior_background_credit_months",
            metadataValue(tables, "user_prior_training_credit_months", 0),
          ),
        );
        const growthPolicy = String(metadataValue(tables, "user_growth_model_source_policy", "evidence-first hybrid") || "evidence-first hybrid");
        const morphologyStrength = String(metadataValue(tables, "user_morphology_adjustment_strength", "moderate") || "moderate");
        return {
          sex: ["male", "female"].includes(sex) ? sex : "male",
          heightCm: Number.isFinite(heightCm) && heightCm >= 120 && heightCm <= 230 ? heightCm : 175,
          dob: /^\d{4}-\d{2}-\d{2}$/.test(dob) ? dob : "1990-01-01",
          athleteModelType: dominantAthleteModelType(athleteModelMix, validAthleteModelType),
          athleteModelMix,
          resistanceTrainingStartedAt: /^\d{4}-\d{2}-\d{2}$/.test(trainingStartedAt) ? trainingStartedAt : "2024-01-01",
          priorBackgroundCreditMonths: Number.isFinite(priorBackgroundCreditMonths)
            ? clamp(Math.round(priorBackgroundCreditMonths), 0, 240)
            : 0,
          growthModelSourcePolicy: growthModelSourcePolicies.includes(growthPolicy) ? growthPolicy : "evidence-first hybrid",
          morphologyAdjustmentStrength: Object.prototype.hasOwnProperty.call(morphologyAdjustmentStrengthOptions, morphologyStrength)
            ? morphologyStrength
            : "moderate",
        };
      }

      function ageAtDate(dob, atIso) {
        const birth = dateFromIsoDay(dob);
        const at = dateFromIsoDay(atIso);
        if (!birth || !at) return null;
        let age = at.getUTCFullYear() - birth.getUTCFullYear();
        const birthdayThisYear = new Date(Date.UTC(at.getUTCFullYear(), birth.getUTCMonth(), birth.getUTCDate(), 12));
        if (at < birthdayThisYear) age -= 1;
        const nextBirthday = new Date(Date.UTC(at.getUTCFullYear() + (at >= birthdayThisYear ? 1 : 0), birth.getUTCMonth(), birth.getUTCDate(), 12));
        const lastBirthday = new Date(Date.UTC(nextBirthday.getUTCFullYear() - 1, birth.getUTCMonth(), birth.getUTCDate(), 12));
        return age + (at - lastBirthday) / (nextBirthday - lastBirthday || 1);
      }

      function exerciseEquipmentType(exerciseId) {
        const tags = exerciseTags.get(exerciseId) || [];
        if (tags.includes("bodyweight")) return "bodyweight";
        if (tags.includes("cable")) return "cable";
        if (tags.includes("machine")) return "machine";
        if (tags.includes("barbell")) return "barbell";
        if (tags.includes("dumbbell")) return "dumbbell";
        const name = `${exerciseId} ${exerciseName(exerciseId)}`.toLowerCase();
        if (name.includes("pull-up") || name.includes("pullup") || name.includes("leg raise")) return "bodyweight";
        if (name.includes("cable") || name.includes("pushdown") || name.includes("face pull")) return "cable";
        if (
          name.includes("machine") ||
          name.includes("pec fly") ||
          name.includes("rear-delt-fly") ||
          name.includes("glute") ||
          name.includes("seated-row") ||
          name.includes("back-extension")
        )
          return "machine";
        if (name.includes("barbell")) return "barbell";
        if (name.includes("dumbbell") || name.includes("dumbel") || name.includes("hammer") || name.includes("curl") || name.includes("lateral")) return "dumbbell";
        if (name.includes("bench") || name.includes("overhead-press") || name.includes("squat") || name.includes("deadlift") || name.includes("landmine")) return "barbell";
        return "unknown";
      }

      function setLoadWeight(set) {
        const weight = number(set.weight);
        return exerciseEquipmentType(set.exercise_id) === "dumbbell" ? weight * 2 : weight;
      }

      function equipmentFactorForSet(set) {
        const type = exerciseEquipmentType(set.exercise_id);
        return number(equipmentFactors[type] ?? defaultEquipmentFactors[type] ?? 1);
      }

      function adjustedSetLoadWeight(set) {
        return setLoadWeight(set) * equipmentFactorForSet(set);
      }

      function rawSetVolume(set) {
        return number(set.reps) * setLoadWeight(set);
      }

      function e1rm(set) {
        return adjustedSetLoadWeight(set) * (1 + number(set.reps) / 30);
      }

      function adjustedSetVolume(set) {
        const raw = rawSetVolume(set);
        return raw * equipmentFactorForSet(set);
      }

      function loadVisualizerSettings() {
        try {
          return JSON.parse(localStorage.getItem(visualizerSettingsKey) || "{}");
        } catch {
          return {};
        }
      }

      function saveVisualizerSettings() {
        localStorage.setItem(
          visualizerSettingsKey,
          JSON.stringify({
            weekStart: weekStartSelect.value,
            period: periodSelect.value,
            normalizeBenchmarks,
            benchmarkOverlayRange,
            equipmentFactors,
            profileOverrides,
          }),
        );
      }

      function applyImportedSettings(tables, force = false) {
        const saved = loadVisualizerSettings();
        normalizeBenchmarks = Boolean(saved.normalizeBenchmarks);
        benchmarkOverlayRange = ["all", "3m"].includes(saved.benchmarkOverlayRange) ? saved.benchmarkOverlayRange : "all";
        equipmentFactors = normalizeEquipmentFactors(saved.equipmentFactors);
        profileOverrides = normalizeProfileOverrides(saved.profileOverrides);
        weekStartSelect.value = "monday";
        periodSelect.value = ["all", "52", "26", "12"].includes(saved.period) ? saved.period : "all";
      }

      function weekStartLabel() {
        return "Monday-Sunday";
      }

      function weekStart(value) {
        const parsed = Date.parse(value || "");
        if (!Number.isFinite(parsed)) return null;
        const date = new Date(parsed);
        const utc = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
        const day = utc.getUTCDay();
        const startDay = 1;
        const diff = (day - startDay + 7) % 7;
        utc.setUTCDate(utc.getUTCDate() - diff);
        return utc.toISOString().slice(0, 10);
      }

      function addWeek(week, amount) {
        const date = new Date(`${week}T00:00:00.000Z`);
        date.setUTCDate(date.getUTCDate() + amount * 7);
        return date.toISOString().slice(0, 10);
      }

      function weekRange(rows, key = "week") {
        const weeks = rows.map((row) => row[key]).filter(Boolean).sort();
        if (!weeks.length) return [];
        const out = [];
        for (let cursor = weeks[0]; cursor <= weeks[weeks.length - 1]; cursor = addWeek(cursor, 1)) {
          out.push(cursor);
        }
        return out;
      }

      function allWeeksBetween(startWeek, endWeek) {
        if (!startWeek || !endWeek) return [];
        const out = [];
        for (let cursor = startWeek; cursor <= endWeek; cursor = addWeek(cursor, 1)) out.push(cursor);
        return out;
      }

      function chartWeeksFor(summary, rows = []) {
        const rowWeeks = rows.map((row) => row.week).filter(Boolean);
        const summaryWeeks = (summary.allObservedWeeks || []).filter(Boolean);
        const allWeeks = [...new Set([...summaryWeeks, ...rowWeeks])].sort();
        if (!allWeeks.length) return [];

        const period = periodSelect.value;
        const endWeek = allWeeks.at(-1);
        if (period === "all") return allWeeksBetween(allWeeks[0], endWeek);

        const startWeek = addWeek(endWeek, -(Number(period) - 1));
        return allWeeksBetween(startWeek, endWeek);
      }

      function asTables(imported) {
        if (imported.tables) return imported.tables;

        if (Array.isArray(imported.sessions)) {
          const liftSets = [];
          const sessions = imported.sessions.map((session) => ({
            id: session.id,
            workout_plan_id: session.planId,
            workout_day_id: null,
            plan_assignment_id: null,
            day_index: session.planDayIndex,
            mode: "imported-summary",
            started_at: session.sourceDate || "",
          }));

          for (const session of imported.sessions) {
            for (const exercise of session.exercises || []) {
              for (const [index, set] of (exercise.sets || []).entries()) {
                liftSets.push({
                  id: `${session.id}-${exercise.exerciseId}-${index}`,
                  workout_session_id: session.id,
                  day_index: session.planDayIndex,
                  exercise_id: exercise.exerciseId,
                  variation_id: exercise.variationId,
                  reps: set.reps,
                  weight: set.weight,
                  weight_unit: set.weightUnit || "kg",
                  logged_at: session.sourceDate || "",
                });
              }
            }
          }

          return {
            workout_session: sessions,
            lift_set: liftSets,
            workout_day_exercise: imported.sessions.flatMap((session) =>
              (session.exercises || []).map((exercise, index) => ({
                workout_day_id: `day-${session.planDayIndex}`,
                exercise_id: exercise.exerciseId,
                variation_id: exercise.variationId,
                target_sets: exercise.targetSets,
                sort_order: index + 1,
                source_name: exercise.sourceName,
              })),
            ),
          };
        }

        return {};
      }

      function hydrateLookups(tables) {
        exerciseNames.clear();
        variationNames.clear();
        exerciseTags.clear();

        for (const exercise of tables.exercise || []) {
          exerciseNames.set(exercise.id, exercise.name);
          exerciseTags.set(exercise.id, safeJson(exercise.tags, []));
        }

        for (const variation of tables.exercise_variation || []) {
          variationNames.set(variation.id, variation.name);
        }
      }

      function exerciseName(id) {
        return exerciseNames.get(id) || id;
      }

      function variationName(id) {
        return variationNames.get(id) || id;
      }

      function interpolatedBodyWeight(tables, loggedAt) {
        const when = Date.parse(loggedAt || "");
        if (!Number.isFinite(when)) return null;

        const rows = validBodyMetricRows(tables)
          .filter((entry) => Date.parse(entry.measured_at) <= when)
          .sort((a, b) => Date.parse(a.measured_at) - Date.parse(b.measured_at));
        const allRows = validBodyMetricRows(tables)
          .sort((a, b) => Date.parse(a.measured_at) - Date.parse(b.measured_at));

        if (!allRows.length) return null;

        const previous = rows.at(-1);
        const next = allRows.find((entry) => Date.parse(entry.measured_at) >= when);

        if (!previous) return number(next.body_weight);
        if (!next) return number(previous.body_weight);

        const previousTime = Date.parse(previous.measured_at);
        const nextTime = Date.parse(next.measured_at);
        if (previousTime === nextTime) return number(previous.body_weight);

        const ratio = (when - previousTime) / (nextTime - previousTime);
        return number(previous.body_weight) + (number(next.body_weight) - number(previous.body_weight)) * ratio;
      }

      function latestBodyWeight(tables) {
        const rows = validBodyMetricRows(tables)
          .sort((a, b) => Date.parse(b.measured_at) - Date.parse(a.measured_at));

        return rows[0]?.body_weight ? number(rows[0].body_weight) : null;
      }

      function validBodyMeasurementRows(tables) {
        return (tables.body_measurement_entry || [])
          .filter(
            (entry) =>
              !entry.deleted_at &&
              Number.isFinite(Number(entry.value)) &&
              Number(entry.value) > 0 &&
              String(entry.unit || "cm").toLowerCase() === "cm" &&
              Number.isFinite(Date.parse(entry.measured_at)),
          )
          .map((entry) => ({
            ...entry,
            value: Number(entry.value),
          }))
          .sort((a, b) => Date.parse(a.measured_at) - Date.parse(b.measured_at));
      }

      function measurementTypeLabel(type) {
        return biometricMeasurementTypeLabels[type] || String(type || "measurement").replaceAll("_", " ");
      }

      function latestBodyMeasurementsByType(tables) {
        const latest = new Map();
        for (const row of validBodyMeasurementRows(tables)) {
          const current = latest.get(row.measurement_type);
          if (!current || Date.parse(row.measured_at) > Date.parse(current.measured_at)) {
            latest.set(row.measurement_type, row);
          }
        }
        return latest;
      }

      function sortedBodyMeasurements(tables, limit = null) {
        const rows = validBodyMeasurementRows(tables)
          .slice()
          .sort((a, b) => Date.parse(b.measured_at) - Date.parse(a.measured_at));
        return limit ? rows.slice(0, limit) : rows;
      }

      function interpolateBodyMeasurement(tables, measurementType, atIso) {
        const when = Date.parse(atIso || "");
        const rows = validBodyMeasurementRows(tables).filter((entry) => entry.measurement_type === measurementType);
        if (!rows.length || !Number.isFinite(when)) return null;
        const previous = rows.filter((entry) => Date.parse(entry.measured_at) <= when).at(-1);
        const next = rows.find((entry) => Date.parse(entry.measured_at) >= when);
        const nearest = rows
          .slice()
          .sort((a, b) => Math.abs(Date.parse(a.measured_at) - when) - Math.abs(Date.parse(b.measured_at) - when))[0];

        if (previous && next && previous.id !== next.id) {
          const previousTime = Date.parse(previous.measured_at);
          const nextTime = Date.parse(next.measured_at);
          const ratio = (when - previousTime) / (nextTime - previousTime || 1);
          const value = previous.value + (next.value - previous.value) * ratio;
          return {
            type: measurementType,
            value,
            status: "interpolated",
            source: `${formatDate(previous.measured_at)} to ${formatDate(next.measured_at)}`,
            measuredAt: null,
            direction: "bracketed",
            daysFromMeasurement: Math.min(Math.abs(when - previousTime), Math.abs(nextTime - when)) / 86400000,
            confidence: previous.confidence || next.confidence || "unknown",
          };
        }

        const source = previous || next || nearest;
        const sourceTime = Date.parse(source.measured_at);
        return {
          type: measurementType,
          value: source.value,
          status: Math.abs(sourceTime - when) < 86400000 ? "measured" : "carried",
          source: formatDate(source.measured_at),
          measuredAt: source.measured_at,
          direction: Math.abs(sourceTime - when) < 86400000 ? "same-day" : sourceTime > when ? "future" : "past",
          daysFromMeasurement: Math.abs(sourceTime - when) / 86400000,
          confidence: source.confidence || "unknown",
        };
      }

      function weeklyBodyMetricRows(tables) {
        const grouped = new Map();
        for (const entry of validBodyMetricRows(tables)) {
          const week = weekStart(entry.measured_at);
          if (!week) continue;
          const current = grouped.get(week) || { week, weights: [], bodyFats: [], measuredAt: entry.measured_at, sources: new Set() };
          current.weights.push(number(entry.body_weight));
          if (Number.isFinite(Number(entry.body_fat)) && Number(entry.body_fat) > 0) current.bodyFats.push(number(entry.body_fat));
          if (Date.parse(entry.measured_at) > Date.parse(current.measuredAt)) current.measuredAt = entry.measured_at;
          if (entry.source) current.sources.add(entry.source);
          grouped.set(week, current);
        }

        return [...grouped.values()]
          .map((row) => ({
            week: row.week,
            measuredAt: row.measuredAt,
            bodyWeight: row.weights.reduce((sum, value) => sum + value, 0) / row.weights.length,
            loggedBodyFat: row.bodyFats.length ? row.bodyFats.reduce((sum, value) => sum + value, 0) / row.bodyFats.length : null,
            source: [...row.sources].join(", "),
          }))
          .sort((a, b) => a.week.localeCompare(b.week));
      }

      function bodyCompositionModels(tables) {
        return (tables.body_composition_model || []).filter((model) => model && model.target && model.sex && !model.deleted_at);
      }

      function bodyCompositionModel(tables, target, sex) {
        const models = bodyCompositionModels(tables);
        return (
          models.find((model) => model.target === target && model.sex === sex) ||
          models.find((model) => model.target === target && model.sex === "male") ||
          null
        );
      }

      function predictBodyCompositionModel(model, features) {
        if (!model) return null;
        const featureNames = structuredValue(model.features, []);
        const means = structuredValue(model.feature_means, {});
        const scales = structuredValue(model.feature_scales, {});
        const coefficients = structuredValue(model.coefficients, {});
        if (!Array.isArray(featureNames) || !featureNames.length) return null;

        let estimate = number(coefficients.intercept);
        for (const feature of featureNames) {
          const value = Number(features[feature]);
          const mean = Number(means[feature]);
          const scale = Number(scales[feature]) || 1;
          const coefficient = Number(coefficients[feature]);
          if (!Number.isFinite(value) || !Number.isFinite(mean) || !Number.isFinite(coefficient)) return null;
          estimate += ((value - mean) / scale) * coefficient;
        }

      return estimate;
    }

      function finiteNumber(value) {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : null;
      }

      function safeLog10(value) {
        const parsed = finiteNumber(value);
        if (!parsed || parsed <= 0) return null;
        return Math.log10(parsed);
      }

      function bodyFatVote({
        id,
        label,
        source,
        value,
        weight,
        confidence = "medium",
        inputs = [],
        notes = "",
      }) {
        const parsed = finiteNumber(value);
        if (!Number.isFinite(parsed)) return null;
        return {
          id,
          label,
          source,
          value: clamp(parsed, 5, 45),
          weight: Math.max(0, number(weight)),
          confidence,
          inputs,
          notes,
        };
      }

      function bodyFatEnsembleEstimate({
        profile,
        features,
        measurements,
        bodyRow,
        rawBodyFat,
        modelSigma,
        stalePenalty,
        interpolationPenalty,
        baseline,
        currentReference,
        strengthValue,
        strengthTrend,
      }) {
        const sex = (profile.sex || "male").toLowerCase();
        const heightCm = finiteNumber(features.height_cm);
        const heightM = heightCm ? heightCm / 100 : null;
        const waist = finiteNumber(measurements.waist?.value);
        const hip = finiteNumber(measurements.hip?.value);
        const neck = finiteNumber(measurements.neck?.value);
        const arm = finiteNumber(measurements.upperArm?.value);
        const chest = finiteNumber(measurements.chest?.value);
        const calf = finiteNumber(measurements.calf?.value);
        const bodyWeight = finiteNumber(bodyRow.bodyWeight);
        const loggedBodyFat = finiteNumber(bodyRow.loggedBodyFat);
        const waistReliability = measurementReliability(measurements.waist);
        const hipReliability = measurementReliability(measurements.hip);
        const neckReliability = measurementReliability(measurements.neck);
        const armReliability = measurementReliability(measurements.upperArm);
        const chestReliability = measurementReliability(measurements.chest);
        const calfReliability = measurementReliability(measurements.calf);

        const baselineArm = finiteNumber(baseline?.upperArm);
        const baselineWaist = finiteNumber(baseline?.waist);
        const baselineWeight = finiteNumber(baseline?.bodyWeight);
        const armDelta = Number.isFinite(arm) && Number.isFinite(baselineArm) ? arm - baselineArm : 0;
        const waistDelta = Number.isFinite(waist) && Number.isFinite(baselineWaist) ? waist - baselineWaist : 0;
        const weightDelta = Number.isFinite(bodyWeight) && Number.isFinite(baselineWeight) ? bodyWeight - baselineWeight : 0;
        const referenceArm = finiteNumber(currentReference?.upperArm);
        const referenceWaist = finiteNumber(currentReference?.waist);
        const referenceWeight = finiteNumber(currentReference?.bodyWeight);
        const referenceStrength = finiteNumber(currentReference?.strengthValue);
        const armBehindReference = Number.isFinite(arm) && Number.isFinite(referenceArm) ? Math.max(0, referenceArm - arm) : 0;
        const waistAboveReference = Number.isFinite(waist) && Number.isFinite(referenceWaist) ? Math.max(0, waist - referenceWaist) : 0;
        const weightAboveReference = Number.isFinite(bodyWeight) && Number.isFinite(referenceWeight) ? Math.max(0, bodyWeight - referenceWeight) : 0;
        const strengthBehindReference =
          Number.isFinite(strengthValue) && Number.isFinite(referenceStrength) && referenceStrength > 0
            ? Math.max(0, (referenceStrength - strengthValue) / referenceStrength)
            : 0;
        const frameScoreBase =
          (Number.isFinite(chest) && chest >= 116 ? 0.25 * chestReliability : 0) +
          (Number.isFinite(calf) && calf >= 46 ? 0.2 * calfReliability : 0) +
          (Number.isFinite(neck) && neck >= 41 ? 0.2 * neckReliability : 0) +
          (Number.isFinite(arm) && arm >= 39 ? 0.25 * armReliability : 0);
        const longitudinalMismatch = clamp(
          (armBehindReference > 0.45 ? armBehindReference * 0.34 : 0) +
            (waistAboveReference > 0.4 ? waistAboveReference * 0.045 : 0) +
            (weightAboveReference > 0.5 ? weightAboveReference * 0.035 : 0) +
            strengthBehindReference * 0.55,
          0,
          1
        );
        const positiveMorphologyTrust = clamp(
          1 -
            longitudinalMismatch * 0.75 -
            (armBehindReference > 0.4 ? (armBehindReference - 0.4) * 0.18 : 0) -
            strengthBehindReference * 0.65,
          0.16,
          1
        );
        const frameScore = frameScoreBase * clamp(1 - longitudinalMismatch * 0.45, 0.45, 1);
        const recompositionSignal = clamp(
          (armDelta > 0.5 ? 0.34 : 0) +
            (waistDelta < -0.5 ? 0.24 : 0) +
            (weightDelta < 0.5 ? 0.16 : 0) +
            (strengthTrend > 0.02 ? 0.18 : 0) +
            frameScore * 0.25,
          0,
          1
        );
        const waistTrust = clamp(1 - recompositionSignal * 0.35 - frameScore * 0.12, 0.55, 1);
        const circumferenceTrust = clamp(waistTrust * (1 - longitudinalMismatch * 0.38), 0.32, 1);
        const measuredCircumferenceCount = [waist, hip, neck, arm, chest, calf].filter(Number.isFinite).length;

        const votes = [];
        const addVote = (vote) => {
          if (vote && vote.weight > 0) votes.push(vote);
        };

        addVote(
          bodyFatVote({
            id: "nhanes",
            label: "NHANES DXA regression",
            source: "NHANES 2017-2018 DXA-derived local regression",
            value: rawBodyFat,
            weight: 0.42 - longitudinalMismatch * 0.22,
            confidence: "medium",
            inputs: ["weight", "height", "BMI", "waist", "hip", "upper arm", "sex", "age"],
            notes: longitudinalMismatch > 0.2
              ? "Down-weighted because later arm/strength evidence suggests this older heavier point may be over-counting lean mass."
              : "Primary population DXA model; kept visible even when athlete morphology disagrees.",
          })
        );

        if (heightCm && waist) {
          const rfm = sex === "female" ? 76 - 20 * (heightCm / waist) : 64 - 20 * (heightCm / waist);
          addVote(
            bodyFatVote({
              id: "rfm",
              label: "RFM circumference",
              source: "Relative Fat Mass formula",
              value: rfm,
              weight: 0.14 * circumferenceTrust * waistReliability,
              confidence: circumferenceTrust < 0.75 ? "low" : "medium",
              inputs: ["height", "waist", "sex"],
              notes: circumferenceTrust < 0.75 ? "Down-weighted because morphology/strength signals make waist less decisive." : "",
            })
          );
        }

        if (heightCm && waist && neck) {
          let denominator = null;
          if (sex === "female" && hip) {
            const circumferenceLog = safeLog10(waist + hip - neck);
            const heightLog = safeLog10(heightCm);
            if (circumferenceLog && heightLog) denominator = 1.29579 - 0.35004 * circumferenceLog + 0.221 * heightLog;
          } else {
            const circumferenceLog = safeLog10(waist - neck);
            const heightLog = safeLog10(heightCm);
            if (circumferenceLog && heightLog) denominator = 1.0324 - 0.19077 * circumferenceLog + 0.15456 * heightLog;
          }
          const navy = denominator && denominator > 0 ? 495 / denominator - 450 : null;
          addVote(
            bodyFatVote({
              id: "navy",
              label: "Navy circumference",
              source: "Navy-style circumference equation",
              value: navy,
              weight: 0.12 * circumferenceTrust * Math.min(waistReliability, neckReliability),
              confidence: "medium",
              inputs: sex === "female" ? ["height", "waist", "hip", "neck", "sex"] : ["height", "waist", "neck", "sex"],
              notes:
                measurements.neck?.direction === "future"
                  ? "Future-carried neck measurement is damped; useful check, not old-date truth."
                  : "Useful check against waist-only models because neck partly captures frame.",
            })
          );
        }

        if (heightM && hip) {
          const bai = hip / Math.pow(heightM, 1.5) - 18;
          addVote(
            bodyFatVote({
              id: "bai",
              label: "BAI hip-height",
              source: "Body Adiposity Index formula",
              value: bai,
              weight: 0.06 * hipReliability,
              confidence: "low",
              inputs: ["hip", "height"],
              notes: "Low-weight comparator; hip is stable here, so it mainly stops waist from acting alone.",
            })
          );
        }

        if (Number.isFinite(loggedBodyFat) && loggedBodyFat >= 5 && loggedBodyFat <= 45) {
          addVote(
            bodyFatVote({
              id: "logged-scale",
              label: "Logged scale body fat",
              source: "User logged scale/BIA reading",
              value: loggedBodyFat,
              weight: 0.16,
              confidence: "low-medium",
              inputs: ["logged body-fat %"],
              notes: "Observed signal, but BIA/scale values are noisy and do not overwrite the ensemble.",
            })
          );
        }

        const morphologySupport =
          Math.max(0, armDelta) * 0.42 +
          Math.max(0, -waistDelta) * 0.08 +
          Math.max(0, -weightDelta) * 0.05 +
          Math.max(0, strengthTrend) * 3.5 +
          frameScore * 0.8;
        const morphologyGuard = clamp(morphologySupport * positiveMorphologyTrust, 0, 2.4);
        if (morphologyGuard > 0.25 && Number.isFinite(rawBodyFat)) {
          addVote(
            bodyFatVote({
              id: "morphology-check",
              label: "Morphology consistency check",
              source: "Local longitudinal morphology/strength correction",
              value: rawBodyFat - morphologyGuard,
              weight: 0.08 + 0.04 * recompositionSignal,
              confidence: measuredCircumferenceCount >= 4 ? "medium" : "low",
              inputs: ["arm change", "waist change", "weight change", "frame measures", "strength trend"],
              notes: positiveMorphologyTrust < 0.7
                ? "Damped because this point is behind later arm/strength evidence; not allowed to create an old lean-mass peak."
                : "Only protects against implausible lean-mass loss; it is not a standalone body-fat formula.",
            })
          );
        }

        const longitudinalPenalty = clamp(
          armBehindReference * 1.08 * Math.max(0.45, armReliability) +
            waistAboveReference * 0.12 * Math.max(0.45, waistReliability) +
            weightAboveReference * 0.1 +
            strengthBehindReference * 2.8,
          0,
          5.2
        );
        if (longitudinalPenalty > 0.25 && Number.isFinite(rawBodyFat)) {
          addVote(
            bodyFatVote({
              id: "longitudinal-morphology",
              label: "Longitudinal morphology check",
              source: "Local arm/waist/weight/strength time-series correction",
              value: rawBodyFat + longitudinalPenalty,
              weight: 0.12 + 0.18 * longitudinalMismatch,
              confidence: armBehindReference > 0.8 && strengthBehindReference > 0.05 ? "medium" : "low-medium",
