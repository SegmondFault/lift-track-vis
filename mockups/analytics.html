<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>lift-track-vis · Analytics Mockup</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="phone-shell" aria-label="Analytics mobile mockup">
      <header class="status-bar">
        <span>09:42</span>
        <span>LTE 82%</span>
      </header>

      <section class="screen">
        <div class="topline">
          <div>
            <p class="eyebrow">Progress</p>
            <h1>Stats</h1>
          </div>
          <button class="icon-button" aria-label="Settings">...</button>
        </div>

        <nav class="tabs" aria-label="Mockup pages">
          <a href="index.html">Log</a>
          <a href="exercise-setup.html">Setup</a>
          <a href="location-resolver.html">Places</a>
          <a href="analytics.html" class="active">Stats</a>
        </nav>

        <section class="mock-section">
          <div class="section-head">
            <h2>Analytics</h2>
            <button class="small-button">1Y</button>
          </div>
          <div class="chart-card">
            <span class="chart-title">Weekly volume by muscle group</span>
            <div class="bars">
              <i style="height: 34%"></i>
              <i style="height: 62%"></i>
              <i style="height: 48%"></i>
              <i style="height: 76%"></i>
              <i style="height: 54%"></i>
              <i style="height: 88%"></i>
            </div>
          </div>
          <div class="metric-grid">
            <div>
              <strong>+12%</strong>
              <small>Row volume</small>
            </div>
            <div>
              <strong>82.4 kg</strong>
              <small>Body mass</small>
            </div>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
